<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>관리자 회사 목록 / 구독 이력</title>

<!-- Toast UI Grid CSS -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

<!-- 공통 CSS -->
<link th:href="@{/css/general.css}" rel="stylesheet" />

<style>
/* 카드가 내용 높이에 맞게만 보이도록 */
.card-ui.card-ui--grid {
	height: auto !important;
}

.card-ui__body {
	padding: 0 !important;
	height: auto !important;
}

.grid-root {
	height: auto !important;
}

/* 회사 상세 카드 전용 – 스크롤 영역 */
.company-detail-card .card-ui__body {
	padding: 10px 12px !important;
}

</style>
</head>
<body>
	<div layout:fragment="content" class="page page-fluid">

		<!-- 검색 영역 -->
		<section class="card-ui card-ui--search"
			style="margin-top: 10px; display: flex;">
			<div class="card-ui__body"
				style="flex: 1; display: flex; align-items: center; padding: 0 12px">
				<div class="filter-bar row g-4 align-items-center col-md-12">
					<!-- 회사명 -->
					<div class="col-12 col-md-3">
						<div class="field-inline">
							<label for="searchCompanyName" class="field-inline__label">회사명</label>
							<input id="searchCompanyName" type="text"
								class="form-control input-base" style="flex: 1; min-width: 0" />
						</div>
					</div>
					<!-- 대표자 -->
					<div class="col-12 col-md-3">
						<div class="field-inline">
							<label for="searchCeoName" class="field-inline__label">대표자</label>
							<input id="searchCeoName" type="text"
								class="form-control input-base" style="flex: 1; min-width: 0" />
						</div>
					</div>
					<div class="col-12 col-md-2 ms-auto text-end">
						<button type="button" class="btn btn-color btn-outer"
							onclick="searchCompany()">조회</button>
					</div>
				</div>
			</div>
		</section>

		<!-- 회사 목록 -->
		<section class="card-ui card-ui--grid section-flex">
			<header class="card-ui__header">
				<h6 class="card-ui__title">회사 목록</h6>
			</header>
			<div class="card-ui__body p-0">
				<div id="companyGrid" class="grid-root"></div>
			</div>
		</section>

		<!-- 회사 상세 (체크박스 선택 시 노출) -->
		<section id="companyDetailSection"
			class="card-ui company-detail-card section-fixed">
			<header class="card-ui__header">
				<h6 class="card-ui__title">회사 상세 정보</h6>
				<div>
					<button type="button" class="btn btn-inner btn-white"
						id="btnCompanyReset">초기화</button>
					<button type="button" class="btn btn-inner btn-color"
						id="btnCompanySave">저장</button>
				</div>
			</header>
			<div class="card-ui__body section-scroll">
				<form id="companyForm">
					<div class="form-grid">

						<!-- 1행: 회사코드 / 회사명 -->
						<div class="form-grid__row">
							<div class="form-grid__label">회사코드</div>
							<div class="form-grid__field">
								<input type="text" class="input-base" id="detailCompanyCode"
									name="companyCode" readonly>
							</div>
							<div class="form-grid__label">회사명</div>
							<div class="form-grid__field">
								<input type="text" class="input-base" id="detailCompanyName"
									name="companyName">
							</div>
						</div>

						<!-- 2행: 대표자 / 사업자번호 -->
						<div class="form-grid__row">
							<div class="form-grid__label">대표자</div>
							<div class="form-grid__field">
								<input type="text" class="input-base" id="detailCeoName"
									name="ceoName">
							</div>
							<div class="form-grid__label">사업자번호</div>
							<div class="form-grid__field">
								<input type="text" class="input-base" id="detailBizNo"
									name="businessNumber">
							</div>
						</div>

						<!-- 3행: 대표번호 / 담당자 번호 -->
						<div class="form-grid__row">
							<div class="form-grid__label">대표번호</div>
							<div class="form-grid__field">
								<input type="text" class="input-base" id="detailTel" name="tel">
							</div>
							<div class="form-grid__label">담당자 번호</div>
							<div class="form-grid__field">
								<input type="text" class="input-base" id="detailManagerTel"
									name="managerTel">
							</div>
						</div>

						<!-- 4행: 회사 이메일 / 담당자 -->
						<div class="form-grid__row">
							<div class="form-grid__label">회사 이메일</div>
							<div class="form-grid__field">
								<input type="email" class="input-base" id="detailEmail"
									name="email">
							</div>
							<div class="form-grid__label">담당자</div>
							<div class="form-grid__field">
								<input type="text" class="input-base" id="detailManagerName"
									name="managerName">
							</div>
						</div>

						<!-- 5행: 주소 (넓게) -->
						<div class="form-grid__row">
							<div class="form-grid__label">주소</div>
							<div class="form-grid__field form-grid__field--wide">
								<input type="text" class="input-base" id="detailAddress"
									name="address">
							</div>
						</div>

					</div>
				</form>
			</div>
		</section>

		<!-- 구독 이력 모달 (공통 modal-layer 사용) -->
		<div id="subscribeModal" class="modal-layer" hidden>
			<div class="modal-layer__backdrop" onclick="closeSubscribeModal()"></div>

			<div class="modal-layer__dialog">
				<header class="modal-card__header">
					<h2 class="modal-card__title">구독 이력</h2>
					<button type="button" class="modal-card__btn-close"
						onclick="closeSubscribeModal()">✖</button>
				</header>

				<div class="modal-card__body">
					<!-- 회사 기본 정보 라인 -->
					<div class="modal-history__info-row">
						<div class="modal-history__field">
							<div class="modal-history__label">회사 코드</div>
							<div class="modal-history__value" id="modalComCode"></div>
						</div>
						<div class="modal-history__field">
							<div class="modal-history__label">회사명</div>
							<div class="modal-history__value" id="modalComName"></div>
						</div>
					</div>

					<!-- 구독 이력 Grid -->
					<div id="subscribeGrid" class="grid-root"></div>
				</div>
			</div>
		</div>

		<!-- ToastUI JS -->
		<script
			src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
		<script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
		<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
		<script th:src="@{/js/sb/sbManage.js}"></script>
	</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>카드 등록 완료</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 480px;
            margin: 80px auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
        }

        .success-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e8f7ee;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .success-icon span {
            font-size: 32px;
            color: #1abc66;
        }

        .info-card {
            background: #f8f9fb;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 18px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #777;
        }

        .info-value {
            font-weight: 600;
            color: #222;
        }

        .btn-area {
            margin-top: 24px;
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            border-radius: 10px;
            border: none;
            padding: 11px 0;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #0052ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #0041cc;
        }

        .btn-secondary {
            background: #e9ecf5;
            color: #333;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 14px;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container {
                margin: 40px 16px;
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="success-icon">
        <span>✓</span>
    </div>

    <div class="title">카드 등록이 완료되었어요</div>
    <div class="subtitle">
        자동결제에 사용할 카드가 정상적으로 등록되었습니다.
    </div>

    <div class="info-card">
        <div class="info-row">
            <div class="info-label">결제 카드</div>
         <!--    <div class="info-value" th:text="${cardCompany} + ' ' + ${cardNumberMask}">
                KB국민카드 ****-****-****-1234
            </div> -->
        </div>
        <div class="info-row">
            <div class="info-label">구독 상품</div>
           <!--  <div class="info-value" th:text="${planName}">
                Standard 요금제
            </div> -->
        </div>
        <div class="info-row">
            <div class="info-label">다음 결제일</div>
           <!--  <div class="info-value" th:text="${#temporals.format(nextBillingDate, 'yyyy.MM.dd')}">
                2025.03.01
            </div> -->
        </div>
    </div>

    <div class="btn-area">
        <!-- 내 구독 목록으로 이동 -->
        <button class="btn btn-primary"
                onclick="location.href='/mypage/subscription'">
            내 구독 관리
        </button>

        <!-- 메인으로 -->
        <button class="btn btn-secondary"
                onclick="location.href='/'">
            메인으로
        </button>
    </div>

    <div class="help-text">
        정기결제는 매월 자동으로 진행되며,<br/>
        결제 실패 시 안내 메시지를 통해 알려드릴게요.
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>결제 완료</title>

<style>
  :root {
    --primary: #2563eb;
    --border: #e5e7eb;
    --text-main: #111827;
    --text-sub: #6b7280;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; /* ★ 전체 글자 크게 */
  }

  .subscription-card {
    padding: 18px 20px; /* ★ 여백 줄임 */
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
  }

  .subscription-card-title {
    font-size: 20px; /* ★ 제목 크게 */
    font-weight: 600;
    margin-bottom: 12px;
  }

  .subscription-grid {
    display: flex;
    gap: 18px; /* ★ 간격 좁힘 */
  }

  .subscription-section {
    flex: 1;
    min-width: 250px;
    padding-right: 12px;
    border-right: 1px solid var(--border);
  }

  .subscription-section:last-child {
    padding-right: 0;
    border-right: none;
  }

  .section-header {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-sub);
  }

  .plan-badge {
    display: inline-flex;
    padding: 8px 12px; /* ★ 줄임 */
    border-radius: 18px;
    background: #111827;
    color: #fff;
    font-size: 14px; /* ★ 크게 */
    margin-bottom: 8px;
  }

  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 12px;
    background: rgba(22,163,74,0.1);
    color: #16a34a;
  }

  .info-list div {
    margin: 2px 0; /* ★ 항목 간격 축소 */
    font-size: 14px;
  }

  .module-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px; /* ★ 간격 줄임 */
  }

  .chip {
    padding: 6px 10px;
    border-radius: 14px;
    font-size: 13px; /* ★ 크게 */
    background: #f3f4f6;
    border: 1px solid #d1d5db;
  }

  .chip-active {
    background: rgba(37, 99, 235, 0.1);
    border-color: rgba(37, 99, 235, 0.4);
    color: #1d4ed8;
  }

  .usage-stats div,
  .payment-info div {
    margin: 2px 0; /* ★ 간격 축소 */
    font-size: 14px;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 14px; /* ★ 아래 버튼 여백 줄임 */
  }

  .btn {
    padding: 7px 14px;
    border-radius: 18px;
    font-size: 14px; /* ★ 크게 */
    font-weight: 500;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }

  .btn-ghost {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text-main);
  }
</style>


</head>

<body>
	<div layout:fragment="content">
		<div class="payment-page">

			<div class="title">결제가 완료되었습니다.</div>

			<div class="table-box">

				<div class="row">
					<div>주문번호</div>
					<div th:text="${payment.orderId}"></div>
				</div>

				<div class="row">
					<div>결제금액</div>
					<div>
						<span
							th:text="${#numbers.formatInteger(payment.totalAmount, 0, 'COMMA')}"></span>원
					</div>
				</div>

				<div class="row">
					<div>승인일시</div>
					<div th:text="${payment.approvedAt}"></div>
				</div>

				<div class="row">
					<div>결제수단</div>
					<div th:text="${payment.method}"></div>
				</div>

				<div class="row">
					<div>카드사명</div>
					<div th:text="${payment.cardCompany}"></div>
				</div>
				<p>관리자 계정이 생성되었습니다!</p>
				<div class="row">
					<div>로그인아이디</div>
					<div th:text="${payment.userId}"></div>
				</div>
				<div class="row">
					<div>로그인비밀번호</div>
					<div th:text="${payment.password}"></div>
				</div>

			</div>

			<div class="btn-area">
				<a href="/" class="btn-confirm">확인</a>
			</div>

		</div>
	</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8">
  <title>결제 완료</title>




  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e5e7eb;
      --text:#111827;
      --muted:#6b7280;
      --primary:#111827; /* 기획서 느낌: 블랙 버튼 */
      --shadow:0 10px 30px rgba(17,24,39,.08);
    }

    .wrap{
      max-width: 820px;
      margin: 18px auto;
      padding: 18px;
    }

    .panel{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px 22px 18px;
    }

    .title{
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      color: var(--text);
      margin: 6px 0 18px;
      letter-spacing: -0.2px;
    }

    /* 기획서 같은 “한 줄 라벨-값” */
    .form{
      margin: 0 auto;
      max-width: 520px;
    }

    .line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .label{
      color: var(--text);
      font-weight: 900;
      white-space: nowrap;
    }

    .value{
      color: var(--text);
      font-weight: 900;
      text-align: right;
      word-break: break-word;
    }

    .value.muted{
      color: var(--muted);
      font-weight: 800;
    }

    /* 계정 박스(분리) */
    .account-box{
      margin: 16px auto 0;
      max-width: 560px;
      border: 1px solid rgba(37,99,235,.20);
      background: rgba(37,99,235,.06);
      border-radius: 16px;
      padding: 14px 14px;
    }

    .account-head{
      font-size: 14px;
      font-weight: 900;
      color: #1d4ed8;
      margin-bottom: 10px;
      display:flex;
      align-items:center;
      gap: 8px;
    }

    .account-line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px dashed rgba(37,99,235,.22);
      font-size: 14px;
    }
    .account-line:last-child{ border-bottom:none; }

    .btn-area{
      display:flex;
      justify-content:center;
      margin-top: 18px;
    }

    .btn-confirm{
      min-width: 220px;
      height: 44px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
  </style>
  
  </head>
<body>
<div layout:fragment="content">
  <div class="wrap">
    <div class="panel">

      <div class="title">결제가 완료되었습니다.</div>

      <!-- ✅ 결제 정보 (기획서 느낌 1열 폼) -->
      <div class="form">
        <!-- 구독상품은 payment에 없어서 지금 데이터로는 못 찍음 -->
        <div class="line">
          <div class="label">주문번호</div>
          <div class="value" th:text="${billing.orderId}">ORD...</div>
        </div>

        <div class="line">
          <div class="label">결제금액</div>
          <div class="value">
            <span th:text="${#numbers.formatInteger(billing.totalAmount, 0, 'COMMA')}">0</span>원
          </div>
        </div>

        <div class="line">
          <div class="label">결제수단</div>
          <div class="value" th:text="${billing.method}">간편결제</div>
        </div>

        <div class="line">
          <div class="label">결제일시</div>
          <div class="value" th:text="${billing.approvedAt}">2025-...</div>
        </div>

        <div class="line">
          <div class="label">카드사명</div>
          <div class="value muted"
               th:text="${billing.cardCompany != null and billing.cardCompany != '' ? billing.cardCompany : '-'}">-</div>
        </div>
      </div>

      <!-- ✅ 계정 정보는 아래 박스로 “분리” -->
      <div class="account-box">
        <div class="account-head">🔐 관리자 계정이 생성되었습니다!</div>

        <div class="account-line">
          <div class="label">회사코드</div>
          <div class="value" th:text="${billing.companyCode}">EMP...</div>
        </div>
        <div class="account-line">
          <div class="label">로그인아이디</div>
          <div class="value" th:text="${billing.userId}">EMP...</div>
        </div>

        <div class="account-line">
          <div class="label">로그인비밀번호</div>
          <div class="value" th:text="${billing.password}">****</div>
        </div>
      </div>

      <div class="btn-area">
        <a href="/" class="btn-confirm">확인</a>
      </div>

    </div>
  </div>

</div>
</body>
</html>

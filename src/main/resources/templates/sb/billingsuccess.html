<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8">
  <title>결제 완료</title>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #111827;
      --shadow: 0 10px 30px rgba(17, 24, 39, .08);
    }

    /* content 영역 중앙정렬 */
    .content-center {
      min-height: calc(100vh - 60px); /* 헤더 높이 맞춰 조절 */
      display: flex;
      align-items: center;   /* 세로 중앙 */
      justify-content: center; /* 가로 중앙 */
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .wrap {
      max-width: 820px;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px 22px 18px;
    }

    .title {
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      color: var(--text);
      margin: 6px 0 18px;
      letter-spacing: -0.2px;
    }

    .form {
      margin: 0 auto;
      max-width: 520px;
    }

    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .line.no-border {
      border-bottom: none;
    }

    .label {
      color: var(--text);
      font-weight: 900;
      white-space: nowrap;
    }

    .value {
      color: var(--text);
      font-weight: 900;
      text-align: right;
      word-break: break-word;
    }

    .value.muted {
      color: var(--muted);
      font-weight: 800;
    }

    /* 관리자 계정 안내 - 일반결제 화면과 동일 */
    .account-info {
      max-width: 520px;
      margin: 18px auto 0;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .account-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
    }

    .account-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .account-email {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 8px;
      word-break: break-word;
    }

    .account-notice {
      font-size: 12.5px;
      color: var(--muted);
    }

    .btn-area {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .btn-confirm {
      min-width: 220px;
      height: 44px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
<div layout:fragment="content" class="content-center">
  <div class="wrap">
    <div class="panel">

      <div class="title">결제가 완료되었습니다.</div>

      <!-- ✅ 정기결제 정보: billing 바인딩 그대로 -->
      <div class="form">

        <div class="line">
          <div class="label">주문번호</div>
          <div class="value" th:text="${billing.orderId}">ORD...</div>
        </div>

        <div class="line">
          <div class="label">결제금액</div>
          <div class="value">
            <span th:text="${#numbers.formatInteger(billing.totalAmount, 0, 'COMMA')}">0</span>원
          </div>
        </div>

        <div class="line">
          <div class="label">결제수단</div>
          <div class="value" th:text="${billing.method}">간편결제</div>
        </div>

        <div class="line">
          <div class="label">결제일시</div>
          <div class="value"
               th:text="${billing.approvedAt != null
                 ? #temporals.format(billing.approvedAt, 'yyyy-MM-dd')
                 : '-'}">
          </div>
        </div>

        <!-- ✅ 마지막 줄이라 no-border 적용(줄 2개 문제 방지) -->
        <div class="line no-border">
          <div class="label">카드사명</div>
          <div class="value muted"
               th:text="${billing.cardCompany != null and billing.cardCompany != '' ? billing.cardCompany : '-'}">-</div>
        </div>

      </div>

      <!-- ✅ 관리자 계정 안내: 일반결제 UI와 동일 -->
      <div class="account-info">
        <div class="account-title">관리자 계정이 생성되었습니다</div>
        <div class="account-desc">로그인 정보는 아래 이메일로 발송되었습니다.</div>
        <div class="account-email" th:text="${email}">example@email.com</div>
        <div class="account-notice">최초 로그인 후 반드시 비밀번호를 변경해주세요.</div>
      </div>

      <div class="btn-area">
        <a href="/" class="btn-confirm">확인</a>
      </div>

    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<title>구독 관리</title>

<!-- Toast Grid CSS -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

<style>
body {
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.page-container {
	padding: 24px 32px;
}

.card {
	background: #ffffff;
	border-radius: 16px;
	padding: 24px;
	box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
	display: flex;
	gap: 32px;
}

.card-section {
	flex: 1;
}

.card-section.right {
	text-align: right;
}

h2 {
	margin: 0;
	font-size: 20px;
	font-weight: 700;
}

h3 {
	margin: 0;
	font-size: 16px;
	font-weight: 600;
}

.plan-badges {
	margin-top: 12px;
	display: flex;
	align-items: center;
	gap: 8px;
}

.badge-plan {
	display: inline-block;
	padding: 6px 16px;
	border-radius: 999px;
	background: #111827;
	color: #ffffff;
	font-weight: 600;
}

.badge-status {
	display: inline-block;
	padding: 4px 10px;
	border-radius: 999px;
	background: #d1fae5;
	color: #16a34a;
	font-size: 12px;
}

.info-list {
	margin-top: 16px;
	font-size: 14px;
	line-height: 1.7;
}

.info-label {
	color: #6b7280;
}

.service-tags {
	margin-top: 12px;
	display: flex;
	flex-wrap: wrap;
	gap: 8px;
}

.service-tag {
	padding: 6px 14px;
	border-radius: 999px;
	border: 1px solid #e5e7eb;
	background: #ffffff;
	font-size: 13px;
}

.btn {
	border-radius: 999px;
	padding: 8px 16px;
	border: 1px solid #e5e7eb;
	background: #ffffff;
	cursor: pointer;
	font-size: 13px;
}

.btn+.btn {
	margin-left: 8px;
}

.btn-primary {
	background: #2563eb;
	border-color: #2563eb;
	color: #ffffff;
}

.section-title {
	margin: 32px 0 12px;
	font-size: 18px;
	font-weight: 600;
}

/* Toast Grid를 카드처럼 보이게 */
#paymentGrid {
	border-radius: 12px;
	overflow: hidden;
	border: 1px solid #e5e7eb;
	background: #ffffff;
}
</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-container">

			<!-- ========= 상단 구독 상세 ========= -->
			<div class="card">
				<!-- 왼쪽: 구독 상품 정보 -->
				<div class="card-section">
					<h2>구독 상세</h2>

					<div class="plan-badges">
						<!-- 요금제 이름 / 금액 -->
						<span class="badge-plan"
							th:text="${subDetail.planCode} + ' 월 ' + ${#numbers.formatInteger(subDetail.planPrice, 0, 'COMMA')} + '원'">
							Essential 월 9,900원 </span>

						<!-- 구독 상태 + 남은일수 -->
						<span class="badge-status"
							th:text="${subDetail.subsStatusLabel} + ' · D-' + ${subDetail.remainDays}">
							구독중 · D-30 </span>
					</div>

					<div class="info-list">
						<div>
							<span class="info-label">구독 기간 : </span> <span
								th:text="${subDetail.startDate}">2025-01-02</span> ~ <span
								th:text="${subDetail.endDate}">2026-01-01</span>
						</div>
						<div>
							<span class="info-label">사용자 수 : </span> <span
								th:text="${subDetail.currentUserCount}">35명</span>

						</div>
						<div>
							<span class="info-label">다음 결제일 : </span> <span
								th:text="${subDetail.nextPayment}">2026-01-02</span>
						</div>
					</div>
				</div>

				<!-- 가운데: 사용 중인 서비스 -->
				<div class="card-section">
					<h3>사용 중인 서비스</h3>
					<div class="service-tags">
						<span class="service-tag">회계</span> <span class="service-tag">인사</span>
						<span class="service-tag">영업</span>
					</div>
				</div>

				<!-- 오른쪽: 결제 정보 -->
				<div class="card-section right">
					<h3>결제 정보</h3>

					<div class="info-list" style="text-align: left;">
						<div>
							<span class="info-label">결제 수단 : </span> <span
								th:text="${subDetail.paymentMethod}"> 토스페이먼츠(****1234) </span>
						</div>
						<div>
							<span class="info-label">결제 주기 : </span> <span
								th:text="${subDetail.billingPeriod}">월 결제</span>
						</div>
						<div>
							<span class="info-label">다음 결제일 : </span> <span
								th:text="${subDetail.nextPayment}">2025-11-24</span>
						</div>
						<div>
							<span class="info-label">최근 결제일 : </span> <span
								th:text="${subDetail.recentPayment}">2025-10-24</span> (<span
								th:text="${subDetail.PaymentStat}">결제완료</span>)
						</div>
					</div>

					<div style="margin-top: 12px;">
						<button class="btn">영수증 보기</button>
						<button class="btn">세금계산서</button>
					</div>
					<div style="margin-top: 8px;">
						<button class="btn btn-primary">결제하기</button>
						<button class="btn">플랜 변경</button>
					</div>
				</div>
			</div>

			<!-- ========= 하단 결제 이력 ========= -->
			<h2 class="section-title">결제 이력</h2>
			<div id="paymentGrid"></div>

		</div>

		<!-- Toast Grid JS -->
		<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
		<!-- 결제이력용 JS -->
		<script th:src="@{/js/sbUserManage.js}"></script>
	</div>
</body>
</html>

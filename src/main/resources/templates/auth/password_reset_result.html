<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 완료</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
            color: #E2ECFF;
        }

        .panel {
            width: 460px;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
            text-align: center;
        }

        .icon {
            font-size: 52px;
            margin-bottom: 12px;
        }

        .icon.success {
            color: #6FE3A1;
        }

        .icon.fail {
            color: #ff6b6b;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 10px;
            color: #E2ECFF;
        }

        .title-sub {
            color: #AFC5E6;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: #3F4750;
            color: white;
            transition: 0.2s;
        }

        .btn-main:hover {
            background: #4B5561;
        }
    </style>
</head>

<body>

<div class="panel">

    <!-- 성공 -->
    <div th:if="${result}">
        <div class="icon success">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        <div class="title">비밀번호 변경 완료</div>
        <div class="title-sub">
            비밀번호가 성공적으로 변경되었습니다.<br>
            새 비밀번호로 로그인해 주세요.
        </div>
    </div>

    <!-- 실패 -->
    <div th:if="${!result}">
        <div class="icon fail">
            <i class="bi bi-x-circle-fill"></i>
        </div>
        <div class="title">비밀번호 변경 실패</div>
        <div class="title-sub">
            비밀번호 재설정에 실패했습니다.<br>
            다시 시도해 주세요.
        </div>
    </div>

    <button type="button"
            class="btn-main"
            onclick="location.href='/auth/login'">
        로그인 화면으로 이동
    </button>

</div>

</body>
</html>

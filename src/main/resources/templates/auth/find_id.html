<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CoreOne 아이디 찾기</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
        }

        /* 화면 카드 */
        .find-card {
            width: 420px;
            padding: 45px;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
            text-align: center;
        }

        /* 타이틀 */
        .title {
            font-size: 30px;
            font-weight: 900;
            color: #E2ECFF;
            margin-bottom: 8px;
        }
        .title-sub {
            color: #AFC5E6;
            margin-bottom: 35px;
            font-size: 15px;
        }

        /* form group */
        .form-group {
            position: relative;
            margin-bottom: 28px;
        }

        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 15px 48px 15px 15px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
        }

        .form-input::placeholder { color: transparent; }

        .form-input:focus {
            outline: none;
            border-color: #8EA6C9;
            box-shadow: 0 0 0 3px rgba(142,166,201,0.35);
        }

        /* label 애니메이션 */
        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C4D6F3;
            pointer-events: none;
            transition: 0.2s;
        }
        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: -9px;
            left: 10px;
            font-size: 13px;
            padding: 0 6px;
            background: rgba(52,59,67,0.9);
            color: #D7E6FF;
        }

        /* 오른쪽 아이콘 */
        .form-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #AFC4DF;
            font-size: 20px;
        }

        /* 버튼 공통 */
        .btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        .btn-send {
            background: #586270;
            margin-bottom: 10px;
        }
        .btn-send:hover {
            background: #676F7A;
        }

        .btn-confirm {
            background: #3F4750;
        }
        .btn-confirm:hover {
            background: #4B5561;
        }

        /* 뒤로가기 / 로그인 */
        .link-box {
            margin-top: 20px;
        }
        .link-box a {
            color: #BFD6FF;
        }
        .link-box a:hover {
            color: white;
        }

    </style>
</head>

<body>

<div class="find-card">

    <div class="title">아이디 찾기</div>
    <div class="title-sub">등록된 휴대전화번호 인증을 통해 아이디를 조회합니다</div>

    <form th:action="@{/auth/find-id}" method="post">

        <!-- 휴대폰 번호 -->
        <div class="form-group">
            <input type="text" class="form-input" id="phone" name="phone" placeholder=" ">
            <label for="phone">휴대전화번호 ('-' 제외)</label>
            <i class="bi bi-phone"></i>
        </div>

        <!-- 인증번호 전송 버튼 -->
        <button type="button" class="btn btn-send">인증번호 전송</button>

        <!-- 인증번호 입력 -->
        <div class="form-group">
            <input type="text" class="form-input" id="verifyCode" name="verifyCode" placeholder=" ">
            <label for="verifyCode">인증번호 입력</label>
            <i class="bi bi-shield-check"></i>
        </div>

        <!-- 확인 버튼 -->
        <button type="submit" class="btn btn-confirm">아이디 확인</button>

    </form>

    <div class="link-box">
        <p><a th:href="@{/auth/login}">로그인으로 돌아가기</a></p>
    </div>

</div>

</body>
</html>

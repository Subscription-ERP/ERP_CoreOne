<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CoreOne 아이디 찾기</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
            flex-direction: column;
        }
        .panel {
            width: 460px;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
        }
        .title {
            font-size: 26px;
            font-weight: 900;
            color: #E2ECFF;
            margin-bottom: 6px;
        }
        .title-sub {
            color: #AFC5E6;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 15px 48px 15px 15px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        .form-input::placeholder { color: transparent; }
        .form-input:focus {
            outline: none;
            border-color: #8EA6C9;
            box-shadow: 0 0 0 3px rgba(142,166,201,0.35);
        }
        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C4D6F3;
            pointer-events: none;
            transition: 0.2s;
        }
        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: -9px;
            left: 10px;
            font-size: 13px;
            padding: 0 6px;
            background: rgba(52,59,67,0.9);
            color: #D7E6FF;
        }
        .form-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #AFC4DF;
            font-size: 20px;
        }
        .btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .btn-dark { background: #586270; }
        .btn-dark:hover { background: #676F7A; }
        .btn-main { background: #3F4750; }
        .btn-main:hover { background: #4B5561; }

        .timer-text {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 6px;
            min-height: 18px;
        }
        
        /* =========================
		   로그인 페이지 상단 로고
		========================= */
		.login-logo {
		    position: absolute;
		    top: 40px;
		    left: 50%;
		    transform: translateX(-50%);
		}
		
		.login-logo img {
		    height: 34px;   /* 랜딩 페이지랑 동일 */
		    width: auto;
		}
		
		/* =========================
		   로그인/찾기 페이지 Footer
		========================= */
		.login-footer {
		    position: absolute;
		    bottom: 25px;
		    left: 50%;
		    transform: translateX(-50%);
		    font-size: 14px;
		    color: #fff;
		}


        
    </style>
</head>

<body>

<!-- 상단 로고 -->
<div class="login-logo">
    <a href="/" aria-label="CoreOne 메인으로 이동">
        <img src="/assets/img/coreone_logo.png" alt="CoreOne ERP">
    </a>
</div>

<div class="panel">

    <div class="title">아이디 찾기</div>
    <div class="title-sub">
        이름 / 휴대전화 / 이메일을 확인 후,<br>
        인증 성공 시 해당 이메일로 아이디를 보내드립니다.
    </div>

    <div class="form-group">
        <input type="text" class="form-input" id="name" placeholder=" ">
        <label for="name">이름</label>
        <i class="bi bi-person"></i>
    </div>

    <div class="form-group">
        <input type="text" class="form-input" id="phone" placeholder=" ">
        <label for="phone">휴대전화번호 ('-' 포함)</label>
        <i class="bi bi-phone"></i>
    </div>

    <div class="form-group">
        <input type="email" class="form-input" id="email" placeholder=" ">
        <label for="email">E-MAIL</label>
        <i class="bi bi-envelope"></i>
    </div>

    <div class="timer-text" id="timerArea"></div>

    <button type="button" class="btn btn-dark" onclick="sendAuthCode()" style="margin-bottom: 20px;">
        인증번호 전송
    </button>

    <div class="form-group">
        <input type="text" class="form-input" id="authCode" placeholder=" ">
        <label for="authCode">인증번호 입력</label>
        <i class="bi bi-shield-check"></i>
    </div>

    <button type="button" class="btn btn-main" onclick="findUserId()">
        이메일로 아이디 받기
    </button>
    
    <button type="button"
        class="btn btn-dark"
        style="margin-top: 14px;"
        onclick="location.href='/auth/login'">
    로그인 화면으로 돌아가기
</button>

</div>


<!-- 하단 footer -->
<div class="login-footer">
  <span>© 2025 RootCore · CoreOne ERP Project</span>
</div>


<script>
    let timer = null;
    let remainSeconds = 0;

    function startTimer() {
        clearInterval(timer);
        remainSeconds = 300; // 5분

        const timerArea = document.getElementById("timerArea");

        timer = setInterval(() => {
            if (remainSeconds <= 0) {
                clearInterval(timer);
                timerArea.innerText = "인증번호 입력 시간이 초과되었습니다. 다시 인증번호를 요청해 주세요.";
                document.getElementById("authCode").value = "";
                return;
            }

            const min = Math.floor(remainSeconds / 60);
            const sec = remainSeconds % 60;
            timerArea.innerText = `인증번호 유효시간: ${min}분 ${sec}초 남음`;
            remainSeconds--;
        }, 1000);
    }

    /* 1) 인증번호 전송 */
    function sendAuthCode() {
        const phone = document.getElementById("phone").value;

        if (!phone) {
            alert("휴대전화번호를 입력해 주세요.");
            return;
        }

        fetch("/auth/send_code", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: "phone=" + encodeURIComponent(phone)
        })
        .then(res => res.text())
        .then(result => {
            if (result === "OK") {
                alert("인증번호를 전송했습니다.");
                startTimer();
            } else {
                alert("인증번호 전송에 실패했습니다.");
            }
        });
    }

    /* 2) 인증번호 검증 + 아이디 메일 발송 */
    function findUserId() {
        const name  = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const email = document.getElementById("email").value;
        const code  = document.getElementById("authCode").value;

        if (!name || !phone || !email) {
            alert("이름 / 휴대전화 / 이메일을 모두 입력해주세요.");
            return;
        }

        if (!code) {
            alert("인증번호를 입력해주세요.");
            return;
        }

        // 1단계: 인증번호 검증
        fetch("/auth/verify_code", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: `phone=${encodeURIComponent(phone)}&code=${encodeURIComponent(code)}`
        })
        .then(res => res.text())
        .then(valid => {
            if (valid !== "true") {
                alert("인증번호가 올바르지 않거나 만료되었습니다.");
                return;
            }

            // 2단계: 아이디를 이메일로 발송
            fetch("/auth/find_id_do", {
                method: "POST",
                headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: `name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&email=${encodeURIComponent(email)}`
            })
            .then(res => res.text())
            .then(result => {
                if (result === "OK") {
                    alert("입력하신 이메일로 아이디를 전송했습니다.");
                } else {
                    alert("일치하는 회원 정보가 없습니다.");
                }
            });
        });
    }
</script>

</body>
</html>

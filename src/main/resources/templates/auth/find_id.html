<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CoreOne 아이디 / 비밀번호 찾기</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
            flex-direction: column;
        }

        .container-wrap {
            width: 900px;
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            flex: 1;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            color: #E2ECFF;
            margin-bottom: 6px;
        }

        .title-sub {
            color: #AFC5E6;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            position: relative;
            margin-bottom: 28px;
        }

        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 15px 48px 15px 15px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }

        .form-input::placeholder { color: transparent; }

        .form-input:focus {
            outline: none;
            border-color: #8EA6C9;
            box-shadow: 0 0 0 3px rgba(142,166,201,0.35);
        }

        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C4D6F3;
            pointer-events: none;
            transition: 0.2s;
        }

        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: -9px;
            left: 10px;
            font-size: 13px;
            padding: 0 6px;
            background: rgba(52,59,67,0.9);
            color: #D7E6FF;
        }

        .form-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #AFC4DF;
            font-size: 20px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        .btn-dark { background: #586270; }
        .btn-dark:hover { background: #676F7A; }

        .btn-main { background: #3F4750; }
        .btn-main:hover { background: #4B5561; }

        .back-login {
            text-align: center;
            width: 100%;
        }

        .back-login a {
            color: #BFD6FF;
            font-size: 15px;
        }

        .back-login a:hover { color: white; }
    </style>
</head>

<body>

<div class="container-wrap">

    <!-- 왼쪽 : 아이디 찾기 -->
    <div class="panel">

        <div class="title">아이디 찾기</div>
        <div class="title-sub">등록된 휴대전화번호 인증 후 아이디를 확인합니다</div>

        <div class="form-group">
            <input type="text" class="form-input" id="name" placeholder=" ">
            <label for="name">이름</label>
            <i class="bi bi-person"></i>
        </div>

        <div class="form-group">
            <input type="text" class="form-input" id="phone" placeholder=" ">
            <label for="phone">휴대전화번호 ('-' 제외)</label>
            <i class="bi bi-phone"></i>
        </div>

        <button type="button" class="btn btn-dark" onclick="sendAuthCode()" style="margin-bottom: 28px;">
            인증번호 전송
        </button>

        <div class="form-group">
            <input type="text" class="form-input" id="authCode" placeholder=" ">
            <label for="authCode">인증번호 입력</label>
            <i class="bi bi-shield-check"></i>
        </div>

        <button type="button" class="btn btn-main" onclick="findUserId()">
            아이디 확인
        </button>
    </div>

    <!-- 오른쪽 : 비밀번호 재설정 -->
    <div class="panel">

        <div class="title">비밀번호 재설정</div>
        <div class="title-sub">입력하신 이메일로 재설정 링크를 발송합니다</div>

        <form th:action="@{/auth/password/reset-link}" method="post">

            <div class="form-group">
                <input type="text" class="form-input" id="userName" name="userName" placeholder=" ">
                <label for="userName">이름</label>
                <i class="bi bi-person"></i>
            </div>

            <div class="form-group">
                <input type="text" class="form-input" id="userId" name="userId" placeholder=" ">
                <label for="userId">아이디</label>
                <i class="bi bi-person-badge"></i>
            </div>

            <div class="form-group">
                <input type="email" class="form-input" id="email" name="email" placeholder=" ">
                <label for="email">E-MAIL</label>
                <i class="bi bi-envelope"></i>
            </div>

            <button type="submit" class="btn btn-main">
                재설정 링크 발송
            </button>

        </form>
    </div>

</div>

<div class="back-login">
    <a th:href="@{/auth/login}">로그인으로 돌아가기</a>
</div>

<script>

/* 1) 인증번호 전송 */
function sendAuthCode() {
    const phone = document.getElementById("phone").value;

    fetch("/auth/send_code", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "phone=" + phone
    })
    .then(res => res.text())
    .then(result => {
        if (result === "OK") alert("인증번호가 전송되었습니다.");
    });
}

/* 2) 아이디 찾기 */
function findUserId() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const code = document.getElementById("authCode").value;

    // 먼저 인증번호 검증
    fetch("/auth/verify_code", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: `phone=${phone}&code=${code}`
    })
    .then(res => res.text())
    .then(valid => {
        if (valid !== "true") {
            alert("인증번호가 올바르지 않습니다.");
            return;
        }

        // 인증 성공 → 아이디 찾기
        fetch("/auth/find_id_do", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: `name=${name}&phone=${phone}`
        })
        .then(res => res.text())
        .then(userId => {
            if (!userId) {
                alert("일치하는 아이디가 없습니다.");
            } else {
                alert("회원님의 아이디는: " + userId);
            }
        });
    });
}

</script>

</body>
</html>

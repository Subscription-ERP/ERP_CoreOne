<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CoreOne 로그인</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
        }

        /* 중앙 Login form */
        .login-card {
            width: 400px;
            padding: 45px;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
            text-align: center;
        }

        /* 타이틀 */
        .logo-title {
            font-size: 34px;
            font-weight: 900;
            color: #E2ECFF;
            margin-bottom: 5px;
        }
        .logo-sub {
            color: #AFC5E6;
            margin-bottom: 35px;
            font-size: 15px;
        }

        /* form group */
        .form-group {
            position: relative;
            margin-bottom: 28px;
        }

        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 15px 48px 15px 15px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
        }

        .form-input::placeholder { color: transparent; }

        .form-input:focus {
            outline: none;
            border-color: #8EA6C9;
            box-shadow: 0 0 0 3px rgba(142,166,201,0.35);
        }

        
        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C4D6F3;
            pointer-events: none;
            transition: 0.2s;
        }

        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: -9px;
            left: 10px;
            font-size: 13px;
            padding: 0 6px;
            background: rgba(52,59,67,0.9);
            color: #D7E6FF;
        }

        /* 오른쪽 아이콘 */
        .form-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #AFC4DF;
            font-size: 20px;
        }

        /* 기억하기 */
        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: #D7E6FF;
        }

        /* login버튼 */
        .btn-login {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            background: #3F4750;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-login:hover {
            background: #4B5561;
        }

        /* 링크 */
        .login-links {
            margin-top: 18px;
        }
        .login-links a {
            color: #BFD6FF;
        }
        .login-links a:hover {
            color: white;
        }

    </style>
</head>

<body>

<div class="login-card">

    <div class="logo-title">CoreOne ERP</div>
    <div class="logo-sub">구독형 ERP 시스템</div>

    <form th:action="@{/auth/login}" method="post">

        <div class="form-group">
            <input type="text" class="form-input" id="companyCode" name="companyCode" placeholder=" ">
            <label for="companyCode">회사코드</label>
            <i class="bi bi-building"></i>
        </div>

        <div class="form-group">
            <input type="text" class="form-input" id="userId" name="userId" placeholder=" ">
            <label for="userId">사원번호(ID)</label>
            <i class="bi bi-person-badge"></i>
        </div>

        <div class="form-group">
            <input type="password" class="form-input" id="password" name="password" placeholder=" ">
            <label for="password">비밀번호</label>
            <i class="bi bi-lock-fill"></i>
        </div>

        <div class="remember-wrap">
            <input type="checkbox" id="rememberId">
            <label for="rememberId">아이디 기억하기</label>
        </div>

        <button type="submit" class="btn-login">로그인</button>

    </form>

    <div class="login-links">
    	<p><a th:href="@{/auth/find_id}">아이디 찾기</a></p>   
    	<p><a th:href="@{/auth/password-find}">비밀번호 찾기</a></p>
        <p><a th:href="@{/subscribe/start}">신규가입 / 구독 신청</a></p>
    </div>

</div>

</body>
</html>

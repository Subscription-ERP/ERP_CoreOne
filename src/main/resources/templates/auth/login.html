<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>RootCore 로그인</title>

    <!-- Bootstrap / AdminLTE 기본 CSS -->
    <link rel="stylesheet" href="/css/adminlte.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1d3557, #457b9d);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
            color: #fff;
        }

        .login-card {
            width: 420px;
            padding: 40px 45px 45px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .login-title {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .input-wrap {
            width: 100%;
            margin-bottom: 18px;
            text-align: left;
        }

        .input-wrap label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
            font-weight: 600;
        }

        .input-wrap input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .input-wrap input::placeholder {
            color: #ddd;
        }

        .remember-wrap {
            margin: 10px 0 20px;
            text-align: left;
            font-size: 14px;
        }

        .remember-wrap input[type="checkbox"] {
            margin-right: 6px;
            transform: scale(1.1);
        }

        .login-btn {
            width: 100%;
            height: 48px;
            background: #1d3557;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            margin-bottom: 18px;
            transition: 0.25s;
        }

        .login-btn:hover {
            background: #16324f;
        }

        .etc-menu {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
        }

        .etc-menu a {
            color: #fff;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>

</head>
<body>

<div class="login-card">

    <div class="login-title">RootCore 로그인</div>

    <!-- 로그인 FORM -->
    <form method="post" action="/auth/doLogin">


        <!-- ID 입력 -->
        <div class="input-wrap">
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId" th:value="${savedId}" placeholder="아이디를 입력하세요" required />
        </div>

        <!-- PW 입력 -->
        <div class="input-wrap">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required />
        </div>

        <!-- 아이디 기억하기 -->
        <div class="remember-wrap">
            <!-- ★ 수정된 부분: name="rememberId" 추가됨 -->
            <input type="checkbox" id="rememberId" name="rememberId" 
                   th:checked="${savedId != null}" />
            <label for="rememberId">아이디 기억하기</label>
        </div>

        <!-- 로그인 버튼 -->
        <button type="submit" class="login-btn">로그인</button>

    </form>

    <!-- 아이디 / 비밀번호 찾기 -->
    <div class="etc-menu">
        <a th:href="@{/auth/find_id}">아이디 찾기</a>
        <a th:href="@{/auth/password_reset/send}">비밀번호 재설정</a>
    </div>

</div>

</body>
</html>

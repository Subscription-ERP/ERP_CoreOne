<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
            flex-direction: column;
        }

        .panel {
            width: 460px;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
            color: white;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            color: #E2ECFF;
            margin-bottom: 8px;
            text-align: center;
        }

        .title-sub {
            color: #AFC5E6;
            margin-bottom: 25px;
            font-size: 14px;
            text-align: center;
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 15px 48px 15px 15px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        .form-input::placeholder { color: transparent; }
        .form-input:focus {
            outline: none;
            border-color: #8EA6C9;
            box-shadow: 0 0 0 3px rgba(142,166,201,0.35);
        }

        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C4D6F3;
            pointer-events: none;
            transition: 0.2s;
        }
        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: -9px;
            left: 10px;
            font-size: 13px;
            padding: 0 6px;
            background: rgba(52,59,67,0.9);
            color: #D7E6FF;
        }

        .form-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #AFC4DF;
            font-size: 20px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: #3F4750;
            margin-top: 10px;
        }
        .btn-main:hover {
            background: #4B5561;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
        }

        .info-msg {
            color: #AFC5E6;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<!-- 유효한 토큰 -->
<div class="panel" th:if="${valid}">
    <div class="title">새 비밀번호 설정</div>
    <div class="title-sub">새 비밀번호를 입력해 주세요.</div>

    <form th:action="@{/auth/password_reset}" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <input type="password" class="form-input" name="newPassword" placeholder=" " required>
            <label>새 비밀번호</label>
            <i class="bi bi-lock"></i>
        </div>

        <div class="form-group">
            <input type="password" class="form-input" name="confirmPassword" placeholder=" " required>
            <label>새 비밀번호 확인</label>
            <i class="bi bi-shield-check"></i>
        </div>

        <button class="btn-main">비밀번호 변경</button>

        <div class="error-message" th:if="${error}" th:text="${error}"></div>
    </form>
</div>

<!-- 토큰 만료 / 오류 -->
<div class="panel" th:if="${!valid}">
    <div class="title">유효하지 않은 링크</div>
    <p class="info-msg">
        비밀번호 재설정 링크가 만료되었거나<br>
        잘못된 요청입니다.<br>
        다시 비밀번호 재설정을 시도해 주세요.
    </p>
</div>

</body>
</html>

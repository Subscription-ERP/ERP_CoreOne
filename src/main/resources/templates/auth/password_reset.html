<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
        }
        .panel {
            width: 460px;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
            color: white;
        }
        .title {
            font-size: 26px;
            font-weight: 900;
            color: #E2ECFF;
            margin-bottom: 8px;
            text-align: center;
        }
        .title-sub {
            color: #AFC5E6;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .rule-box {
            background: rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .rule-box ul {
            margin: 0;
            padding-left: 18px;
            font-size: 13px;
            line-height: 1.6;
            color: #C7D9F5;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 15px 48px 15px 15px;
            border-radius: 12px;
            color: white;
        }
        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C4D6F3;
            transition: 0.2s;
            pointer-events: none;
        }
        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: -9px;
            font-size: 13px;
            background: rgba(52,59,67,0.9);
            padding: 0 6px;
        }
        .btn-main {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #3F4750;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="panel" th:if="${valid}">
    <div class="title">새 비밀번호 설정</div>
    <div class="title-sub">아래 규칙을 지켜 비밀번호를 입력하세요</div>

    <div class="rule-box">
        <ul>
            <li>8 ~ 20자리</li>
            <li>영문 + 숫자 + 특수문자 포함</li>
            <li>아이디 포함 금지</li>
            <li>공백 사용 불가</li>
            <li>동일 문자 3회 반복 금지</li>
        </ul>
    </div>

    <form method="post" th:action="@{/auth/password_reset}">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <input type="password" name="newPassword" class="form-input" placeholder=" " required>
            <label>새 비밀번호</label>
        </div>

        <div class="form-group">
            <input type="password" name="confirmPassword" class="form-input" placeholder=" " required>
            <label>새 비밀번호 확인</label>
        </div>

        <button type="submit" class="btn-main">비밀번호 변경</button>

        <div class="error-message" th:if="${error}" th:text="${error}"></div>
    </form>
</div>

<div class="panel" th:if="${!valid}">
    <div class="title">유효하지 않은 링크</div>
    <p class="title-sub">
        비밀번호 재설정 링크가 만료되었거나<br>
        잘못된 요청입니다.
    </p>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>사용자별 메뉴권한 관리</title>

    <link rel="stylesheet"
          href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

    <link th:href="@{/css/general.css}" rel="stylesheet"/>

    <style>
    
    
        /* ======================= 🔍 검색영역 ======================= */
        .card-ui--search .card-ui__body {
            padding: 8px 16px !important;
            height: 58px !important;          /* ← 높이 고정 유지 */
            display: flex;
            align-items: center;              /* 세로 가운데 정렬 */
        }

        .search-container {
            width: 100%;
        }

        .search-row {
            display: flex;
            align-items: center;              /* 폰트 + 입력폼 세로 가운데 */
            gap: 24px;                        /* 항목 간 간격 */
            width: 100%;
        }

        .search-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-label {
            font-size: 13px;
            font-weight: 600;
            width: 52px;                      /* 라벨 폭 */
            text-align: right;
            margin: 0;
        }

        .search-input {
            height: 30px !important;
            font-size: 13px !important;
            padding: 2px 8px !important;
        }

        /* 각 입력폼 너비 조절 (사원명 조금 줄이기) */
        #searchUserName {
            width: 150px !important;
        }
        #searchDept,
        #searchPosition {
            width: 130px !important;
        }

        .search-btn-box {
            margin-left: auto;                /* 오른쪽 끝으로 밀기 */
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #btnReset, #btnSearch {
            height: 30px !important;
            padding: 0 14px !important;
            font-size: 13px !important;
        }

        /* ======================= Layout (LEFT / RIGHT) ======================= */
        .menu-auth-container {
            display: grid;
            grid-template-columns: 520px 1fr;   /* 왼쪽 그리드 조금 넓게 */
            gap: 14px;
            height: calc(100vh - 140px);
        }

        .left-panel, .right-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .grid-root {
            height: 100% !important;
            min-height: 550px !important;
        }

        /* ======================= GRID 선택 ROW 색상 ======================= */
        .tui-grid-row.row-selected td {
            background-color: #d9e8ff !important;
        }

        /* ======================= 메뉴트리 ======================= */
        .menu-tree {
            padding: 14px;
            overflow-y: auto;
            max-height: calc(100vh - 260px);
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
        }

        .menu-item { margin: 6px 0; }
        .menu-item .title { font-weight: 600; }
        .menu-children {
            margin-left: 20px;
            border-left: 1px dashed #bbb;
            padding-left: 12px;
        }
        .auth-checks {
            display: inline-flex;
            gap: 10px;
            margin-left: 6px;
        }

        /* ======================= 버튼 / 탭 ======================= */
        .toolbar .btn {
            height: 30px !important;
            padding: 0 12px !important;
            font-size: 13px !important;
        }

        .card-ui__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
    </style>
</head>

<body>
<div layout:fragment="content" class="page page-fluid">

   <section class="card-ui card-ui--search" style="margin-top: 10px;">
    <div class="card-ui__body search-container">

        <div class="search-row">

            <!-- 사원명 -->
            <div class="search-item">
                <label class="search-label">사원명</label>
                <input id="searchUserName" type="text" class="form-control search-input" />
            </div>

            <!-- 부서명 -->
            <div class="search-item">
                <label class="search-label">부서명</label>
                <select id="searchDept" class="form-select search-input">
                    <option value="">전체</option>
                </select>
            </div>

            <!-- 직급 -->
            <div class="search-item">
                <label class="search-label">직급</label>
                <select id="searchPosition" class="form-select search-input">
                    <option value="">전체</option>
                </select>
            </div>

            <!-- 버튼 영역 -->
            <div class="search-btn-box">
                <button id="btnReset" class="btn btn-white btn-inner me-1">초기화</button>
                <button id="btnSearch" class="btn btn-color btn-inner">조회</button>
            </div>

        </div>
    </div>
</section>

    <!-- ==================== LEFT / RIGHT ==================== -->
    <section class="menu-auth-container">

        <!-- LEFT GRID -->
        <div class="left-panel card-ui card-ui--grid">
            <header class="card-ui__header">
                <div>
                    <h6 class="card-ui__title">사원 목록</h6>
                    <small class="text-muted">선택한 사원의 메뉴권한이 오른쪽에 표시됩니다.</small>
                </div>
            </header>

            <div class="card-ui__body p-0">
                <div id="userGrid" class="grid-root"></div>
            </div>
        </div>

        <!-- RIGHT MENU PANEL -->
        <div class="right-panel card-ui card-ui--detail">

            <header class="card-ui__header">

                <ul class="nav nav-tabs ui-tabs" id="menuTabs">
                    <li class="nav-item">
                        <button class="nav-link active menu-tab-btn" data-tab="tab-sys">시스템관리</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link menu-tab-btn" data-tab="tab-hr">인사관리</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link menu-tab-btn" data-tab="tab-sales">영업관리</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link menu-tab-btn" data-tab="tab-fi">회계관리</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link menu-tab-btn" data-tab="tab-sub">구독관리</button>
                    </li>
                </ul>

                <div class="toolbar">
                    <button id="btnAllCheck" class="btn btn-white btn-inner">전체선택</button>
                    <button id="btnAllClear" class="btn btn-white btn-inner">전체해제</button>
                    <button id="btnRevert" class="btn btn-white btn-inner">되돌리기</button>
                    <button id="btnSaveAuth" class="btn btn-color btn-inner">저장</button>
                </div>

            </header>

            <div class="card-ui__body section-scroll">

                <div id="tab-sys" class="tab-panel active">
                    <div class="menu-tree" id="menuTreeSys"></div>
                </div>

                <div id="tab-hr" class="tab-panel">
                    <div class="menu-tree" id="menuTreeHr"></div>
                </div>

                <div id="tab-sales" class="tab-panel">
                    <div class="menu-tree" id="menuTreeSales"></div>
                </div>

                <div id="tab-fi" class="tab-panel">
                    <div class="menu-tree" id="menuTreeFi"></div>
                </div>

                <div id="tab-sub" class="tab-panel">
                    <div class="menu-tree" id="menuTreeSub"></div>
                </div>

            </div>
        </div>

    </section>

    <div layout:fragment="script">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script th:src="@{/js/auth/menuAuth.js}"></script>
    </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>USER / ROLE 기반 메뉴권한 관리</title>

    <link rel="stylesheet"
          href="https://uicdn.toast.com/grid/latest/tui-grid.css"/>

    <style>
        .menu-auth-container {
            display: grid;
            grid-template-columns: 700px 1fr;
            gap: 14px;
            height: calc(100vh - 140px);
        }

        .grid-root {
            height: 100% !important;
            min-height: 550px !important;
        }

        .tui-grid-row.row-selected td {
            background-color: #d9e8ff !important;
        }

        .toolbar .btn {
            height: 30px !important;
            padding: 0 12px !important;
            font-size: 13px !important;
        }

        .grid-chk {
            transform: scale(1.1);
            cursor: pointer;
        }
    </style>
</head>

<body>

<input type="hidden" id="sessionCompanyCode"
       th:value="${session.LOGIN_COMPANY_CODE}">

<div layout:fragment="content" class="page page-fluid">

    <!-- ✅ 검색 영역 -->
    <section class="card-ui card-ui--search" style="margin-top: 10px;">
        <div class="card-ui__body row g-3">

            <div class="col-md-3">
                <label>사원명</label>
                <input id="searchUserName" type="text" class="form-control">
            </div>

            <div class="col-md-3">
                <label>부서</label>
                <select id="searchDept" class="form-select">
                    <option value="">전체</option>
                    <option value="인사">인사</option>
                    <option value="회계">회계</option>
                    <option value="영업">영업</option>
                    <option value="생산">생산</option>
                    <option value="관리">관리</option>
                </select>
            </div>

            <div class="col-md-3">
                <label>직급</label>
                <select id="searchPosition" class="form-select">
                    <option value="">전체</option>
                    <option value="사원">사원</option>
                    <option value="대리">대리</option>
                    <option value="과장">과장</option>
                    <option value="차장">차장</option>
                    <option value="부장">부장</option>
                    <option value="임원">임원</option>
                </select>
            </div>

            <div class="col-md-3 text-end align-self-end">
                <button id="btnReset" class="btn btn-white me-1">초기화</button>
                <button id="btnSearch" class="btn btn-color">조회</button>
            </div>

        </div>
    </section>

    <section class="menu-auth-container">

        <!-- ✅ LEFT -->
        <div class="card-ui">
            <header class="card-ui__header">
                <h6>USER 목록</h6>
            </header>
            <div class="card-ui__body p-0_sr">
                <div id="userGrid" class="grid-root"></div>
            </div>
        </div>

        <!-- ✅ RIGHT -->
        <div class="card-ui">

            <header class="card-ui__header d-flex justify-content-between align-items-center">

                <ul class="nav nav-tabs ui-tabs" id="menuTabs">
                    <li class="nav-item">
                        <button class="nav-link active menu-tab-btn" type="button" data-system="SYSTEM">SYSTEM</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link menu-tab-btn" type="button" data-system="HR">인사</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link menu-tab-btn" type="button" data-system="FI">회계</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link menu-tab-btn" type="button" data-system="SALES">영업</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link menu-tab-btn" type="button" data-system="SUB">구독</button>
                    </li>
                </ul>

                <div class="toolbar">
                    <button id="btnAllCheck" class="btn btn-white">전체선택</button>
                    <button id="btnAllClear" class="btn btn-white">전체해제</button>
                    <button id="btnRevert" class="btn btn-white">되돌리기</button>
                    <button id="btnSaveAuth" class="btn btn-color">저장</button>
                </div>

            </header>

            <div class="card-ui__body p-0">
                <div id="authGrid" class="grid-root"></div>
            </div>
        </div>

    </section>
</div>

<div layout:fragment="script">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script th:src="@{/js/auth/menuAuth.js}"></script>
</div>

</body>
</html>

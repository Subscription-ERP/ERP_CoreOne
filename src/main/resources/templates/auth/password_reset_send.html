<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 링크 발송</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
        }
        .panel {
            width: 430px;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
        }
        .title {
            font-size: 26px;
            color: #E2ECFF;
            font-weight: 900;
            margin-bottom: 10px;
            text-align: center;
        }
        .sub {
            text-align: center;
            color: #AFC5E6;
            margin-bottom: 20px;
        }
        .input-box {
            margin-bottom: 18px;
        }
        .input-box input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .btn-main {
            width: 100%;
            padding: 13px;
            background: #3F4750;
            border: none;
            color: white;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="panel">

    <div class="title">비밀번호 재설정</div>
    <div class="sub">아이디와 이메일을 입력하세요.</div>

    <form id="sendForm">
        <div class="input-box">
            <input type="text" name="userId" placeholder="아이디 입력">
        </div>

        <div class="input-box">
            <input type="email" name="email" placeholder="이메일 입력">
        </div>

        <button type="button" class="btn-main" id="btnSend">재설정 링크 발송</button>
    </form>

</div>

<script>
document.getElementById("btnSend").addEventListener("click", function () {

    const formData = new FormData(document.getElementById("sendForm"));

    fetch("/auth/password_reset/send", {
        method: "POST",
        body: formData
    })
        .then(res => res.json())
        .then(data => {
            if (data.status === "OK") {
                alert("입력하신 이메일로 재설정 링크를 보냈습니다.");
            } else {
                alert(data.message);
            }
        });

});
</script>

</body>
</html>

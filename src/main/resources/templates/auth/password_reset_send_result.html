    <title>비밀번호 재설정 결과</title>
</head>
<body>

<script th:inline="javascript">
    /*<![CDATA[*/
    let result = '[[${result}]]';     

    if (result === 'true') {
        alert("비밀번호가 성공적으로 변경되었습니다. 다시 로그인해 주세요.");
    } else {
        alert("비밀번호 변경에 실패했습니다. 다시 시도해 주세요.");
    }
    location.href = "/auth/login";
    /*]]>*/
</script>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 완료</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
        }

        .panel {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
            color: white;
            text-align: center;
        }

        .title {
            font-size: 24px;
            font-weight: 900;
            color: #E2ECFF;
            margin-bottom: 15px;
        }

        .msg {
            color: #AFC5E6;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .btn-main {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            background: #3F4750;
            color: white;
        }
        .btn-main:hover {
            background: #4B5561;
        }
    </style>
</head>

<body>

<!-- 🔵 성공 패널 -->
<div class="panel"
     th:if="${result != null and result == true}">
    <div class="title">비밀번호 변경 완료</div>
    <div class="msg">
        비밀번호가 성공적으로 변경되었습니다.<br>
        다시 로그인해 주세요.
    </div>
    <button onclick="location.href='/auth/login'" class="btn-main">
        로그인 하러 가기
    </button>
</div>

<!-- 🔴 실패 패널 -->
<div class="panel"
     th:if="${result == null or result == false}">
    <div class="title">변경 실패</div>
    <div class="msg">
        비밀번호 변경 중 문제가 발생했습니다.<br>
        다시 시도해 주세요.
    </div>
    <button onclick="location.href='/auth/password_reset/send'" class="btn-main">
        다시 시도하기
    </button>
</div>

</body>
</html>

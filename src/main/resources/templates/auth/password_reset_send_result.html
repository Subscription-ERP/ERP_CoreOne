<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 링크 발송</title>

    <link rel="stylesheet" href="/css/adminlte.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #343B43;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
            color: #E2ECFF;
        }

        .panel {
            width: 460px;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.45);
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 6px;
            text-align: center;
            color: #E2ECFF;
        }

        .title-sub {
            text-align: center;
            color: #AFC5E6;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Floating Input */
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 15px 48px 15px 15px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        .form-input::placeholder { color: transparent; }
        .form-input:focus {
            outline: none;
            border-color: #8EA6C9;
            box-shadow: 0 0 0 3px rgba(142,166,201,0.35);
        }

        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C4D6F3;
            transition: 0.2s;
            pointer-events: none;
        }
        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: -9px;
            left: 10px;
            font-size: 13px;
            background: rgba(52,59,67,0.9);
            padding: 0 6px;
            color: #D7E6FF;
        }

        .form-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #AFC4DF;
            font-size: 20px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: #3F4750;
            color: white;
            transition: 0.2s;
        }
        .btn-main:hover { background: #4B5561; }
    </style>
</head>

<body>

<div class="panel">

    <div class="title">비밀번호 재설정</div>
    <div class="title-sub">아이디와 이메일을 입력하세요.</div>

    <form id="sendForm">

        <div class="form-group">
            <input type="text" class="form-input" name="userId" placeholder=" ">
            <label>아이디</label>
            <i class="bi bi-person-fill"></i>
        </div>

        <div class="form-group">
            <input type="email" class="form-input" name="email" placeholder=" ">
            <label>이메일</label>
            <i class="bi bi-envelope-fill"></i>
        </div>

        <button type="button" class="btn-main" id="btnSend">재설정 링크 발송</button>

    </form>

</div>

<script>
document.getElementById("btnSend").addEventListener("click", () => {
    const formData = new FormData(document.getElementById("sendForm"));

    fetch("/auth/password_reset/send", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "OK") {
            alert("입력하신 이메일로 재설정 링크를 보냈습니다.");
        } else {
            alert(data.message);
        }
    });
});
</script>

</body>
</html>

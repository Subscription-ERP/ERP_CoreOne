<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title>수주등록</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/sd/inOrd.css}">
</head>

<body layout:fragment="content">
<div class="page page-fluid">
    <div class="page page-fluid">
        <!-- ================= 기본 정보 ================= -->
        <section class="card-ui card-ui--detail" style="margin-top: 10px; display: flex;">
            <header class="card-ui__header d-flex justify-content-end">
                <!-- 우측 액션 -->
                <div class="toolbar">
                    <button id="btnReset" type="button" class="btn btn-white btn-inner">
                        초기화
                    </button>
                    <button id="btnSave" type="submit" class="btn btn-color btn-inner">
                        저장
                    </button>
                </div>
            </header>

            <div class="card-ui__body">
                <!-- ===== 기본정보 탭 ===== -->
                <div id="tab-basic" class="tab-panel active">

                    <!-- 상단 기본 정보 폼 -->
                    <div class="form-grid">
                        <!-- row 1: 발주번호 / 발주일 / 납기일 -->
                        <div class="form-grid__row form-grid__row--3col">
                            <div class="form-grid__label">발주번호</div>
                            <div class="form-grid__field">
                                <label for="outordNo" hidden="hidden"></label>
                                <input id="outordNo" name="outordNo" class="form-control form-control-sm input-base is-disabled" readonly placeholder="자동생성" />
                            </div>

                            <div class="form-grid__label">발주일</div>
                            <div class="form-grid__field">
                                <label for="outordDate" hidden="hidden"></label>
                                <input id="outordDate" name="outordDate" type="date" class="form-control form-control-sm input-base is-disabled" readonly
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" />
                            </div>

                            <div class="form-grid__label">납기일</div>
                            <div class="form-grid__field">
                                <label for="dueDate" hidden="hidden"></label>
                                <input id="dueDate" name="dueDate" type="date" class="form-control form-control-sm input-base" />
                            </div>
                        </div>

                        <!-- row 2: 작성자 / 부서 / 거래처코드 / 거래처명 -->
                        <div class="form-grid__row form-grid__row--4col">
                            <div class="form-grid__label">부서</div>
                            <div class="form-grid__field">
                                <div th:replace="~{modal/userSearchModal :: userSearchModal}"></div>
                                <label for="dept"  hidden="hidden"></label>
                                <input id="dept" name="dept" type="text" class="form-control form-control-sm input-base" />
                                <button type="button" id="btnOpenHrModal"
                                        class="btn-grid">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>

                            <div class="form-grid__label">담당자</div>
                            <div class="form-grid__field">
                                <label for="pic" hidden="hidden"></label>
                                <input id="pic" name="pic" type="text" class="form-control form-control-sm input-base" />
                            </div>

                            <div class="form-grid__label">거래처코드</div>
                            <div class="form-grid__field">
                                <div th:replace="modal/custModal :: custModal"></div>
                                <label for="custCodeSearch" hidden="hidden"></label>
                                <input id="custCodeSearch" name="custSearchKeyword" type="text" class="form-control form-control-sm input-base" />
                                <button type="button" id="btnOpenCustModal"
                                        class="btn-grid">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>

                            <div class="form-grid__label">거래처명</div>
                            <div class="form-grid__field">
                                <label for="custNameSearch" hidden="hidden"></label>
                                <input id="custNameSearch" name="custSearchKeyword" type="text" class="form-control form-control-sm input-base" />
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= 발주 품목 등록 ================= -->
        <section class="card-ui card-ui--grid section-flex">
            <header class="card-ui__header">
                <h6 class="card-ui__title">품목</h6>
                <div class="toolbar">
                    <div th:replace="modal/skuModal :: skuModal"></div>
                    <button id="btnOpenSkuModal" type="button" class="btn btn-white btn-inner">
                        품목
                    </button>
                    <button id="btnDeleteRow" type="button" class="btn btn-white btn-inner">
                        삭제
                    </button>
                    <button id="btnAddRow" type="button" class="btn btn-color btn-inner">
                        추가
                    </button>
                </div>
            </header>

            <div class="card-ui__body">
                <div id="outordGrid" class="grid-root" style="height: 640px;"></div>
            </div>
        </section>
    </div>
</div>

<!-- 전역 토스트 알림 -->
<div id="toastContainer" class="rc-toast"></div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/sd/outord.js}"></script>
</body>

</html>

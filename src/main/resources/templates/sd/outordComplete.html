<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8" />
    <title>발주완료처리</title>
</head>
<body layout:fragment="content">
    <div class="page page-fluid">
        <!-- ================= 검색/필터 섹션 ================= -->
        <section class="card-ui card-ui--search" style="margin-top: 10px; display: flex;">
            <div class="card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px">
                <div class="filter-bar row g-4 align-items-center col-md-12">

                    <!-- 거래처코드 -->
                    <div class="col-12 col-md-2">
                        <div class="field-inline">
                            <label for="searchCustCode" class="field-inline__label">거래처코드</label>
                            <input id="searchCustCode" name="custCode" type="text" class="form-control input-base" style="flex: 1; min-width: 0" />
                        </div>
                    </div>

                    <!-- 거래처명 -->
                    <div class="col-12 col-md-2">
                        <div class="field-inline">
                            <label for="searchCustName" class="field-inline__label">거래처명</label>
                            <input id="searchCustName" name="custName" type="text" class="form-control input-base" style="flex: 1; min-width: 0" />
                        </div>
                    </div>

                    <!-- 발주일자 (시작일 ~ 종료일) -->
                    <div class="col-12 col-md-3">
                        <div class="field-inline">
                            <label class="field-inline__label">발주일자</label>
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <input type="date" id="inordDateFrom" class="form-control input-base" style="flex: 1; min-width: 0" />
                                <span>~</span>
                                <input type="date" id="inordDateTo" class="form-control input-base" style="flex: 1; min-width: 0" />
                            </div>
                        </div>
                    </div>

                    <!-- 조회 버튼 -->
                    <div class="col-12 col-md-2 ms-auto text-end">
                        <button id="btnSearch" type="button" class="btn btn-color btn-outer">
                            조회
                        </button>
                    </div>
                </div>
            </div>
        </section>


        <!-- ================= 목록(Grid) 섹션 ================= -->
        <section class="card-ui card-ui--grid section-fixe">
            <header class="card-ui__header">
                <!-- 탭 -->
                <ul class="nav nav-tabs ui-tabs" id="empTabs">
                    <li class="nav-item">
                        <button class="nav-link active tab-btn" type="button" data-tab="notdone" data-status="NOT_DONE">미입고/부분입고</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link tab-btn" type="button" data-tab="done" data-status="DONE">
                            입고완료</button>
                    </li>
                </ul>

                <!-- 우측 액션 -->
                <div class="toolbar">
                    <button id="btnOutPut" type="button" class="btn btn-color btn-inner">
                        입고
                    </button>
                </div>
            </header>

            <div class="card-ui__body p-0" style="height: 600px;">
                <div id="grid" class="grid-root"></div>
            </div>
        </section>
    </div>

    <!-- 전역 토스트 알림 -->
    <div id="toastContainer" class="rc-toast"></div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/sd/outordComplete.js}"></script>
</body>
</html>

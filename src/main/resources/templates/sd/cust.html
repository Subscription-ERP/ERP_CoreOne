<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8" />
  <title>거래처 관리</title>

  <!-- CSS -->
  <link rel="stylesheet" th:href="@{/css/sd/cust.css}">

  <!-- Kakao Address API -->
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>

<body layout:fragment="content">
  <div class="page page-fluid">
    <!-- ================= 검색/필터 섹션 ================= -->
    <section class="card-ui card-ui--search" style="margin-top: 10px; display: flex;">
      <div class="card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px">
        <div class="filter-bar row g-4 align-items-center col-md-12">

          <!-- 거래처코드 -->
          <div class="col-12 col-md-2">
            <div class="field-inline">
              <label for="searchCustCode" class="field-inline__label">거래처코드</label>
              <input id="searchCustCode" name="custCode" type="text" class="form-control input-base" style="flex: 1; min-width: 0" />
            </div>
          </div>

          <!-- 거래처명 -->
          <div class="col-12 col-md-2">
            <div class="field-inline">
              <label for="searchCustName" class="field-inline__label">거래처명</label>
              <input id="searchCustName" name="custName" type="text" class="form-control input-base" style="flex: 1; min-width: 0" />
            </div>
          </div>

          <!-- 거래처 유형 -->
          <div class="col-12 col-md-2">
            <div class="field-inline">
              <label for="searchCustType" class="field-inline__label">거래처 유형</label>
              <select id="searchCustType" name="custType" class="form-select input-base" style="flex: 1; min-width: 0"></select>
            </div>
          </div>

          <!-- 사용중단포함 -->
          <div class="col-12 col-md-2">
            <label class="check-inline">
              <input id="includeStopped" type="checkbox" class="check-inline__input" />
              <span class="field-inline__label">사용중단포함</span>
            </label>
          </div>

          <!-- 조회 버튼 -->
          <div class="col-12 col-md-2 ms-auto text-end">
            <button id="btnSearch" type="button" class="btn btn-color btn-outer">
              조회
            </button>
          </div>
        </div>
      </div>
    </section>


    <!-- ================= 목록(Grid) 섹션 ================= -->
    <section class="card-ui card-ui--grid section-flex">
      <header class="card-ui__header">
        <h6 class="card-ui__title">거래처 목록</h6>
        <small class="text-muted">
          행 선택 시 아래 상세 정보가 표시됩니다.
        </small>
      </header>

      <div class="card-ui__body p-0">
        <div id="grid" class="grid-root"></div>
      </div>
    </section>

    <form id="custForm" action="/sd/cust/save" method="post">
      <!-- ================= 상세(탭 + 폼) 섹션 ================= -->
      <section class="card-ui card-ui--detail section-fixed">
        <header class="card-ui__header d-flex justify-content-end">
          <!-- 우측 액션 -->
          <div class="toolbar">
            <button id="btnReset" type="button" class="btn btn-white btn-inner">
              초기화
            </button>
            <button id="btnSave" type="submit" class="btn btn-color btn-inner">
              저장
            </button>
          </div>
        </header>

        <div class="card-ui__body">
          <!-- ===== 기본정보 탭 ===== -->
          <div id="tab-basic" class="tab-panel active">

            <!-- 상단 기본 정보 폼 -->
            <div class="form-grid">

              <!-- row 1: 거래처코드 / 상호 / 대표자명 -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">거래처코드</div>
                <div class="form-grid__field">
                  <input id="custCode" name="custCode" class="form-control form-control-sm input-base is-disabled" readonly placeholder="자동생성" />
                </div>

                <div class="form-grid__label">상호(이름)</div>
                <div class="form-grid__field">
                  <input id="custName" name="custName" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">대표자명</div>
                <div class="form-grid__field">
                  <input id="ceoName" name="ceoName" type="text" class="form-control form-control-sm input-base" />
                </div>
              </div>

              <!-- row 2: 사업자번호 / 업태 / 종목 -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">사업자번호</div>
                <div class="form-grid__field">
                  <input id="bno" name="bno" type="text" class="form-control form-control-sm input-base" placeholder="- 포함"/>
                </div>

                <div class="form-grid__label">업태</div>
                <div class="form-grid__field">
                  <input id="bType" name="bType" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">종목</div>
                <div class="form-grid__field">
                  <input id="bItem" name="bItem" type="text" class="form-control form-control-sm input-base" />
                </div>
              </div>

              <!-- row 3: 전화 / FAX / 이메일 -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">전화</div>
                <div class="form-grid__field">
                  <input id="phone" name="phone" type="text" class="form-control form-control-sm input-base" placeholder="010-0000-0000"/>
                </div>

                <div class="form-grid__label">Fax</div>
                <div class="form-grid__field">
                  <input id="faxNo" name="faxNo" type="text" class="form-control form-control-sm input-base" placeholder="- 포함"/>
                </div>

                <div class="form-grid__label">이메일</div>
                <div class="form-grid__field">
                  <input id="custEmail" name="custEmail" type="email" class="form-control form-control-sm input-base" />
                </div>
              </div>

              <!-- row 4: 우편번호 / 주소 / 상세주소 -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">우편번호</div>
                <div class="form-grid__field_sd" style="background-color: #f6f6f6">
                  <div class="d-flex gap-3">
                    <input id="zonecode" name="zonecode" type="text" class="form-control form-control-sm input-base is-disabled"
                      readonly placeholder="우편번호" />
                    <button type="button" id="btnOfficeSearch"
                      class="btn-grid">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="form-grid__label">주소</div>
                <div class="form-grid__field">
                  <input id="address" name="address" type="text" class="form-control form-control-sm input-base is-disabled" readonly placeholder="도로명주소" />
                </div>

                <div class="form-grid__label">상세주소</div>
                <div class="form-grid__field">
                  <input id="addressDetail" name="addressDetail" type="text" class="form-control form-control-sm input-base"
                    placeholder="상세주소" />
                </div>
              </div>

              <!-- row 5: 배송지 / 계좌번호 (버튼) -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">배송지</div>
                <div class="form-grid__field form-height">
                  <button type="button" id="btnDelivery" name="btnDelivery" class="btn-grid">
                    확인
                  </button>
                </div>

                <div class="form-grid__label">계좌번호</div>
                <div class="form-grid__field form-height">
                  <button type="button" id="btnAccount" name="btnAccount" class="btn-grid">
                    확인
                  </button>
                </div>

                <!-- 3열 레이아웃 맞추기용 빈 칸 -->
                <div class="form-grid__label is-disabled"></div>
                <div class="form-grid__field "></div>
              </div>
            </div>

            <!-- 하단 추가 정보 (거래처유형/부서/담당자/사용여부) -->
            <div class="form-grid mt-2">
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">거래처유형</div>
                <div class="form-grid__field">
                  <select id="custType" name="custType" class="form-select form-select-sm input-base"></select>
                </div>

                <div class="form-grid__label">부서</div>
                <div class="form-grid__field">
                  <input id="dept" name="dept" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">담당자</div>
                <div class="form-grid__field">
                  <input id="userName" name="userName" type="text" class="form-control form-control-sm input-base" />
                </div>
              </div>

              <div class="form-grid__row">
                <div class="form-grid__label">사용여부</div>
                <div class="form-grid__field form-grid__field--checkbox">
                  <div class="d-flex align-items-center form-height">
                    <label class="me-3">
                      <input type="radio" name="useStatus" value="Y" checked /> Y
                    </label>
                    <label>
                      <input type="radio" name="useStatus" value="N" /> N
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </form>
  </div>
  <script th:src="@{/js/sd/cust.js}"></script>
</body>

</html>

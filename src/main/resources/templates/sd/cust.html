<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8" />
  <title>거래처 관리</title>

  <!-- BootStrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Toast UI Grid -->
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.min.css">
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.min.js"></script>

  <!-- Custom -->
  <link rel="stylesheet" th:href="@{/css/sd/cust.css}">
  <link th:href="@{/css/general.css}" rel="stylesheet" />

  <!-- Kakao Address API -->
   <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>

<body layout:fragment="content">
  <div class="page page-fluid">
    <!-- ================= 검색/필터 섹션 ================= -->
    <section class="card-ui card-ui--search" style="margin-top: 10px; display: flex; width: 100%">
      <div class="card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px">
        <div class="filter-bar row g-2 align-items-center col-md-12">

          <!-- 거래처명 -->
          <div class="col-12 col-md-3">
            <div class="field-inline">
              <label for="searchName" class="field-inline__label">거래처명</label>
              <input id="searchName" type="text" class="form-control input-base" style="flex: 1; min-width: 0" />
            </div>
          </div>

          <!-- 거래처 유형 -->
          <div class="col-12 col-md-3">
            <div class="field-inline">
              <label for="searchType" class="field-inline__label">거래처 유형</label>
              <select id="searchType" class="form-select input-base" style="flex: 1; min-width: 0">
                <option value="">전체</option>
                <option value="매입업체">매입업체</option>
                <option value="매출업체">매출업체</option>
                <option value="외주업체">외주업체</option>
                <option value="내부거래사">내부거래사</option>
              </select>
            </div>
          </div>

          <!-- 사용중만 -->
          <div class="col-12 col-md-2">
            <label class="check-inline">
              <input id="searchUse" type="checkbox" class="check-inline__input" />
              <span class="check-inline__label">사용중만</span>
            </label>
          </div>

          <!-- 버튼 영역 -->
          <div class="col-12 col-md-2 ms-auto text-end">
            <button id="btnSearch" type="button" class="btn btn-color btn-outer" style="width: 90px">
              조회
            </button>
          </div>

        </div>
      </div>
    </section>

    <!-- ================= 목록(Grid) 섹션 ================= -->
    <section class="card-ui card-ui--grid section-flex">
      <header class="card-ui__header">
        <h6 class="card-ui__title">사원 목록</h6>
        <small class="text-muted">
          행 선택 시 아래 상세 정보가 표시됩니다.
        </small>
      </header>

      <div class="card-ui__body section-scroll p-0">
        <div id="grid" class="grid-root"></div>
      </div>
    </section>

    <!-- ================= 상세(탭 + 폼) 섹션 ================= -->
    <section class="card-ui card-ui--detail section-fixed">
      <form action="" method="post">
        <header class="card-ui__header d-flex justify-content-end">
          <!-- 우측 액션 -->
          <div class="toolbar">
            <button id="btnReset" type="button" class="btn btn-white btn-inner">
              초기화
            </button>
            <button id="btnSave" type="button" class="btn btn-color btn-inner">
              저장
            </button>
          </div>
        </header>

        <div class="card-ui__body section-scroll">
          <!-- ===== 기본정보 탭 ===== -->
          <div id="tab-basic" class="tab-panel active">

            <!-- 상단 기본 정보 폼 -->
            <div class="form-grid">
              <!-- row 1: 거래처코드 / 상호 / 대표자명 -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">거래처코드</div>
                <div class="form-grid__field">
                  <input id="custCode" class="form-control form-control-sm input-base" readonly disabled placeholder="자동생성" />
                </div>

                <div class="form-grid__label">상호(이름)</div>
                <div class="form-grid__field">
                  <input id="custName" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">대표자명</div>
                <div class="form-grid__field">
                  <input id="ceoName" type="text" class="form-control form-control-sm input-base" />
                </div>
              </div>

              <!-- row 2: 사업자번호 / 업태 / 종목 -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">사업자번호</div>
                <div class="form-grid__field">
                  <input id="bno" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">업태</div>
                <div class="form-grid__field">
                  <input id="bType" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">종목</div>
                <div class="form-grid__field">
                  <input id="bItem" type="text" class="form-control form-control-sm input-base" />
                </div>
              </div>

              <!-- row 3: 전화 / FAX / 이메일 -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">전화</div>
                <div class="form-grid__field">
                  <input id="phone" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">Fax</div>
                <div class="form-grid__field">
                  <input id="faxNo" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">이메일</div>
                <div class="form-grid__field">
                  <input id="custEmail" type="email" class="form-control form-control-sm input-base" />
                </div>
              </div>

              <!-- row 4: 우편번호 / 주소 / 상세주소 -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">우편번호</div>
                <div class="form-grid__field">
                  <div class="d-flex gap-3">
                    <input id="zonecode" type="text" class="form-control form-control-sm input-base" placeholder="우편번호" />
                    <button type="button" id="btnZipSearch" class="btn btn-outline-secondary btn-sm justify-content-end">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                </div>

                <div class="form-grid__label">주소</div>
                <div class="form-grid__field">
                  <input id="address" type="text" class="form-control form-control-sm input-base" placeholder="도로명주소" />
                </div>

                <div class="form-grid__label">상세주소</div>
                <div class="form-grid__field">
                  <input id="addressDetail" type="text" class="form-control form-control-sm input-base"
                    placeholder="상세주소" />
                </div>
              </div>

              <!-- row 5: 배송지 / 계좌번호 (버튼) -->
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">배송지</div>
                <div class="form-grid__field ">
                  <button id="btnDelivery" class="btn btn-outline-secondary btn-sm button-center">
                    확인
                  </button>
                </div>

                <div class="form-grid__label">계좌번호</div>
                <div class="form-grid__field">
                  <button id="btnAccount" class="btn btn-outline-secondary btn-sm button-center">
                    확인
                  </button>
                </div>

                <!-- 3열 레이아웃 맞추기용 빈 칸 -->
                <div class="form-grid__label"></div>
                <div class="form-grid__field"></div>
              </div>
            </div>

            <!-- 하단 추가 정보 (거래처유형/부서/담당자/사용여부) -->
            <div class="form-grid mt-2">
              <div class="form-grid__row form-grid__row--3col">
                <div class="form-grid__label">거래처유형</div>
                <div class="form-grid__field">
                  <select id="custType" class="form-select form-select-sm input-base">
                    <option value="">선택</option>
                    <option>매입업체</option>
                    <option>매출업체</option>
                    <option>내부거래사</option>
                    <option>외주업체</option>
                  </select>
                </div>

                <div class="form-grid__label">부서</div>
                <div class="form-grid__field">
                  <input id="dept" type="text" class="form-control form-control-sm input-base" />
                </div>

                <div class="form-grid__label">담당자</div>
                <div class="form-grid__field">
                  <input id="userName" type="text" class="form-control form-control-sm input-base" />
                </div>
              </div>

              <div class="form-grid__row">
                <div class="form-grid__label">사용여부</div>
                <div class="form-grid__field">
                  <div class="d-flex align-items-center">
                    <label class="me-3">
                      <input type="radio" name="useStatus" value="y" checked /> Y
                    </label>
                    <label>
                      <input type="radio" name="useStatus" value="n" /> N
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </section>


  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script th:src="@{/js/sd/cust.js}"></script>
</body>

</html>

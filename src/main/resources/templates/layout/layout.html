	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

	<link rel="stylesheet" th:href="@{/css/adminlte.css}">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/apexcharts@3.37.1/dist/apexcharts.css" />

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css" />

	<link rel="stylesheet" href="https://uicdn.toast.com/tui-grid/latest/tui-grid.css">
	<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css">

	<link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
	<link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />

	<!-- TOAST UI JS -->
	<script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
	<script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
	<script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
	<script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
	<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<!-- fontawesome -->
	<script src="https://kit.fontawesome.com/40f9784bbf.js" crossorigin="anonymous"></script>

	<link rel="stylesheet" th:href="@{/css/general.css}" />
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">

	<input type="hidden" id="loginUserId" th:value="${session.LOGIN_USER_ID}">
	<input type="hidden" id="loginCompanyCode" th:value="${session.LOGIN_COMPANY_CODE}">

	<div class="app-wrapper">

		<!-- =============================== HEADER =============================== -->
		<nav class="app-header navbar navbar-expand bg-body">
			<div class="container-fluid">

				<!-- Left navbar -->
				<ul class="navbar-nav">
					<li class="nav-item">
						<a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
							<i class="fa-solid fa-bars"></i>
						</a>
					</li>

					<!-- 현재메뉴 -->
					<li class="nav-item ms-2 d-md-flex align-items-center"
						th:if="${breadcrumb != null and !breadcrumb.isEmpty()}">
						<nav aria-label="breadcrumb" class="mb-0">
							<ol class="breadcrumb mb-0 py-0">
								<li class="breadcrumb-item" 
								    th:each="bc, stat : ${breadcrumb}"
									th:classappend="${stat.last} ? ' active' : ''" 
									th:attr="aria-current=${stat.last} ? 'page' : null"
									th:text="${bc}">
								</li>
							</ol>
						</nav>
					</li>

				</ul>

				<!-- Right navbar -->
				<ul class="navbar-nav ms-auto align-items-center">

					<!-- 로그인 안된 경우: 로그인 아이콘 -->
					<li class="nav-item not-login" th:if="${session.LOGIN_USER_ID == null}">
					    <a class="nav-link" href="/auth/login" title="로그인">
					        <i class="fa-solid fa-arrow-right-to-bracket"></i>
					    </a>
					</li>

					<!-- 로그인상태 -->
					<li class="nav-item welcome-item" th:if="${session.LOGIN_USER_ID != null}">
					  <div class="welcome-text">
					    <span class="welcome-name" th:text="${session.LOGIN_USER_NAME != null ? session.LOGIN_USER_NAME : '사용자'}"></span>
					    <span class="welcome-suffix">님 환영합니다</span>
					  </div>
					</li>

					<!-- User Menu Dropdown (로그인시에만 표시) -->
					<li class="nav-item dropdown user-menu" th:if="${session.LOGIN_USER_ID != null}">
						<a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
							
							<!-- 사원이미지 -->
							<img th:src="${session.LOGIN_USER_PHOTO_URL}"
						           class="user-image rounded-circle"
						           style="border: 1px solid #eee;"
						           alt="User Image" />
							
							<span class="d-none d-md-inline"
								th:text="${session.LOGIN_USER_NAME != null ? session.LOGIN_USER_NAME : 'User'}">
								User
							</span>
						</a>
						<ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">

							<!-- 사용자 정보 -->
							<li class="dropdown-header text-center">
								<!-- 사원이미지 -->
								<img th:src="${session.LOGIN_USER_PHOTO_URL}"
						             class="rounded-circle mb-2"
						             alt="User Image"
						             style="border:1px solid #eee;"
						             width="80">

								<p class="mb-0 fw-bold" th:text="${session.LOGIN_USER_NAME != null ? session.LOGIN_USER_NAME : '사용자명'}"></p>
								<small class="text-muted" th:text="${session.LOGIN_USER_ID != null ? 'ID : ' + session.LOGIN_USER_ID : 'ID : -'}"></small>
								<!-- 로그인 시에만 부서/직급 표시 -->
 								<div sec:authorize="isAuthenticated()" class="mt-1 text-muted small">
									<span th:text="${session.LOGIN_DEPT != null ? session.LOGIN_DEPT_NAME : '-'}"></span>
									/
									<span th:text="${session.LOGIN_POSITION != null ? session.LOGIN_JOB_TITLE_NAME : '-'}"></span>
								</div> 
							</li>

							<li>
								<hr class="dropdown-divider">
							</li>

							<!-- ================= 하단 버튼 영역 ================= -->
							<!-- 비로그인 상태 -->
							<li th:if="${session.LOGIN_USER_ID == null}" class="text-center py-2">
								<a class="btn btn-color w-75" href="/auth/login">
									<i class="fa-solid fa-arrow-right-to-bracket"></i> Login
								</a>
							</li>

							<!-- 로그인 상태 -->
							<li th:if="${session.LOGIN_USER_ID != null}" class="text-center py-2">
								<button type="button" class="btn btn-color w-75" onclick="document.getElementById('logoutForm').submit();">
									<i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
								</button>
							</li>


						</ul>
					</li>

				</ul>
			</div>
		</nav>

		<!-- =============================== SIDEBAR =============================== -->
		<aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">

			<div class="sidebar-brand">
				<a href="/" class="brand-link"> <img th:src="@{/assets/img/RootCoreLogo.png}" alt="AdminLTE Logo"
						class="brand-image opacity-75 shadow" /> <span class="brand-text">CoreOne</span>
				</a>
			</div>

			<div class="sidebar-wrapper">
				<nav class="mt-2">
					<ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="navigation"
						aria-label="Main navigation" data-accordion="false" id="sideMenu"></ul>
				</nav>
			</div>
		</aside>

		<!-- =============================== MAIN =============================== -->
		<main class="app-main">
			<div layout:fragment="content"></div>
		</main>

		<!-- =============================== FOOTER =============================== -->
		<footer class="app-footer">
			<div class="float-end d-sm-inline">
				2025 RootCore - <a href="https://github.com/Subscription-ERP/ERP_CoreOne"
					class="text-decoration-none">CoreOne</a> ERP Project
			</div>
		</footer>

	</div>
	<!-- /.app-wrapper -->

	<!-- 숨겨진 logout 폼 -->
	<form id="logoutForm" th:action="@{/auth/logout}" method="post" style="display: none;">
		<input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
	</form>

	<!-- =============================== SCRIPT 영역 =============================== -->
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/overlayscrollbars/2.11.0/browser/overlayscrollbars.browser.es6.min.js"></script>
	<script th:src="@{/js/adminlte.js}"></script>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const sidebarWrapper = document.querySelector(".sidebar-wrapper");
			if (sidebarWrapper && window.OverlayScrollbarsGlobal) {
				OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
					scrollbars: {
						theme: 'os-theme-light',
						autoHide: 'leave',
						clickScroll: true
					}
				});
			}
		});
	</script>
	
	

	<!-- 메뉴 권한 세션 -> JS 로 내려주기 -->
	<script th:inline="javascript">
		window.LOGIN_MENU_AUTH = /*[[${session.LOGIN_MENU_AUTH}]]*/[];
	</script>
	<script src="/js/auth/sidebarMenu.js"></script>
	
	<!-- 메뉴 active 안닫히게 처리 -->
	<script>
	  document.addEventListener("DOMContentLoaded", () => {
	    const sideMenu = document.getElementById("sideMenu");
	    if (!sideMenu) return;
	
	    const norm = (p) => {
	      if (!p) return "";
	      // query/hash 제거 + 마지막 슬래시 제거
	      p = p.split("?")[0].split("#")[0];
	      return (p.length > 1 && p.endsWith("/")) ? p.slice(0, -1) : p;
	    };
	
	    const current = norm(window.location.pathname);
	
	    const activate = () => {
	      const links = sideMenu.querySelectorAll("a.nav-link[href]");
	      if (!links.length) return false;
	
	      // href를 URL로 정규화해서 pathname 비교 (상대/절대/컨텍스트경로 대응)
	      const activeLink = Array.from(links).find(a => {
	        const raw = a.getAttribute("href");
	        if (!raw || raw === "#" || raw.startsWith("javascript:")) return false;
	
	        const path = norm(new URL(a.href, window.location.origin).pathname);
	        // 완전일치 우선, 안되면 endsWith로 한 번 더(컨텍스트 경로 차이 대응)
	        return path === current || current.endsWith(path);
	      });
	
	      if (!activeLink) return true; // 메뉴는 있는데 매칭 링크가 없는 경우
	
	      // 1) 해당 링크 active
	      activeLink.classList.add("active");
	
	      // 2) 부모 트리(menu-open) 열기 + 부모 nav-link도 active
	      let tree = activeLink.closest(".nav-treeview");
	      while (tree) {
	        const parentItem = tree.closest(".nav-item");
	        if (parentItem) {
	          parentItem.classList.add("menu-open");
	
	          const parentLink = parentItem.querySelector(":scope > a.nav-link");
	          if (parentLink) parentLink.classList.add("active");
	        }
	
	        // 접힘 스타일이 inline으로 남아있을 수 있어서 강제로 표시
	        tree.style.display = "block";
	        tree.style.height = "auto";
	
	        tree = parentItem?.parentElement?.closest(".nav-treeview");
	      }
	
	      return true;
	    };
	
	    // 1차 시도
	    if (activate()) return;
	
	    // 메뉴가 비동기로 만들어지는 경우를 대비해서 변경 감시
	    const obs = new MutationObserver(() => {
	      if (activate()) obs.disconnect();
	    });
	    obs.observe(sideMenu, { childList: true, subtree: true });
	
	    // 혹시 mutation이 안 잡히는 방식(예: innerHTML 한방 교체) 대비해서 타임아웃도 같이
	    setTimeout(() => {
	      activate();
	      obs.disconnect();
	    }, 5000);
	  });
	</script>

	<!-- 페이지별 스크립트 -->
	<div layout:fragment="script"></div>

</body>

</html>

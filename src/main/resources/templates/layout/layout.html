<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="ko">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <title>AdminLTE v4 | Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/apexcharts@3.37.1/dist/apexcharts.css" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css" />

    <link rel="stylesheet" href="https://uicdn.toast.com/tui-grid/latest/tui-grid.css">
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css">

    <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />

    <script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
    <script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
    <script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
    <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/general.css}" />
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">

<input type="hidden" id="loginUserId" th:value="${session.LOGIN_USER_ID}">
<input type="hidden" id="loginCompanyCode" th:value="${session.LOGIN_COMPANY_CODE}">

<div class="app-wrapper">

    <!-- ===============================
         HEADER
    ================================== -->
    <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">

            <!-- Left navbar -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                        <i class="bi bi-list"></i>
                    </a>
                </li>
                <li class="nav-item d-none d-md-block">
                    <a href="/" class="nav-link">Home</a>
                </li>
                <li class="nav-item d-none d-md-block">
                    <a href="#" class="nav-link">Contact</a>
                </li>
            </ul>

            <!-- Right navbar -->
            <ul class="navbar-nav ms-auto">

                <!-- Search -->
                <li class="nav-item">
                    <a class="nav-link" data-widget="navbar-search" href="#" role="button">
                        <i class="bi bi-search"></i>
                    </a>
                </li>

                <!-- 구독하기 버튼 (main 에서만 표시) -->
                <li class="nav-item" th:if="${page == 'main'}">
                    <a href="/company" class="btn btn-primary ms-2">구독하기</a>
                </li>

                <!-- 마이페이지 -->
                <li class="nav-item d-none d-md-block">
                    <a href="/mypage" class="nav-link">
                        <i class="bi bi-person"></i> 마이페이지
                    </a>
                </li>

                <!-- Notifications -->
                <li class="nav-item dropdown">
                    <a class="nav-link" data-bs-toggle="dropdown" href="#">
                        <i class="bi bi-bell-fill"></i>
                        <span class="navbar-badge badge text-bg-warning">15</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                        <span class="dropdown-item dropdown-header">15 Notifications</span>
                        <!-- 필요하면 여기 내용 채우기 -->
                    </div>
                </li>

                <!-- Fullscreen -->
                <li class="nav-item">
                    <a class="nav-link" href="#" data-lte-toggle="fullscreen">
                        <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i>
                        <i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i>
                    </a>
                </li>

                <!-- ⭐ User Menu Dropdown -->
                <li class="nav-item dropdown user-menu">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                        <img th:src="@{/assets/img/user2-160x160.jpg}"
                             class="user-image rounded-circle shadow" alt="User Image" />
                        <!-- 세션값이 없으면 'User' 라고 나오도록 -->
                        <span class="d-none d-md-inline"
                              th:text="${session.LOGIN_USER_NAME != null ? session.LOGIN_USER_NAME : 'User'}">
                            User
                        </span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">

                        <!-- 사용자 정보 -->
                        <li class="dropdown-header text-center">
                            <img th:src="@{/assets/img/user2-160x160.jpg}"
                                 class="rounded-circle shadow mb-2" alt="User Image" width="80">
                            <p class="mb-0"
                               th:text="${session.LOGIN_USER_NAME != null ? session.LOGIN_USER_NAME : '사용자명'}">
                                사용자명
                            </p>
                            <small th:text="${session.LOGIN_USER_ID != null ? session.LOGIN_USER_ID : 'ID'}">ID</small>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <!-- 프로필 -->
                        <li>
                            <a href="#" class="dropdown-item text-center py-2">
                                <i class="bi bi-person-circle me-2"></i> 프로필
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <!-- 🔥 로그아웃 버튼 -->
                        <li class="text-center py-2">
                            <form action="/auth/logout" method="post">
                                <button type="submit" class="btn btn-outline-light w-75">
                                    <i class="bi bi-box-arrow-right"></i> 로그아웃
                                </button>
                            </form>
                        </li>

                    </ul>
                </li>

            </ul>
        </div>
    </nav>
    <!-- ===============================
         /HEADER
    ================================== -->

    <!-- ===============================
         SIDEBAR
    ================================== -->
    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">

        <!-- Brand -->
        <div class="sidebar-brand">
            <a href="/" class="brand-link">
                <img th:src="@{/assets/img/RootCoreLogo.png}" alt="AdminLTE Logo"
                     class="brand-image opacity-75 shadow" />
                <span class="brand-text">CoreOne</span>
            </a>
        </div>

        <!-- Sidebar Wrapper -->
        <div class="sidebar-wrapper">
            <nav class="mt-2">
                <!-- 동적 사이드 메뉴 -->
                <ul class="nav sidebar-menu flex-column"
                    data-lte-toggle="treeview"
                    role="navigation"
                    aria-label="Main navigation"
                    data-accordion="false"
                    id="sideMenu">
                </ul>

                <!-- 참고용 메뉴들(삭제예정) 全부 주석 -->
                <!--
                ... (여기 있던 AdminLTE 예제 메뉴 전부 주석 처리) ...
                -->
            </nav>
        </div>
    </aside>

    <!-- ===============================
         MAIN
    ================================== -->
    <main class="app-main">
        <div layout:fragment="content"></div>
    </main>

    <!-- ===============================
         FOOTER
    ================================== -->
    <footer class="app-footer">
        <div class="float-end d-sm-inline">
            2025 RootCore -
            <a href="https://github.com/Subscription-ERP/ERP_CoreOne"
               class="text-decoration-none">CoreOne</a> ERP Project
        </div>
    </footer>

</div> <!-- /.app-wrapper -->

<!-- 🔥 (옵션) 숨겨진 로그아웃 폼 - JS로 쓸 일이 있으면 유지 -->
<form id="logoutForm" th:action="@{/auth/logout}" method="post" style="display: none;">
    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
</form>

<!-- ===============================
     SCRIPT 영역
================================== -->

<!-- ⭐ 메뉴 권한 세션 -> JS 로 내려주기 -->
<script th:inline="javascript">
    window.LOGIN_MENU_AUTH = /*[[${session.LOGIN_MENU_AUTH}]]*/ [];
</script>

<script src="/js/auth/sidebarMenu.js"></script>

<!-- 페이지별 개별 스크립트 -->
<div layout:fragment="script"></div>

</body>
</html>

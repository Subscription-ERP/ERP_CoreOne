<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">

<head>
  <title>증명서 관리</title>
  <!-- SheetJS CDN (필요 시) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- ToastUI Grid (미사용이면 삭제 가능) -->
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
  <!-- ToastUI Date/Time Picker CSS -->
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
  <!-- ToastUI JS -->
  <script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
  <script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
  <script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
  <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

  <!-- general.css -->
  <link th:href="@{/css/general.css}" rel="stylesheet" />
  <link th:href="@{/css/hr/certificationManage.css}" rel="stylesheet" />

  <style>

  </style>
</head>

<body>
  <div layout:fragment="content" class="page page-fluid">

    <!-- ==================== 입력 ================================================================== -->
    <section class="card-ui card-ui--search" style="margin-top: 10px; display: flex;">
      <div class=" card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px">
        <div class="filter-bar row g-4 align-items-center col-md-12">

          <div class="col-12 col-md-9 form-allwrapper" style="display: flex; gap:20px; flex-wrap: wrap;">
            <!-- 증명서 -->
            <div class="col-12 col-md-3">
              <div class="field-inline">
                <label for="docType" class="field-inline__label">증명서</label>
                <select id="docType" class="form-select input-base" style="flex: 1; min-width: 0">
                </select>
              </div>
            </div>

            <!-- 사원 -->
            <div class="col-12 col-md-3">
              <div class="field-inline">
                <label for="user" class="field-inline__label">사원</label>
                <!-- 화면에 보이는 사원명 -->
                <input id="UserName" type="text" class="form-control input-base" style="flex: 1; min-width: 0" placeholder="사원을 선택하세요" readonly />
              	<!-- 실제 사원 ID -->
              	<input id="UserId" type="hidden">
              </div>
            </div>

            <!-- 발급일 -->
            <div class="col-12 col-md-3">
              <div class="field-inline">
                <label for="IssueDate" class="field-inline__label">발급일</label>
                <input id="IssueDate" type="Date" class="form-control input-base" style="flex: 1; min-width: 0" />
              </div>
            </div>

            <!-- 용도 -->
            <div class="col-12 col-md-10">
              <div class="field-inline">
                <label for="purpose" class="field-inline__label">용도</label>
                <input id="purpose" type="text" class="form-control input-base" style="flex: 1; min-width: 0" />
              </div>
            </div>

          </div>

          <!-- 확인 버튼 -->
          <div class="col-12 col-md-3 ms-auto text-end">
            <button id="btnReset" type="button" class="btn btn-white btn-outer">초기화</button>
            <button id="btnConfirm" type="button" class="btn btn-color btn-outer">확인</button>
          </div>
        </div>
      </div>
    </section>




    <!-- ================= 증명서 관리 메인 카드 ================= -->
    <section class="card-ui section-flex" style="margin-top:10px;">

      <div class="card-ui__body section-scroll">


        <!-- ===== 증명서 미리보기 영역 ===== -->
        <div class="cert-preview-wrapper">
          <div class="cert-preview-scroll">
            <!-- 실제 템플릿 HTML 또는 iframe 등을 이 div 안에 렌더링 -->
            <div id="certPreviewPage" class="cert-preview-page">
              증명서 미리보기 영역입니다.<br />
              상단에서 증명서 종류, 사원, 용도를 선택한 뒤<br />
              [증명서 확인] 버튼을 클릭하면<br />
              해당 증명서가 이 영역에 표시됩니다.
            </div>
          </div>
        </div>


      </div>
    </section>

    <!-- 전역 토스트 알림 -->
    <div id="toastContainer" class="rc-toast"></div>

    <!-- 전역 로딩 스피너 -->
    <div id="globalLoader" class="rc-loader-overlay" style="display:none;">
      <div class="rc-loader-spinner"></div>
    </div>

    <!-- JS -->
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/hr/certificationManage.js}"></script>
    
    <!-- modal -->
    <!-- 사원 모달 include -->
    <div th:replace="~{modal/userSearchModal :: userSearchModal}"></div>
    
  </div>
</body>

</html>

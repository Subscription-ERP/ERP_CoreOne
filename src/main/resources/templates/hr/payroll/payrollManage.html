<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
<title>급여관리</title>
<!-- SheetJS CDN -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- ToastUI Grid -->
<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<!-- ToastUI Date/Time Picker CSS -->
<link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
<link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
<!-- ToastUI JS -->
<script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
<script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
<script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
<script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
<!-- general.css -->
<link th:href="@{/css/general.css}" rel="stylesheet" />
<link th:href="@{/css/hr/hrUser.css}" rel="stylesheet" />

<style>


/* Tui Grid 데이터 없는 배경색과 유사한 밝은 회색 */
.table-summary tbody td {
	background-color: #f7f7f7 !important;
	/* !important를 사용하여 Bootstrap 기본 스타일을 덮어씁니다. */
}

/* 임금 항목 셀은 배경색을 제거하여 왼쪽은 흰색으로 남깁니다 (선택 사항) */
.table-summary tbody tr td:first-child {
	background-color: transparent !important;
}

th {
	width: 10%;
}
</style>
</head>

<body>
	<div layout:fragment="content" class="page page-fluid">
		<div class="row">
			<div class="">
				<!-- ==================== 조회 ================================================================== -->
				<section class="card-ui card-ui--search" style="margin-top: 10px; display: flex;">
					<div class=" card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px">
						<div class="filter-bar row g-4 align-items-center col-md-12">

							<!-- 귀속연월 범위 -->
							<div class="col-12 col-md-9">
								<div class="field-inline">
									<label for="payPeriod" class="field-inline__label">귀속연월</label>
									<!-- 범위 input -->
									<div id="payPeriodStartWrapper">
										<input id="payPeriodStart" type="month" class="form-control input-base" style="flex: 1; min-width: 0" />
									</div>
									~
									<div id="payPeriodEndWrapper">
										<input id="payPeriodEnd" type="month" class="form-control input-base" style="flex: 1; min-width: 0" />
									</div>
								</div>
							</div>

							<!-- 초기화 조회 명세서출력 버튼 -->
							<div class="col-12 col-md-3 d-flex align-items-center justify-content-end gap-2">
								<button id="btnPrint" type="button" class="btn btn-white btn-outer" style="flex-shrink: 0;">명세서출력</button>
								<button id="btnPayrollManageReset" type="button" class="btn btn-white btn-outer" style="flex-shrink: 0;">초기화</button>
								<button id="btnPayrollManageSearch" type="button" class="btn btn-color btn-outer" style="flex-shrink: 0;">조회</button>
							</div>
						</div>
					</div>
				</section>
				<!-- ================= 목록(Grid) 섹션 ================= -->
				<section class="card-ui section-flex" style="margin-top: 10px">
					<header class="card-ui__header">
						<h6 class="card-ui__title">사원급여조회</h6>
					</header>
					<!-- 급여대장목록조회 -->
					<!-- 급여대장 나오는 테이블 -->
					<div id="payrollDetailGrid" class="grid-root" style="height: 340px; margin-bottom: 20px;"></div>
					<!-- 상세 수당총액 -->
					<div style="padding-top: 10px; padding-bottom: 10px; padding-left: 12px; padding-right: 12px;">
						<h6 class="card-ui__title mb-2">상세 수당 총액</h6>
						<table class="table table-bordered table-sm table-summary">
							<thead>
								<tr style="text-align: center;">
									<th style="width: 10%;">임금 항목</th>
									<th>연장근로수당</th>
									<th>야간근로수당</th>
									<th>휴일근로수당</th>
									<th>가족수당</th>
									<th>식대 (비과세)</th>
									<th>연차휴가수당</th>
									<th>총 수당 총액</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td style="text-align: center;">지급 금액(원)</td>
									<td class="text-end" id="overtime"></td>
									<td class="text-end" id="night"></td>
									<td class="text-end" id="holiday"></td>
									<td class="text-end" id="family"></td>
									<td class="text-end" id="meal"></td>
									<td class="text-end" id="annual_leave"></td>
									<td class="text-end" id="total_allowance"></td>
								</tr>
							</tbody>
						</table>

						<h6 class="card-ui__title mb-2 mt-4">상세 공제 총액</h6>
						<table class="table table-bordered table-sm table-summary">
							<thead>
								<tr style="text-align: center;">
									<th>임금 항목</th>
									<th>소득세</th>
									<th>국민연금</th>
									<th>고용보험</th>
									<th>건강보험</th>
									<th>장기요양보험</th>
									<th>지방소득세</th>
									<th>결근병가공제</th>
									<th>총 공제 총액</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td style="text-align: center;">지급 금액(원)</td>
									<td class="text-end" id="income_tax"></td>
									<td class="text-end" id="national_pension"></td>
									<td class="text-end" id="employment_insurance"></td>
									<td class="text-end" id="health_insurance"></td>
									<td class="text-end" id="long_time_care_insurance"></td>
									<td class="text-end" id="local_income_tax"></td>
									<td class="text-end" id="absence"></td>
									<td class="text-end" id="total_deduction_amount"></td>
								</tr>
							</tbody>
						</table>
					</div>
				</section>
			</div>
		</div>

		<!-- ================= 급여명세서 인쇄 미리보기 모달 ==================================== -->
		<div id="printPreviewModal" class="modal-layer" hidden>

			<div class="modal-layer__dialog modal-layer__dialog--print"style="width:1000px; height:1000px; !important">
				<!-- 상단 헤더 -->
				<header class="modal-card__header">
					<h5 class="modal-card__title">급여명세서출력</h5>
					<button type="button" class="btn-icon modal-card__btn-close" id="btnPrintPreviewClose">
						<i class="bi bi-x-lg"></i>
					</button>
				</header>

				<!-- 내용 -->
				<div class="modal-card__body"style="width:1000px; height:1000px">
					<!-- A4 미리보기 영역 -->
					<div class="" style="width:1000px; height:1000px">
						<div class="print-preview__page-wrap"style="width:1000px; height:1000px">
							<!-- 실제 A4 HTML / Canvas가 들어갈 영역 -->
							<div class="" id="printPreviewPage" style="width:100%;">
								<div class="print-preview__placeholder">사원 카드 미리보기 영역 (A4 축소)</div>
							</div>
						</div>

						<!-- 하단 페이지 네비게이션 -->
						<div class="print-preview__pager">
							<button type="button" class="btn-icon print-preview__nav" id="btnPrintPrev">
								<i class="bi bi-arrow-left"></i>
							</button>

							<span class="print-preview__page-info"> <span id="printPageCurrent">1</span>/<span id="printPageTotal">1</span>
							</span>

							<button type="button" class="btn-icon print-preview__nav" id="btnPrintNext">
								<i class="bi bi-arrow-right"></i>
							</button>
						</div>
					</div>

					<!-- 확인 버튼 -->
					<div class="text-center mt-3">
						<button type="button" class="btn btn-color btn-inner" id="btnPrintPreviewConfirm">확인</button>
					</div>
				</div>
				<!-- // modal-card__body -->
			</div>
			<!-- // modal-layer__dialog -->
		</div>
		<!-- 전역 토스트 알림 -->
		<div id="toastContainer" class="rc-toast"></div>

		<script th:src="@{/js/hr/payRollManage.js}"></script>
		<script th:src="@{/js/common.js}"></script>
	</div>
</body>


</html>

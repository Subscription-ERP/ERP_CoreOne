<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<title>급여대장</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- TOAST UI Grid CSS 및 JS CDN 추가 -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

<style>
/* 기본 스타일 */
body {
	font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
	/* margin: 20px; */
	background-color: #f4f4f4;
}

.container {
	display: grid;
	/* grid-template-columns: 2fr 1fr; */ /* 좌측 (조회) 2, 우측 (등록) 1 비율 */
	grid-template-columns: 2fr 2fr;
	/* gap: 20px; */
	/* max-width: 1400px; */
	max-width: 1600px;
	margin: 0 auto;
	background-color: #fff;
	padding: 20px;
	border-radius: 8px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* 페이지이름(급여대장) */
h1 {
	grid-column: 1/3; /* 제목은 전체 너비를 차지 */
	margin-bottom: 20px;
	font-size: 24px;
	/* border-bottom: 3px solid #333; */
	padding-bottom: 5px;
}

/* 공통 컴포넌트 스타일 */
/* 좌우 칸 나누는 css */
.panel {
	border: 1px solid #ccc;
	padding: 15px;
	border-radius: 5px;
	background-color: #fff;
}

/* 전체 label과 input상자 묶은 클래스 */
.input-group {
	display: flex;
	align-items: center;
}

/* 전체 input상자에 해당하는 label들 */
.input-group label {
	/* 2. 라벨 텍스트 한 줄 표기를 위해 너비 확장 */
	width: 150px; /* 기존 80px에서 120px로 확장 */
	font-weight: bold;
	flex-shrink: 0;
	margin-right: 10px;
	white-space: nowrap; /* 텍스트가 줄바꿈되지 않고 한 줄로 표시되도록 설정 */
}

input, select {
	height: 36px;
}

/* 타입이 test, date, month, select(급여구분 select박스) input박스 태그 스타일 */
input[type="text"], input[type="date"], input[type="month"], select {
	padding: 8px;
	border: 1px solid #ddd;
	border-radius: 4px !important;
	flex-grow: 1;
}

.button-group {
	display: flex;
	gap: 5px;
}

.button-group button {
	padding: 8px 15px;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	font-weight: bold;
}

.btn-primary {
	background-color: #007bff;
	color: white;
}

.btn-secondary {
	background-color: #6c757d;
	color: white;
}

.btn-search {
	background-color: #28a745;
	color: white;
}

/* 테이블 스타일 */
.data-table {
	width: 100%;
	border-collapse: collapse;
	font-size: 14px;
	margin-top: 10px;
}

.data-table th, .data-table td {
	border: 1px solid #ddd;
	padding: 8px;
	text-align: center;
}

.data-table th {
	background-color: #e9ecef;
	font-weight: bold;
	white-space: nowrap;
}

.data-table tbody tr:hover {
	background-color: #f1f1f1;
}

/* 좌측: 급여대장 조회 전체 */
.salary-ledger-search {
	grid-column: 1;
}

.salary-ledger-search h2 {
	font-size: 18px;
}

.search-criteria {
	display: flex;
	gap: 10px;
	align-items: flex-start;
	margin-bottom: 15px;
	padding: 10px;
	border: 1px solid #ddd;
	background-color: #f8f9fa;
}

.search-input-box {
	display: flex;
	flex-direction: column;
	gap: 5px;
	flex-grow: 1;
}

.search-row {
	display: flex;
	gap: 10px;
}

.search-row>* {
	flex-grow: 1;
}

/* 우측: 급여대장 등록 */
.salary-ledger-register {
	grid-column: 2;
}

.register-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	border-bottom: 1px solid #ccc;
	padding-bottom: 10px;
	margin-bottom: 15px;
}

/* 급여대장 등록 쪽 css */
.register-header h3 {
	margin: 0;
	font-size: 18px;
}

.radio-group {
	display: flex;
	gap: 20px;
}

.radio-group label {
	width: 50px;
}

.register-form {
	margin-bottom: 15px;
}

/* 우측 하단: 대상자 선정 */
.target-selection {
	margin-top: 20px;
	border-top: 1px solid #ccc;
	padding-top: 15px;
}

.target-selection h4 {
	font-size: 18px;
}

.target-search-form {
	display: flex;
	gap: 10px;
	margin-bottom: 10px;
}

.target-search-form input, .target-search-form button {
	padding: 8px;
	border-radius: 4px;
}

.target-search-form input[type="text"] {
	flex-grow: 1;
}

.target-search-form button {
	flex-shrink: 0;
}

.checkbox-cell {
	width: 30px;
}
</style>
</head>

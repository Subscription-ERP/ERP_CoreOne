<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>근태관리</title>

	<!-- 필요하면 쓰고, 아니면 삭제하셔도 됩니다 -->
	<!-- SheetJS CDN -->
	<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
	<!-- ToastUI Grid -->
	<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
	<!-- ToastUI Calendar CSS -->
	<link rel="stylesheet" href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />
	<!-- ToastUI Date/Time Picker CSS -->
	<link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
	<link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
	<!-- ToastUI JS -->
	<script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
	<script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
	<script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
	<script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
	<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
	<!-- ToastUI Calendar JS -->
	<script src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>
	<!-- 공통 CSS -->
	<link th:href="@{/css/general.css}" rel="stylesheet" />

	<style>
		/* 화면 전체 틀 */
		.attendance-layout {
			display: flex;
			gap: 10px;
			padding: 10px 6px;
			height: calc(100vh - 120px);
		}

		/* 달력 + 요약 전체 묶음 */
		.attendance-main__content {
			display: flex;
			flex: 1;
			gap: 10px;
			overflow: hidden;
		}

		/* 달력 영역 */
		.attendance-calendar-wrap {
			flex: 3;
			border: 1px solid var(--mid-light-gray-color);
			background: #fff;
			border-radius: var(--radius);
			overflow: hidden;
		}

		#attendanceCalendar {
			width: 100%;
			height: 100%;
		}

		/* 금일 근태 요약 영역 */
		.attendance-summary {
			flex: 1;
			display: flex;
			flex-direction: column;
		}

		.attendance-summary__header {
			padding: 10px 12px;
			border-bottom: 1px solid var(--mid-light-gray-color);
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.attendance-summary__title {
			font-size: var(--fs-n);
			font-weight: 700;
		}

		.attendance-summary__badge {
			background: var(--base-color-soft);
			color: #fff;
			padding: 0 6px;
			border-radius: 11px;
			height: 22px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 11px;
		}

		.attendance-summary__table {
			width: 100%;
			border-collapse: collapse;
		}

		.attendance-summary__table th,
		.attendance-summary__table td {
			border-bottom: 1px solid var(--mid-light-gray-color);
			border-right: 1px solid var(--mid-light-gray-color);
			padding: 6px 8px;
			font-size: var(--fs-s);
			width: 50%;
		}

		.attendance-summary__table th {
			background: #f8f9fa;
			font-weight: 700;
			text-align: left;
		}

		.attendance-summary__table td {
			text-align: right;
		}

		/* 검색 섹션 공통 */
		.card-ui--search {
			margin-top: 10px;
		}

		.field-inline {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.field-inline__label {
			white-space: nowrap;
		}

		/* 달력 상단 툴바 ------------------------------------------ */
		.calendar-toolbar {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			padding: 8px 12px;
			border-bottom: 1px solid var(--mid-light-gray-color);
			background: #f8f9fa;
		}

		.calendar-toolbar__btn {
			min-width: 60px;
			height: 32px;
			padding: 0 12px;
			border-radius: 16px;
			border: 1px solid var(--mid-light-gray-color);
			background: #fff;
			font-size: 12px;
			cursor: pointer;
		}

		.calendar-toolbar__btn:hover {
			background: var(--light-gray-color);
		}

		.calendar-toolbar__current {
			margin: 0 4px;
			font-size: var(--fs-b);
			font-weight: 700;
		}

		/* 근태상태 ----------------------------------- */
		.att-dot {
			display: inline-block;
			width: 10px;
			height: 10px;
			border-radius: 50%;
			margin-right: 6px;
			vertical-align: middle;
		}

		.sub-grid__badge {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-width: 20px;
			height: 20px;
			padding: 0 6px;
			border-radius: 10px;
			background: var(--base-color-soft);
			color: #fff;
			font-size: 11px;
		}

		/* 툴팁 스타일 */
		.attendance-tooltip {
			position: absolute;
			z-index: 999;
			background: #fff;
			border: 1px solid var(--mid-light-gray-color);
			border-radius: 6px;
			padding: 6px 8px;
			font-size: 11px;
			box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
			display: none;
			max-width: 240px;
			max-height: 200px;
			overflow-y: auto;
			white-space: normal;
		}
	</style>
</head>

<body>
	<div layout:fragment="content" class="page page-fluid">
		<!-- ==================== 조회 ================================================================== -->
		<section class="card-ui card-ui--search" style="margin-top: 10px; display: flex;">
			<div class=" card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px">
				<div class="filter-bar row g-4 align-items-center col-md-12">
					<!-- 성명 -->
					<div class="col-12 col-md-3">
						<div class="field-inline">
							<label for="keyName" class="field-inline__label">성명</label> <input id="keyName" type="text"
								class="form-control input-base" style="flex: 1; min-width: 0" />
						</div>
					</div>

					<!-- 부서명 -->
					<div class="col-12 col-md-3">
						<div class="field-inline">
							<label for="dept-search" class="field-inline__label">부서명</label>
							<select id="dept-search" class="form-select input-base" style="flex: 1; min-width: 0">
							</select>
						</div>
					</div>

					<!-- 조회 버튼 -->
					<div class="col-12 col-md-2 ms-auto text-end">
						<button id="btnResetSearch" type="button" class="btn btn-white btn-outer">초기화</button>
						<button id="btnSearch" type="button" class="btn btn-color btn-outer">조회</button>
					</div>
				</div>
			</div>
		</section>

		<!-- 달력 + 금일 근태 상태 -->
		<section class="attendance-main__content">
			<!-- 달력 영역 -->
			<div class="attendance-calendar-wrap">
				<!-- 달력 header -->
				<div class="calendar-toolbar">
					<button type="button" class="calendar-toolbar__btn" id="btnCalToday">Today</button>
					<button type="button" class="calendar-toolbar__btn" id="btnCalPrev">&lt;</button>
					<span class="calendar-toolbar__current" id="calCurrentMonth"></span>
					<button type="button" class="calendar-toolbar__btn" id="btnCalNext">&gt;</button>
				</div>
				<!-- 실제 ToastUI Calendar가 붙을 div -->
				<div class="attendance-calendar" id="attendanceCalendar"></div>
			</div>

			<!-- 금일 근태 요약 -->
			<section class="card-ui attendance-summary">
				<header class="attendance-summary__header">
					<span class="attendance-summary__title">금일 근태 상황</span>
					<span id="todayTotal" class="sub-grid__badge">0</span>
				</header>
				<div class="card-ui__body" style="padding:0;">
					<table class="attendance-summary__table">
						<tbody>
							<tr th:each="att : ${attendTypes}"
							    th:attr="data-type=${att.type}">
								<th>
									<span class="att-dot" th:style="'background:' + ${att.color}"></span>
									<span th:text="${att.label}"></span>
								</th>
								<td th:attr="id=${att.type}">0</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div id="attendanceDetailTooltip" class="attendance-tooltip"></div>

			</section>
		</section>

		<!-- 전역 토스트 알림 -->
		<div id="toastContainer" class="rc-toast"></div>

		<!-- 전역 로딩 스피너 -->
		<div id="globalLoader" class="rc-loader-overlay" style="display: none;">
			<div class="rc-loader-spinner"></div>
		</div>

		<script th:src="@{/js/common.js}"></script>
		<script th:src=@{/js/hr/attendanceManage.js}></script>
	</div>

</body>

</html>

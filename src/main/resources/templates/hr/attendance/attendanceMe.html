<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">

<head>
  <title>내 근태 관리</title>

  <!-- SheetJS CDN (EXCEL 다운로드용) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- ToastUI Grid -->
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
  <!-- ToastUI Date/Time Picker CSS -->
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
  <!-- ToastUI JS -->
  <script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
  <script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
  <script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
  <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

  <!-- 공통 스타일 -->
  <link th:href="@{/css/general.css}" rel="stylesheet" />
  <link th:href="@{/css/hr/hrUser.css}" rel="stylesheet" />

  <style>
    /* 카드 안에서 Grid가 높이를 가져갈 수 있게 */
    .card-ui.card-ui--grid {
      /* 이미 inline style에서 높이를 주고 있으니 overflow만 관리 */
      display: flex;
      flex-direction: column;
    }

    .card-ui.card-ui--grid .card-ui__body {
      flex: 1 1 auto;
      /* 높이를 계산 가능하게 만들기 위해 */
      min-height: 0;
      overflow: hidden;
      /* 외부 스크롤 제거, 내부는 ToastUI가 담당 */
      padding: 0 12px;
      /* 필요 없으면 0으로 */
    }

    /* Grid가 body 높이를 그대로 쓰도록 */
    .grid-root {
      height: 100%;
      /* ★ 기존 min-height 대신 height:100% */
      min-height: 0;
    }

    #myAttendanceGrid td.tui-grid-cell.row-annual {
      background-color: #ffecec !important;
    }

    #workTimelineProgress {
	  transition: width 0.5s linear; /* 너비가 바뀔 때 부드럽게 */
	}
  </style>

</head>

<body>
  <div layout:fragment="content" class="page page-fluid">

    <!-- ================= 오늘 근태 현황 ================= -->
    <div class="wrap" style="display: flex; justify-content: space-between; gap: 4px; margin-top: 10px; width: 100%;">

      <!-- 왼쪽 카드 : 오늘 근태 요약 -->
      <section class="card-ui" style="flex: 0 0 calc(80% - 10px); margin:0 4px;">
        <div class="card-ui__body">
          <!-- 상단 날짜/상태 -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <strong id="todayWorkDateTime" style="font-size: var(--fs-b);">
                <!-- 예: 2025년 11월 19일 (목) 오전 09:20:58 -->
              </strong>
              <span class="badge bg-light text-dark ms-2" id="todayWorkStatusBadge">
                근무중
              </span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="small text-muted" style="font-size: var(--fs-b)">총 근로시간</span>
              <strong id="todayTotalWorkTime" style="font-size: var(--fs-b)">0시간 00분</strong>
            </div>
          </div>

          <!-- 근태 지표 요약 -->
          <div class="small mb-3">

            <!-- 1행: 출근 / 퇴근 / (빈 칸) -->
            <div class="row">
              <div class="col-md-4">
                <div class="d-flex justify-content-between">
                  <span>출근시간</span>
                  <span id="todayOnTime" class="mb-0">--:--:--</span>
                </div>
              </div>
              <div class="col-md-4">
                <div class="d-flex justify-content-between">
                  <span>퇴근시간</span>
                  <span id="todayOffTime" class="mb-0">--:--:--</span>
                </div>
              </div>
              <div class="col-md-4">
                <!-- 필요하면 여기에 다른 내용 넣기 -->
              </div>
            </div>

            <!-- 2행: 연장 / 야간 / (빈 칸) -->
            <div class="row mt-1">
              <div class="col-md-4">
                <div class="d-flex justify-content-between">
                  <span>연장시간</span>
                  <span id="todayOverTime" class="mb-0">00:00:00</span>
                </div>
              </div>
              <div class="col-md-4">
                <div class="d-flex justify-content-between">
                  <span>야간시간</span>
                  <span id="todayNightTime" class="mb-0">00:00:00</span>
                </div>
              </div>
              <div class="col-md-4">
                <!-- 필요하면 여기에 다른 내용 넣기 -->
              </div>
            </div>

            <!-- 3행: 총 연차일수 / 사용연차 / 잔여연차 -->
            <div class="row mt-1">
              <div class="col-md-4">
                <div class="d-flex justify-content-between">
                  <span>총 연차일수</span>
                  <span id="totalAnnualLeave" class="mb-0">0</span>
                </div>
              </div>
              <div class="col-md-4">
                <div class="d-flex justify-content-between">
                  <span>사용연차</span>
                  <span id="usedAnnualLeave" class="mb-0">0</span>
                </div>
              </div>
              <div class="col-md-4">
                <div class="d-flex justify-content-between">
                  <span>잔여연차</span>
                  <span id="remainAnnualLeave" class="mb-0">0</span>
                </div>
              </div>
            </div>

          </div>

          <!-- 근무 타임라인 -->
          <div>
            <div class="d-flex align-items-center mb-1">
              <span class="small text-muted">근무 타임라인</span>
            </div>

            <div class="w-100" id="workTimelineBar"
              style="height: 10px; background:#e5e5e5; border-radius:4px; overflow:hidden;">
              <!-- JS에서 width 조절 -->
              <div id="workTimelineProgress" style="height:100%; width:0; background:#788bc9;"></div>
            </div>

            <div class="d-flex justify-content-between small mt-1">
              <span id="timelineStartLabel">09:00</span>
              <span id="timelineLunchLabel">13:00 점심</span>
              <span id="timelineEndLabel">18:00</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 오른쪽 카드 : 퇴근 / 근무상태 변경 -->
      <section class="card-ui" style="flex: 0 0 calc(20% - 10px); margin:0 4px;">
        <div class="card-ui__body h-100 d-flex flex-column justify-content-between">
          <div class="mb-3">
            <button type="button" id="btnLeaveWork" class="btn btn-color btn-outer w-100" style="height: 115px;">
              퇴근하기
            </button>
          </div>

          <div class="mt-auto">
            <select id="workStatusSelect" class="form-select input-base">
              <!--               <option value="">근무상태변경</option>
              <option value="NORMAL">정상근무</option>
              <option value="OUTSIDE">외근</option>
              <option value="REMOTE">재택</option>
              <option value="ETC">기타</option> -->
            </select>
          </div>
        </div>
      </section>
    </div>


    <!-- ==================== 인사평가명 조회 =========================== -->
    <section class="card-ui card-ui--search" style="display:flex; height: 80px;">
      <div class="card-ui__body" style="flex:1; display:flex; align-items:center; padding:0 12px;">
        <div class="filter-bar row g-4 align-items-center col-md-12">

          <!-- 조회기간 -->
          <div class="col-12 col-md-6">
            <div class="field-inline" style="align-items: center;">
              <label for="reviewStartDate-search" class="field-inline__label">조회 기간</label>

              <div id="reviewStartDate-wrapper" class="col-md-3">
                <input id="reviewStartDate-search" type="date" name="reviewStartDate" class="form-control input-base"
                  style="max-width: 180px;" />
              </div>
              <span class="mx-2">~</span>
              <div id="reviewEndDate-wrapper" class="col-md-3">
                <input id="reviewEndDate-search" type="date" name="reviewEndDate" class="form-control input-base"
                  style="max-width: 180px;" />
              </div>
            </div>
          </div>

          <!-- 조회 버튼 -->
          <div class="col-12 col-md-2 ms-auto text-end">
            <button id="btnResetSearch" type="button" class="btn btn-white btn-outer">초기화</button>
            <button id="btnSearch" type="button" class="btn btn-color btn-outer">조회</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 근태 조회(검색 + Grid) ================= -->
    <section class="card-ui card-ui--grid section-flex">
      <header class="card-ui__header">
        <h6 class="card-ui__title">내 근태 목록</h6>
        <small class="text-muted">선택한 기간의 근태 내역이 아래 목록에 표시됩니다.</small>
      </header>

      <!-- Grid 영역 -->
      <div class="card-ui__body p-0">
        <!-- ToastUI Grid가 들어갈 영역 -->
        <div id="myAttendanceGrid" class="grid-root"></div>

      </div>
    </section>

    <!-- 전역 토스트 알림 -->
    <div id="toastContainer" class="rc-toast"></div>

    <!-- spinner(loading) -->
    <div id="globalLoader" class="rc-loader-overlay" style="display: none;">
      <div class="rc-loader-spinner"></div>
    </div>

    <!-- JS -->
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/hr/attendanceMe.js}"></script>
  </div>
</body>

</html>

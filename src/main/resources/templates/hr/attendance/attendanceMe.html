<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>내 근태 관리</title>

	<!-- SheetJS CDN (EXCEL 다운로드용) -->
	<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

	<!-- ToastUI Grid -->
	<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
	<!-- ToastUI Date/Time Picker CSS -->
	<link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
	<link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
	<!-- ToastUI JS -->
	<script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
	<script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
	<script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
	<script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
	<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

	<!-- 공통 스타일 -->
	<link th:href="@{/css/general.css}" rel="stylesheet" />
	<link th:href="@{/css/hr/hrUser.css}" rel="stylesheet" />
	<link th:href="@{/css/hr/attendanceMe.css}" rel="stylesheet" />

	<style>

	</style>

</head>

<body>
	<div layout:fragment="content" class="page page-fluid">

		<!-- ================= 오늘 근태 현황 ================= -->
		<div class="wrap" style="display: flex; justify-content: space-between; gap: 4px; margin-top: 10px; width: 100%;">

			<!-- 왼쪽 카드 : 오늘 근태 요약 -->
			<section class="card-ui" style="flex: 0 0 calc(80% - 10px); margin: 0 4px;">
				<div class="card-ui__body">
					<!-- 상단 날짜/상태 -->
					<div class="today-head">
						<div class="today-head__left">
							<strong id="todayWorkDateTime" class="today-head__datetime"></strong>

							<!-- 배지 그룹: 날짜 옆에 고정 -->
							<div class="today-badges">
								<span class="pill pill--status" id="todayWorkStatusBadge">
									<span class="pill__dot" aria-hidden="true"></span>
									<span class="pill__text">근무중</span>
								</span>

								<span class="pill pill--place d-none" id="todayWorkPlaceBadge">
									<i class="bi bi-building pill__icon" aria-hidden="true"></i>
									<span class="pill__text">사무실</span>
								</span>
							</div>
						</div>

						<!-- RIGHT -->
						<div class="today-head__right">
							<span class="today-head__label">총 근로시간</span>
							<strong id="todayTotalWorkTime" class="today-head__total">0시간 00분</strong>
						</div>
					</div>


					<!-- 근태 지표 요약 (KPI) -->
					<div class="kpi-grid mb-3">

						<div class="kpi">
							<div class="kpi__label">출근</div>
							<div class="kpi__value" id="todayOnTime">--:--:--</div>
						</div>

						<div class="kpi">
							<div class="kpi__label">퇴근</div>
							<div class="kpi__value" id="todayOffTime">--:--:--</div>
						</div>

						<div class="kpi">
							<div class="kpi__label">연장</div>
							<div class="kpi__value" id="todayOverTime">00:00:00</div>
						</div>

						<div class="kpi">
							<div class="kpi__label">야간</div>
							<div class="kpi__value" id="todayNightTime">00:00:00</div>
						</div>

						<div class="kpi kpi--accent">
							<div class="kpi__label">잔여연차</div>
							<div class="kpi__value">
								<span id="remainAnnualLeave">0</span><span class="kpi__unit">일</span>
							</div>
							<div class="kpi__sub">
								총 <span id="totalAnnualLeave">0</span> · 사용 <span id="usedAnnualLeave">0</span>
							</div>
						</div>

						<div class="kpi">
							<div class="kpi__label">총 근로</div>
							<div class="kpi__value" id="todayTotalWorkTime">0시간 00분</div>
						</div>

					</div>

					<!-- 근무 타임라인 -->
					<div class="timeline-block">
						<div class="timeline-wrap" id="timelineWrap">
							<div class="w-100" id="workTimelineBar">

								<div id="timelineLunchRange"></div>
								<div id="workTimelineProgress"></div>

								<div class="timeline-marker timeline-marker--in d-none" id="timelineInDot"></div>
								<div class="timeline-marker timeline-marker--out d-none" id="timelineOutDot"></div>

								<div class="timeline-now" id="timelineNowDot"></div>
							</div>

							<div class="timeline-tip" id="timelineNowTip"></div>
						</div>

						<div class="d-flex justify-content-between small mt-1">
							<span id="timelineStartLabel">09:00</span>
							<span id="timelineLunchLabel">13:00 점심</span>
							<span id="timelineEndLabel">18:00</span>
						</div>
					</div>

				</div>
			</section>

			<!-- 오른쪽 카드 : 퇴근 / 근무상태 변경 -->
			<!-- <section class="card-ui" style="flex: 0 0 calc(20% - 10px); margin: 0 4px;">
				<div class="card-ui__body h-100 d-flex flex-column justify-content-between">
					<div class="mb-3">
						<button type="button" id="btnLeaveWork" class="btn btn-color btn-outer w-100" style="height: 115px;">
							퇴근하기</button>
					</div>

					<div class="form-grid">
						<select id="workPlaceType" name="workPlaceType" class="form-select form-select-sm input-base">
						</select>
					</div>
				</div>
			</section>  -->
			<section class="card-ui side-action-card" style="flex: 0 0 calc(20% - 10px); margin: 0 4px;">
				<div class="card-ui__body h-100 d-flex flex-column">

					<!-- 메인 액션 버튼 -->
					<button type="button" id="btnLeaveWork" class="btn btn-color btn-outer w-100" style="height: 115px;">
						퇴근하기</button>

					<!-- 근무형태 선택 -->
					<div class="side-form">
						<label class="side-form__label" for="workPlaceType">근무형태</label>
						<!-- <select id="workPlaceType" name="workPlaceType" class="side-form__select">
						</select> -->
						<select id="workPlaceType" name="workPlaceType" class="form-select form-select-sm input-base">
						</select>
					</div>

				</div>
			</section>

		</div>


		<!-- ==================== 인사평가명 조회 =========================== -->
		<section class="card-ui card-ui--search" style="display: flex; height: 80px;">
			<div class="card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px;">
				<div class="filter-bar row g-4 align-items-center col-md-12">

					<!-- 조회기간 -->
					<div class="col-12 col-md-6">
						<div class="field-inline" style="align-items: center;">
							<label for="reviewStartDate-search" class="field-inline__label">조회 기간</label>

							<div id="reviewStartDate-wrapper" class="col-md-3">
								<input id="reviewStartDate-search" type="date" name="reviewStartDate" class="form-control input-base"
									style="max-width: 180px;" />
							</div>
							<span class="mx-2">~</span>
							<div id="reviewEndDate-wrapper" class="col-md-3">
								<input id="reviewEndDate-search" type="date" name="reviewEndDate" class="form-control input-base"
									style="max-width: 180px;" />
							</div>
						</div>
					</div>

					<!-- 조회 버튼 -->
					<div class="col-12 col-md-4 ms-auto text-end">
						<button id="btnResetSearch" type="button" class="btn btn-white btn-outer">초기화</button>
						<button id="btnSearch" type="button" class="btn btn-color btn-outer">조회</button>
					</div>
				</div>
			</div>
		</section>

		<!-- ================= 근태 조회(검색 + Grid) ================= -->
		<section class="card-ui card-ui--grid section-flex">
			<header class="card-ui__header">
				<h6 class="card-ui__title">내 근태 목록</h6>
				<small class="text-muted">선택한 기간의 근태 내역이 아래 목록에 표시됩니다.</small>
			</header>

			<!-- Grid 영역 -->
			<div class="card-ui__body p-0">
				<!-- ToastUI Grid가 들어갈 영역 -->
				<div id="myAttendanceGrid" class="grid-root"></div>

			</div>
		</section>

		<!-- 전역 토스트 알림 -->
		<div id="toastContainer" class="rc-toast"></div>

		<!-- spinner(loading) -->
		<div id="globalLoader" class="rc-loader-overlay" style="display: none;">
			<div class="rc-loader-spinner"></div>
		</div>

		<!-- JS -->
		<script th:src="@{/js/common.js}"></script>
		<script th:src="@{/js/hr/attendanceMe.js}"></script>
	</div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">

<head>
  <title>인사평가 기준관리</title>
  <!-- SheetJS CDN -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- ToastUI Grid -->
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
  <!-- ToastUI JS -->
  <script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
  <script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
  <!-- general.css -->
  <link th:href="@{/css/general.css}" rel="stylesheet" />
  <link th:href="@{/css/hr/hrUser.css}" rel="stylesheet" />

  <style>
    /* 상단 툴바 버튼 간격 */
    .toolbar {
      display: flex;
      gap: 6px;
    }

    /* 그리드 공통 높이 */
    .grid-root {
      min-height: 260px;
    }

    /* 섹션 제목 */
    .section-step-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 2px 8px;
      font-size: var(--fs-s);
      font-weight: 700;
    }

    /* 기본 정보 영역 */
    .eval-basic-grid {
      margin-bottom: 10px;
    }

    .eval-radio-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding-left: 4px;
      font-size: var(--fs-s);
    }

    .eval-radio-group label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      cursor: pointer;
      font-weight: 400;
    }

    .eval-del {
      border: 1px solid var(--light-gray-color);
      border-radius: 3px;
      font-size: var(--fs-s);
      transition: .3s;
    }

    .eval-del:hover {
      background-color: var(--gray-color);
    }

    .evalBtn-text {
      margin-top: 5px;
      font-size: var(--fs-s);
    }
    
  </style>
</head>

<body>
  <div layout:fragment="content" class="page page-fluid">

    <!-- ==================== 조회 영역 =============================================== -->
    <section class="card-ui card-ui--search" style="margin-top: 10px; display: flex;">
      <div class="card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px">
        <div class="filter-bar row g-4 align-items-center col-md-12">

          <div class="col-12 col-md-9" style="display: flex; gap: 20px; align-items: center; ">
            <!-- 템플릿명 -->
            <div class="col-12 col-md-4">
              <div class="field-inline">
                <label for="reviewMasterNameSearch" class="field-inline__label">템플릿명</label>
                <input id="reviewMasterNameSearch" type="text" name="reviewMasterNameSearch" class="form-control input-base"
                  style="flex: 1; min-width: 0;" />
              </div>
            </div>

            <!-- 날짜(시작일) -->
            <div class="col-12 col-md-3">
              <div class="field-inline">
                <label for="reviewStartDate" class="field-inline__label" id="reviewStartDate-searchWrapper">시작일</label>
                <input id="reviewStartDate-search" type="Date" name="reviewStartDate" class="form-control input-base"
                  style="flex: 1; min-width: 0;" />
              </div>
            </div>

            <!-- 날짜(종료일) -->
            <div class="col-12 col-md-3">
              <div class="field-inline">
                <label for="reviewEndDate" class="field-inline__label" id="reviewEndDate-searchWrapper">종료일</label>
                <input id="reviewEndDate-search" type="Date" name="reviewEndDate" class="form-control input-base"
                  style="flex: 1; min-width: 0;" />
              </div>
            </div>

            <!-- 사용여부 -->
            <div class="col-12 col-md-4">
              <div class="field-inline">
                <span class="field-inline__label">사용여부</span>
                <div class="eval-radio-group">
                  <label>
                    <input type="checkbox" name="searchUseYn" value="Y" />
                    <span>Y</span>
                  </label>
                  <label>
                    <input type="checkbox" name="searchUseYn" value="N" />
                    <span>N</span>
                  </label>
                </div>
              </div>
            </div>

          </div>

          <!-- 조회 버튼 -->
          <div class="col-12 col-md-2 ms-auto text-end">
            <button id="btnResetSearch" type="button" class="btn btn-white btn-outer">초기화</button>
            <button id="btnSearch" type="button" class="btn btn-color btn-outer">조회</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 인사평가 템플릿 목록(Grid) =================================== -->
    <section class="card-ui card-ui--grid">
      <header class="card-ui__header">
        <h6 class="card-ui__title">인사평가 템플릿 항목</h6>
        <small class="text-muted">행 선택 시 아래 상세 정보가 표시됩니다.</small>
      </header>

      <div class="card-ui__body p-0">
        <div id="reviewList"></div>
      </div>
    </section>
    

    <!-- ================= 인사평가 템플릿 등록 ========================================= -->
    <section class="card-ui card-ui--detail section-fixed" style="flex: 0 0 400px;">
      <header class="card-ui__header">
        <h6 class="card-ui__title">인사평가 템플릿 저장</h6>
        <!-- 우측 액션 -->
        <div class="toolbar">
          <button id="btnReset" type="button" class="btn btn-white btn-inner">초기화</button>
          <button id="btnSave" type="button" class="btn btn-color btn-inner">저장</button>
        </div>
      </header>

      <div class="card-ui__body section-scroll form-allwrapper">
        <form id="evalTemplateForm">

          <!-- 기본 정보 -->
          <div class="form-grid eval-basic-grid">
            <div class="form-grid__row">
              <div class="form-grid__label">템플릿명</div>
              <div class="form-grid__field">
                <input id="reviewMasterName" name="reviewMasterName" class="form-control form-control-sm input-base" />
              </div>

              <div class="form-grid__label">평가제도</div>
              <div class="form-grid__field">
                <input type="text" value="A~E 등급" class="form-control form-control-sm input-base disabled" disabled
                  readonly />
              </div>
            </div>

            <div class="form-grid__row">
              <div class="form-grid__label">평가 시작일</div>
              <div class="form-grid__field" id="reviewStartDateWrapper">
                <input id="reviewStartDate" name="reviewStartDate" type="date"
                  class="form-control form-control-sm input-base" />
              </div>

              <div class="form-grid__label">평가 종료일</div>
              <div class="form-grid__field" id="reviewEndDateWrapper">
                <input id="reviewEndDate" name="reviewEndDate" type="date"
                  class="form-control form-control-sm input-base" />
              </div>
            </div>

            <div class="form-grid__row">
              <div class="form-grid__label">사용여부</div>
              <div class="form-grid__field">
                <div class="eval-radio-group">
                  <label>
                    <input type="radio" name="useYn" value="Y" checked />
                    <span>Y</span>
                  </label>
                  <label>
                    <input type="radio" name="useYn" value="N" />
                    <span>N</span>
                  </label>
                </div>
              </div>

              <div class="form-grid__label">비고</div>
              <div class="form-grid__field">
                <input id="remark" name="remark" type="text" class="form-control form-control-sm input-base" />
              </div>
            </div>
          </div>

          <!-- 3. 평가 항목 -->
          <div class="form-grid form-grid--sub sub-grid sub-grid--cert">
            <!-- 헤더 -->
            <div class="sub-grid__header">
              <div class="sub-grid__title-wrap">
                <span class="sub-grid__title">평가항목</span>
              </div>
              <button type="button" class="btn btn-white btn-inner sub-grid__btn-add" id="btnEvalAdd">
                추가 +
              </button>
            </div>

            <!-- 본문 테이블 -->
            <div class="sub-grid__body">
              <table class="sub-table sub-table--cert">
                <colgroup>
                  <col style="width: 8%">
                  <col style="width: 20%">
                  <col style="width: 49%">
                  <col style="width: 15%">
                  <col style="width: 8%">
                </colgroup>
                <thead>
                  <tr>
                    <th>번호</th>
                    <th>항목명</th>
                    <th>설명</th>
                    <th>가중치(%)</th>
                    <th>삭제</th>
                  </tr>
                </thead>
                <tbody id="evalTbody">
                  <tr class="empty-row">
                    <td colspan="5" class="text-center text-muted py-3">
                      데이터가 없습니다. 추가해주세요.
                    </td>
                  </tr>
                  <!-- JS로 행 추가 -->
                </tbody>
              </table>
            </div>
          </div>

          <!-- 평가항목 입력 행 템플릿 -->
          <template id="evalRowTemplate">
            <tr>
              <td class="disabled"><input type="text" id="evalNum" class="form-control form-control-sm input-base" disabled readonly style="text-align: center;" /></td>
              <td><input type="text" name="evalName" class="form-control form-control-sm input-base" /></td>
              <td><input type="text" name="evalDetail" class="form-control form-control-sm input-base" /></td>
              <td><input type="text" name="evalWeight" class="form-control form-control-sm input-base" /></td>
              <td style="text-align: center;">
                <button type="button" class="eval-del">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>
          </template>
          <div class="evalBtn-text">
            * 가중치 합계 : <strong id="weightSum">0</strong>%
          </div>

        </form>
      </div>
    </section>

    <!-- 전역 토스트 알림 -->
    <div id="toastContainer" class="rc-toast"></div>

    <!-- 전역 로딩 스피너 -->
    <div id="globalLoader" class="rc-loader-overlay" style="display: none;">
      <div class="rc-loader-spinner"></div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/hr/reviewMaster.js}"></script>

  </div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
  <title>인사평가 관리</title>

  <!-- SheetJS CDN -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- ToastUI Grid -->
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

  <!-- ToastUI Date/Time Picker CSS -->
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />

  <!-- ToastUI JS -->
  <script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
  <script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
  <script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
  <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

  <!-- general.css -->
  <link th:href="@{/css/general.css}" rel="stylesheet" />

  <style>
    /* ---------------- 인사평가 관리 전용 스타일 ---------------- */

    /* 상단 툴바 버튼 간격 */
    .toolbar {
      display: flex;
      gap: 6px;
    }

    .grid-root {
      min-height: 220px;
    }

    /* step 번호 + 섹션 제목 */
    .section-step-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 2px 8px;
      font-size: var(--fs-s);
      font-weight: 700;
    }

    .section-step-title__bullet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--base-color-soft);
      color: #fff;
      font-size: 11px;
    }

    /* 평가자 정보 그리드 */
    .eval-info-grid {
      margin-bottom: 10px;
    }

    /* 라디오 그룹 공통 */
    .eval-radio-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding-left: 4px;
      font-size: var(--fs-s);
    }

    .eval-radio-group label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      cursor: pointer;
      font-weight: 400;
    }

    /* 평가 항목 테이블 */
    .sub-table--eval-items td:last-child {
      text-align: center;
    }

    .score-input-select {
      width: 80px;
      margin: 0 auto;
    }

    .eval-items__footer {
      padding: 6px 10px 10px;
      text-align: right;
      font-size: var(--fs-s);
      color: var(--black-color);
    }

    .eval-items__footer strong {
      color: var(--base-color);
      font-weight: 700;
    }

    /* 평가 코멘트 영역 */
    .eval-comment-area {
      margin-top: 6px;
    }

    .eval-comment-area textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: none;
      box-shadow: none;
      font-size: var(--fs-s);
      padding: 6px 8px;
    }
  </style>
</head>

<body>
<div layout:fragment="content" class="page page-fluid">

  <!-- ==================== 1. 인사평가명 조회 =========================== -->
  <section class="card-ui card-ui--search" style="margin-top:10px; display:flex;">
    <div class="card-ui__body" style="flex:1; display:flex; align-items:center; padding:0 12px;">
      <div class="filter-bar row g-4 align-items-center col-md-12">
        <!-- 인사평가명 -->
        <div class="col-12 col-md-6">
          <div class="field-inline">
            <label for="keyEvalName" class="field-inline__label">인사평가명</label>
            <input id="keyEvalName" type="text"
                   class="form-control input-base"
                   style="flex:1; min-width:0;" />
          </div>
        </div>

        <!-- 조회 버튼 -->
        <div class="col-12 col-md-2 ms-auto text-end">
          <button id="btnSearch" type="button" class="btn btn-color btn-outer">조회</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== 2. 인사평가 목록(Grid) ======================= -->
  <section class="card-ui card-ui--grid section-flex">
    <header class="card-ui__header">
      <div>
        <h6 class="card-ui__title">인사평가 목록</h6>
        <small class="text-muted">기준관리에서 등록된 템플릿 기준으로 인사평가 목록이 표시됩니다.</small>
      </div>
    </header>

    <div class="card-ui__body p-0">
      <div id="evalListGrid" class="grid-root"></div>
    </div>
  </section>

  <!-- ==================== 3~5. 팀원 목록 & 상세 평가 ==================== -->
  <section class="card-ui card-ui--detail section-fixed">
    <header class="card-ui__header">
      <div>
        <!-- 3. 팀원 평가 목록 제목 -->
        <div class="section-step-title" style="margin:0 0 4px;">
          <span class="section-step-title__bullet">3</span>
          <span>팀원 평가 목록</span>
        </div>
      </div>

      <!-- 우측 액션 (상세 평가 영역용 버튼) -->
      <div class="toolbar">
        <button id="btnDetailReset" type="button" class="btn btn-white btn-inner">초기화</button>
        <button id="btnDetailSave" type="button" class="btn btn-color btn-inner">등록</button>
      </div>
    </header>

    <div class="card-ui__body section-scroll">

      <!-- 3. 팀원 평가 목록 Grid -->
      <div class="card-ui card-ui--grid" style="margin:0 0 10px; border-radius:6px;">
        <div class="card-ui__body p-0">
          <div id="memberEvalGrid" class="grid-root"></div>
        </div>
      </div>

      <!-- 4. 인사평가 상세 제목 -->
      <div class="section-step-title" style="margin-top:4px;">
        <span class="section-step-title__bullet">4</span>
        <span>
          인사평가 -
          <span id="selectedEvalTitle">2025 상반기</span>
        </span>
      </div>

      <!-- 4-1. 평가자 정보 -->
      <div class="section-step-title" style="margin:0 2px 4px;">
        <span class="section-step-title__bullet">4-1</span>
        <span>피평가자 정보</span>
      </div>

      <div class="form-grid eval-info-grid">
        <div class="form-grid__row">
          <div class="form-grid__label">사원명</div>
          <div class="form-grid__field">
            <input id="userName" name="userName"
                   class="form-control form-control-sm input-base"
                   readonly />
          </div>

          <div class="form-grid__label">부서</div>
          <div class="form-grid__field">
            <input id="deptName" name="deptName"
                   class="form-control form-control-sm input-base"
                   readonly />
          </div>
        </div>

        <div class="form-grid__row">
          <div class="form-grid__label">총 점수</div>
          <div class="form-grid__field">
            <input id="totalScore" name="totalScore"
                   class="form-control form-control-sm input-base"
                   readonly />
          </div>

          <div class="form-grid__label">등급(A~E)</div>
          <div class="form-grid__field">
            <input id="totalGrade" name="totalGrade"
                   class="form-control form-control-sm input-base"
                   readonly />
          </div>
        </div>
      </div>

      <!-- 4-2. 평가 항목 -->
      <div class="section-step-title" style="margin:4px 2px 4px;">
        <span class="section-step-title__bullet">4-2</span>
        <span>평가 항목</span>
      </div>

      <div class="form-grid form-grid--sub sub-grid">
        <div class="sub-grid__body">
          <table class="sub-table sub-table--eval-items">
            <colgroup>
              <col style="width: 8%">
              <col style="width: 18%">
              <col style="width: 44%">
              <col style="width: 15%">
              <col style="width: 15%">
            </colgroup>
            <thead>
            <tr>
              <th>번호</th>
              <th>항목명</th>
              <th>설명</th>
              <th>가중치(%)</th>
              <th>점수입력(A~E)</th>
            </tr>
            </thead>
            <tbody id="evalItemTbody">
            <tr class="empty-row">
              <td colspan="5" class="text-center text-muted py-3">
                기준 템플릿에 등록된 평가 항목이 없습니다.
              </td>
            </tr>
            <!-- JS에서 행 채움 -->
            </tbody>
          </table>
        </div>

        <div class="eval-items__footer">
          * 가중치 합계 : <strong id="weightSum">0</strong>% / 최종 점수 :
          <strong id="finalScore">0.0</strong> 점
        </div>
      </div>

      <!-- 점수 입력 셀 템플릿 (선택 A~E) -->
      <template id="scoreSelectTemplate">
        <select name="scoreGrade"
                class="form-select form-select-sm input-base score-input-select">
          <option value="">선택</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="E">E</option>
        </select>
      </template>

      <!-- 5. 평가 코멘트 -->
      <div class="section-step-title eval-comment-area">
        <span class="section-step-title__bullet">5</span>
        <span>평가 코멘트</span>
      </div>

      <div class="form-grid">
        <div class="form-grid__row">
          <div class="form-grid__label">코멘트</div>
          <div class="form-grid__field form-grid__field--wide">
            <textarea id="evalComment" name="evalComment"
                      class="form-control form-control-sm input-base"
                      placeholder="피평가자에 대한 평가 코멘트를 입력해 주세요."></textarea>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- 전역 토스트 알림 -->
  <div id="toastContainer" class="rc-toast"></div>

  <!-- 전역 로딩 스피너 -->
  <div id="globalLoader" class="rc-loader-overlay" style="display:none;">
    <div class="rc-loader-spinner"></div>
  </div>

  <!-- JS (필요에 맞게 파일명만 조정해서 쓰시면 됩니다) -->
  <script th:src="@{/js/hr/evalManage.js}"></script>
  <script th:src="@{/js/common.js}"></script>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">

<head>
  <title>인사평가 관리</title>

  <!-- SheetJS CDN -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- ToastUI Grid -->
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
  <!-- ToastUI Date/Time Picker CSS -->
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
  <!-- ToastUI JS -->
  <script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
  <script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
  <script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
  <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
  <!-- general.css -->
  <link th:href="@{/css/general.css}" rel="stylesheet" />
  <link th:href="@{/css/hr/hrUser.css}" rel="stylesheet" />

  <style>
    /* 평가 코멘트 textarea 전용 */
    .form-grid textarea.textarea-comment {
      width: 100%;
      min-height: 80px;
      padding: 8px 10px;
      line-height: 1.5;
      border: none;
      box-sizing: border-box;
      resize: vertical;
    }

    /* placeholder 스타일 */
    .form-grid textarea.textarea-comment::placeholder {
      color: var(--disabled-color);
      font-size: var(--fs-s);
    }

    .textarea-comment:focus {
      outline: none !important;
      box-shadow: none !important;
      border-color: var(--mid-light-gray-color) !important;
    }
  </style>

</head>

<body>
  <div layout:fragment="content" class="page page-fluid">

    <!-- ==================== 인사평가명 조회 =========================== -->
    <section class="card-ui card-ui--search" style="margin-top:10px; display:flex; height: 80px;">
      <div class="card-ui__body" style="flex:1; display:flex; align-items:center; padding:0 12px;">
        <div class="filter-bar row g-4 align-items-center col-md-12">
          <!-- 인사평가명 -->
          <div class="col-12 col-md-4">
            <div class="field-inline">
              <label for="keyEvalName" class="field-inline__label">인사평가명</label>
              <input id="keyEvalName" type="text" class="form-control input-base" style="flex:1; min-width:0;" />
            </div>
          </div>

          <!-- 조회 버튼 -->
          <div class="col-12 col-md-2 ms-auto text-end">
            <button id="btnSearch" type="button" class="btn btn-white btn-outer">초기화</button>
            <button id="btnSearch" type="button" class="btn btn-color btn-outer">조회</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== 인사평가 목록(Grid) ======================= -->
    <section class="card-ui card-ui--grid section-flex" style="flex: 0 0 190px; min-height: 190px;">
      <header class="card-ui__header">
        <div>
          <h6 class="card-ui__title">인사평가 목록</h6>
        </div>
      </header>

      <div class="card-ui__body p-0" >
        <div id="reviewList"  class="grid-root" style="overflow-y: auto"></div>
      </div>
    </section>

    <!-- ==================== 인사평가 팀원 목록(Grid) ======================= -->
    <section class="card-ui card-ui--grid section-flex" style="flex: 0 0 190px; min-height: 190px;">
      <header class="card-ui__header">
        <div>
          <h6 class="card-ui__title">팀원 목록</h6>
        </div>
      </header>

      <div class="card-ui__body p-0">
        <div id="evalListGrid"></div>
      </div>
    </section>


    <!-- ==================== 상세 평가 ==================== -->
    <section class="card-ui card-ui--detail section-fixed" style="flex: 0 0 300px;">
      <header class="card-ui__header">
        <div>
          <h3 style="font-size: var(--fs-bb); font-weight: 700;">제목영역</h3>
        </div>

        <!-- 우측 액션 (상세 평가 영역용 버튼) -->
        <div class="toolbar">
          <button id="btnDetailReset" type="button" class="btn btn-white btn-inner">초기화</button>
          <button id="btnDetailSave" type="button" class="btn btn-color btn-inner">등록</button>
        </div>
      </header>

      <div class="card-ui__body section-scroll">

        <div class="form-grid eval-info-grid">
          <div class="form-grid__row form-grid__row--3col">
            <div class="form-grid__label">사원명</div>
            <div class="form-grid__field">
              <input id="userName" name="userName" class="form-control form-control-sm input-base disabled" readonly />
            </div>

            <div class="form-grid__label">부서</div>
            <div class="form-grid__field">
              <input id="deptName" name="deptName" class="form-control form-control-sm input-base disabled" readonly />
            </div>

            <div class="form-grid__label">총 점수</div>
            <div class="form-grid__field">
              <input id="totalScore" name="totalScore" class="form-control form-control-sm input-base disabled"
                readonly />
            </div>
          </div>

        </div>

        <!-- ===== 평가 ===== -->
        <div id="tab-cert" style="margin: 7px 0;">
          <div class="form-grid form-grid--sub sub-grid sub-grid--cert">
            <!-- 헤더 -->
            <div class="sub-grid__header">
              <div class="sub-grid__title-wrap">
                <span class="sub-grid__title">평가항목</span>
                <span class="sub-grid__badge" id="certCount">0</span>
              </div>
            </div>

            <!-- 본문 테이블 -->
            <div class="sub-grid__body">
              <table class="sub-table sub-table--cert">
                <colgroup>
                  <col style="width: 8%">
                  <col style="width: 20%">
                  <col style="width: 32%">
                  <col style="width: 20%">
                  <col style="width: 20%">
                </colgroup>
                <thead>
                  <tr>
                    <th>번호</th>
                    <th>항목명</th>
                    <th>설명</th>
                    <th>가중치(%)</th>
                    <th>점수입력(A~E)</th>
                  </tr>
                </thead>
                <tbody id="reviewTbody">
                  <tr class="empty-row">
                    <td colspan="6" class="text-center text-muted py-3">데이터가
                      없습니다.</td>
                  </tr>
                  <!-- JS로 행 추가 -->
                </tbody>
              </table>
            </div>
          </div>

          <!-- 입력 행 템플릿 -->
          <template id="certRowTemplate">
            <tr>
              <td class="disabled"><input type="text" name="certiName"
                  class="form-control form-control-sm input-base disabled" readonly /></td>
              <td class="disabled"><input type="text" name="issueOrgName"
                  class="form-control form-control-sm input-base disabled" readonly /></td>
              <td class="disabled"><input type="date" name="getDate"
                  class="form-control form-control-sm input-base disabled" readonly /></td>
              <td class="disabled"><input type="text" name="licenseNo"
                  class="form-control form-control-sm input-base disabled" readonly /></td>
              <td><input type="date" name="expireDate" class="form-control form-control-sm input-base" /></td>
            </tr>
          </template>
        </div>

        <!-- 평가 코멘트 -->
        <div class="form-grid">
          <div class="form-grid__row">
            <div class="form-grid__label">코멘트</div>
            <div class="form-grid__field form-grid__field--wide">
              <textarea id="evalComment" name="evalComment" class="form-control form-control-sm textarea-comment"
                placeholder="피평가자에 대한 평가 코멘트를 입력해 주세요."></textarea>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- 전역 토스트 알림 -->
    <div id="toastContainer" class="rc-toast"></div>

    <!-- 전역 로딩 스피너 -->
    <div id="globalLoader" class="rc-loader-overlay" style="display:none;">
      <div class="rc-loader-spinner"></div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/hr/reviewManage.js}"></script>

  </div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
<title>조직도</title>
<script src="https://uicdn.toast.com/tui-tree/latest/tui-tree.js"></script>
<link rel="stylesheet" type="text/css" href="https://uicdn.toast.com/tui-tree/latest/tui-tree.css" />
</head>

<body>
	<div layout:fragment="content" class="page page-fluid">
		<div class="row">
			<div class="col-lg-3 pe-0" style="width:20%">
				<!-- ==================== 조회 ================================================================== -->
				<section class="card-ui section-flex card-ui__body " style="margin-top: 10px; display: flex; height: 780px;background-color: #F8F8F8;">
					<div id="tree" class="tui-tree-wrap" style="height: 750px; overflow-y: auto;"></div>
				</section>
			</div>
			<div class="col-lg-9 p-0 pe-2" style="width:80%">
				<!-- ================= 목록(Grid) 섹션 ================= -->
				<section class="card-ui" style="margin-top: 10px; display: flex; height: 780px">
					<!-- 부서별 사원 조회 -->
					<div id="payrollGrid" class="grid-root"></div>
				</section>
			</div>
		</div>
		<script th:src="@{/js/hr/deptManage.js}"></script>
	</div>
</body>


</html>

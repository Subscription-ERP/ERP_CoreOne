<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
<title>연차관리</title>
<!-- SheetJS CDN -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- ToastUI Grid -->
<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<!-- ToastUI Date/Time Picker CSS -->
<link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
<link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
<!-- ToastUI JS -->
<script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
<script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
<script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
<script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
<!-- general.css -->
<link th:href="@{/css/general.css}" rel="stylesheet" />
<link th:href="@{/css/hr/hrUser.css}" rel="stylesheet" />

<style>
/* Tui Grid 데이터 없는 배경색과 유사한 밝은 회색 */
.table-summary tbody td {
	background-color: #f7f7f7 !important;
	/* !important를 사용하여 Bootstrap 기본 스타일을 덮어씁니다. */
}
</style>
</head>

<body>
	<div layout:fragment="content" class="page page-fluid">
		<div class="row">
			<div class="">
				<!-- ==================== 조회 ================================================================== -->
				<section class="card-ui card-ui--search" style="margin-top: 10px; display: flex;">
					<div class=" card-ui__body" style="flex: 1; display: flex; align-items: center; padding: 0 12px">
						<div class="filter-bar row g-4 align-items-center col-md-12">
							<!-- 부서명 -->
							<div class="col-12 col-md-3">
								<div class="field-inline">
									<label for="dept" class="field-inline__label">부서명</label> <select id="dept" class="form-select input-base" style="flex: 1; min-width: 0">
									</select>
								</div>
							</div>

							<!-- 성명 -->
							<div class="col-12 col-md-3">
								<div class="field-inline">
									<label for="userName" class="field-inline__label">성명</label> <input id="userName" type="text" class="form-control input-base" style="flex: 1; min-width: 0" />
								</div>
							</div>
							
							<!-- 연차신청일 범위 -->
							<div class="col-12 col-md-4">
								<div class="field-inline">
									<label for="payrollDate" class="field-inline__label">연차시작종료일</label>
									<!-- 범위 input -->
									<div id="paymentStartDateWrapper">
										<input id="paymentStartDate" type="date" class="form-control input-base"  style="width: 145px"  />
									</div>
									~
									<div id="paymentEndDateWrapper">
										<input id="paymentEndDate" type="date" class="form-control input-base" style="width: 145px"  />
									</div>

								</div>
							</div>

							<!-- 초기화 조회 버튼 -->
							<div class="col-12 col-md-2 d-flex align-items-center justify-content-end gap-2">
								<button id="btnPayrollManageReset" type="button" class="btn btn-white btn-outer" style="flex-shrink: 0;">초기화</button>
								<button id="btnPayrollManageSearch" type="button" class="btn btn-color btn-outer" style="flex-shrink: 0;">조회</button>
							</div>
							<!-- 연차신청일 범위 -->
							<div class="col-12 col-md-4 mt-0">
								<div class="field-inline">
									<label for="payrollDate" class="field-inline__label">연차신청일</label>
									<!-- 범위 input -->
									<div id="paymentStartDateWrapper">
										<input id="paymentStartDate" type="date" class="form-control input-base" style="width: 145px" />
									</div>
									~
									<div id="paymentEndDateWrapper">
										<input id="paymentEndDate" type="date" class="form-control input-base" style="width: 145px"  />
									</div>

								</div>
							</div>
						</div>
					</div>
				</section>
				<!-- ================= 목록(Grid) 섹션 ================= -->
				<section class="card-ui section-flex" style="margin-top: 10px">
					<header class="card-ui__header">
						<h6 class="card-ui__title">연차신청이력조회</h6>
					</header>
					<!-- 연차신청조회 -->
					<!-- 연차현황 나오는 테이블 -->
					<div id="annualDetailGrid" class="grid-root" style="height: 270px; margin-bottom: 20px;"></div>
					<!-- 상세 수당총액 -->
					<div style="padding-top: 10px; padding-bottom: 10px; padding-left: 12px; padding-right: 12px;">
						<h6 class="card-ui__title mb-2">현재 내 연차 현황</h6>
						<table class="table table-bordered table-sm table-summary">
							<thead>
								<tr style="text-align: center;">
									<th>발생연차</th>
									<th>사용일수</th>
									<th>잔여연차</th>
									<th>소멸예정일</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td class="text-end" id="totalGrantDays">30</td>
									<td class="text-end" id="totalUsedDays">20</td>
									<td class="text-end" id="remainingDays">10</td>
									<td class="text-center" id="expiryDate">2026-01-01</td>
								</tr>
							</tbody>
						</table>
						<header class="card-ui__header">
							<h6 class="card-ui__title">연차신청</h6>
							<!-- 우측 액션 -->
							<div class="toolbar" id="chogihwa">
								<button id="btnReset" type="button" class="btn btn-white btn-inner ms-auto">초기화</button>
								<button id="btnSave" type="button" class="btn btn-color btn-inner ms-auto">저장</button>
							</div>
						</header>
						<form id="userForm" enctype="multipart/form-data">
							<div id="tab-basic" class="tab-panel active form-allwrapper">

								<div class="form-grid">
									<div class="form-grid__row form-grid__row--3col">
										<div class="form-grid__label">사번</div>
										<div class="form-grid__field disabled">
											<input id="userId" name="userId" class="form-control form-control-sm input-base" disabled readonly />
										</div>

										<div class="form-grid__label">성명</div>
										<div class="form-grid__field disabled">
											<input id="myAnnualUserName" name="myAnnualUserName" class="form-control form-control-sm input-base" disabled readonly />
										</div>

										<div class="form-grid__label">부서명</div>
										<div class="form-grid__field disabled">
											<input id="myAnuualdeptName" name="myAnuualdeptName" class="form-control form-control-sm input-base" disabled readonly />
										</div>
									</div>

									<div class="form-grid__row form-grid__row--3col">
										<div class="form-grid__label">직급</div>
										<div class="form-grid__field disabled">
											<input id="myAnuualjobTitle" name="myAnuualjobTitle" class="form-control form-control-sm input-base" disabled readonly />
										</div>

										<div class="form-grid__label">신청구분</div>
										<div class="form-grid__field">
											<select id="leaveType" name="leaveType" class="form-select form-select-sm input-base">
											</select>
										</div>

										<div class="form-grid__label">사용일수</div>
										<div class="form-grid__field disabled">
											<input id="usedDays" name="usedDays" class="form-control form-control-sm input-base" disabled readonly style="text-align:right" />
										</div>
									</div>

									<div class="form-grid__row form-grid__row--3col">
										<div class="form-grid__label" id="annualStartDateLabel">연차시작일</div>
										<div class="form-grid__field" id="annualStartDateWrapper">
											<input id="annualStartDate" name="annualStartDate" type="date" class="form-control form-control-sm input-base" style="text-align:center"/>
										</div>

										<div class="form-grid__label" id="annualEndDateLabel">연차종료일</div>
										<div class="form-grid__field" id="annualEndDateWrapper">
											<input id="annualEndDate" name="annualEndDate" type="date" class="form-control form-control-sm input-base" style="text-align:center"/>
										</div>

										<div class="form-grid__label">연차신청일</div>
										<div class="form-grid__field disabled">
											<input id="leaveApplyDate" name="leaveApplyDate" class="form-control form-control-sm input-base" disabled readonly style="text-align:center" />
										</div>
									</div>
									<div class="form-grid__row">
										<div class="form-grid__label">사유</div>
										<div class="form-grid__field form-grid__field--wide">
											<input id="rm" name="rm" class="form-control form-control-sm input-base" />
										</div>
									</div>

								</div>
							</div>
						</form>
					</div>
				</section>
			</div>
		</div>

		<!-- 전역 토스트 알림 -->
		<div id="toastContainer" class="rc-toast"></div>

		<script th:src="@{/js/common.js}"></script>
		<script th:src="@{/js/hr/annualManage.js}"></script>
	</div>
</body>


</html>

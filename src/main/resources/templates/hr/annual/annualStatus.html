<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>

<title>연차현황조회</title>

<!-- SheetJS CDN -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- ToastUI Grid -->
<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

<!-- ToastUI Date/Time Picker CSS -->
<link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
<link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />

<!-- ToastUI JS -->
<script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
<script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
<script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
<script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

<!-- general.css -->
<link th:href="@{/css/general.css}" rel="stylesheet" />
<link th:href="@{/css/hr/hrUser.css}" rel="stylesheet" />

<style>
</style>
</head>

<body>
	<div layout:fragment="content" class="page page-fluid">
		<div class="row">
			<!-- ==================== 조회 ================================================================== -->
			<section class="card-ui card-ui--search" style="margin-top: 10px; display: flex; margin-left: 18px; width: 98%; padding: 0;">
				<div class="card-ui__body" style="flex: 1; display: flex; align-items: center;">
					<div class="filter-bar row g-4 align-items-center col-md-12">
						<!-- 성명 -->
						<div class="col-12 col-md-3">
							<div class="field-inline">
								<label for="annualStatusUserName" class="field-inline__label me-4">성명</label><input id="annualStatusUserName" type="text" class="form-control input-base" style="flex: 1; min-width: 0" />
							</div>
						</div>

						<!-- 부서명 -->
						<div class="col-12 col-md-3">
							<div class="field-inline">
								<label for="dept" class="field-inline__label">부서명</label> <select id="dept" class="form-select input-base" style="flex: 1; min-width: 0"></select>
							</div>
						</div>

						<!-- 잔여연차 -->
						<div class="col-12 col-md-3">
							<div class="field-inline">
								<label for="annualStatusRemainingDaysStart" class="field-inline__label w-25">잔여연차</label>
								<div id="annualStatusRemainingDaysStartWrapper">
									<input id="annualStatusRemainingDaysStart" type="number" class="form-control input-base" style="flex: 1; min-width: 0" />
								</div>
								~
								<div id="annualStatusRemainingDaysEndWrapper">
									<input id="annualStatusRemainingDaysEnd" type="number" class="form-control input-base" style="flex: 1; min-width: 0" />
								</div>
							</div>
						</div>

						<!-- 초기화 조회 버튼 -->
						<div class="col-12 col-md-3 d-flex justify-content-end gap-2">
							<button id="annualStatusBtnReset" type="button" class="btn btn-white btn-outer" style="flex-shrink: 0;">초기화</button>
							<button id="annualStatusBtnSearch" type="button" class="btn btn-color btn-outer" style="flex-shrink: 0;">조회</button>
						</div>
						
						<!-- 부여연도 -->
						<div class="col-12 col-md-3 mt-0">
							<div class="field-inline">
								<label for="grantYear" class="field-inline__label w-25">부여연도</label>
								<div id="annualStatusgrantYearStartWrapper">
									<input id="annualStatusgrantYearStart" type="number" class="form-control input-base" style="flex: 1; min-width: 0" />
								</div>
								~
								<div id="annualStatusgrantYearEndWrapper">
									<input id="annualStatusgrantYearEnd" type="number" class="form-control input-base" style="flex: 1; min-width: 0" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
			<div class="col-lg-12">
				<!-- ================= 목록(Grid) 섹션 ================= -->
				<section class="card-ui section-flex" style="margin-top: 10px; height: 650px;">
					<header class="card-ui__header">
						<h6 class="card-ui__title">연차현황목록</h6>
					</header>
					<!-- 연차현황목록 -->
					<div id="annualStatusGrid" class="grid-root"></div>
				</section>
			</div>
			<!-- 전역 토스트 알림 -->
			<div id="toastContainer" class="rc-toast"></div>
			<!-- 공통코드 불러오는 스크립트 -->
			<script th:src="@{/js/common.js}"></script>
			<script th:src="@{/js/hr/annualStatus.js}"></script>
		</div>
	</div>
</body>
</html>

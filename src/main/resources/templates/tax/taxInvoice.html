<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8" />
<title>세금계산서 화면 예시</title>

<!-- Toast UI Grid -->
<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.min.css">
<script src="https://uicdn.toast.com/grid/latest/tui-grid.min.js"></script>

</head>
<body>
<div  layout:fragment="content">
<div class="container-fluid p-3">

  <div class="mb-3">
    <button class="btn btn-secondary">수주 가져오기</button>
  </div>

  <div class="row g-3">

    <div class="col-md-6">
      <h5>공급자</h5>
      <table class="table table-bordered align-middle">
        <tbody>
          <tr><th class="bg-light">사업자등록번호</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">상호</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">성명</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">주소</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">업종</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">업태</th><td><input type="text" class="form-control"></td></tr>
        </tbody>
      </table>
    </div>

    <div class="col-md-6">
      <h5>공급받는자</h5>
      <table class="table table-bordered align-middle">
        <tbody>
          <tr>
            <th class="bg-light w-25">사업자등록번호</th>
            <td>
              <div class="input-group">
                <input type="text" class="form-control">
                <button class="btn btn-outline-secondary">??</button>
              </div>
            </td>
          </tr>
          <tr><th class="bg-light">상호</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">성명</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">주소</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">업종</th><td><input type="text" class="form-control"></td></tr>
          <tr><th class="bg-light">업태</th><td><input type="text" class="form-control"></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="row g-3 my-3">
    <div class="col-md-6">
      <label class="form-label fw-bold">공급가액</label>
      <input type="text" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold">세액</label>
      <input type="text" class="form-control">
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mb-2">
    <button class="btn btn-outline-secondary">초기화</button>
    <button class="btn btn-primary">저장</button>
  </div>

  <div class="card">
    <div class="card-body">
      <div id="invoice-grid"></div>
    </div>
  </div>

</div>

<script>
  const data = [
    { 
      "품번": "2025-HR-001",
      "품명": "AAA",
      "출고일자": "2025-01-02",
      "출고수량": 10,
      "단가": 500,
      "공급가액": 5000,
      "세액": 500
    }
  ];

  const grid = new tui.Grid({
    el: document.getElementById('invoice-grid'),
    data: data,
    scrollX: true,
    scrollY: true,
    minBodyHeight: 300,
    rowHeaders: ['rowNum'],
    columns: [
      { header: '품번', name: '품번', editor: 'text' },
      { header: '품명', name: '품명', editor: 'text' },
      { header: '출고일자', name: '출고일자', editor: 'text' },
      { header: '출고수량', name: '출고수량', editor: 'text' },
      { header: '단가', name: '단가', editor: 'text' },
      { header: '공급가액', name: '공급가액', editor: 'text' },
      { header: '세액', name: '세액', editor: 'text' }
    ]
  });
</script>
</div>
</body>
</html>

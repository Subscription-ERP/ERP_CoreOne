<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">

<head>
  <title>CoreOne ERP | 업무의 중심을 한 곳에</title>
  <!-- general.css -->
  <link th:href="@{/css/general.css}" rel="stylesheet" />
  <link th:href="@{/css/main.css}" rel="stylesheet" />
</head>

<body th:classappend="${session.LOGIN_USER_ID == null} ? 'guest-mode' : ''">
  <div layout:fragment="content">

    <section class="guest-hero" th:if="${session.LOGIN_USER_ID == null}"
                                th:style="|background-image:url('/assets/img/background_building.png');|">

      <div class="guest-hero__overlay"></div>
      
      <!-- 상단 로고 -->
	  <div class="guest-hero__top">
	  	<a href="/" class="guest-hero__logo-link" aria-label="CoreOne 메인으로 이동">
	    	<img src="/assets/img/coreone_logo.png" alt="CoreOne ERP" class="guest-hero__logo">
	  	</a>
	  </div>

      <div class="guest-hero__inner">
        <div class="guest-hero__card">
          <div class="guest-hero__badge">
            <i class="fa-solid fa-building"></i>
            <span>CoreOne ERP</span>
          </div>

          <h1 class="guest-hero__title">업무의 중심을 한 곳에</h1>

          <p class="guest-hero__desc">
            로그인 후 대시보드에서 회계·인사·영업을 한 번에 관리할 수 있습니다.<br>
            계속하려면 로그인하거나 구독을 시작해 주세요.
          </p>

          <div class="guest-hero__actions">
            <a class="btn btn-color btn-lg" href="/auth/login">
              <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> <span style="font-size: 18px;">로그인</span>
            </a>

            <a class="btn btn-outline-light btn-lg" href="/cm/company">
              <i class="fa-solid fa-credit-card me-2"></i> <span style="font-size: 18px;">구독하기</span>
            </a>
          </div>

          <div class="guest-hero__hint">
            <i class="fa-regular fa-circle-question me-2"></i>
           	<span style="font-size: 13px;">계정이 있으시면 로그인 후 이용 가능합니다.</span>
          </div>
        </div>
      </div>
      
      <!-- 하단 footer -->
	  <div class="guest-hero__footer">
	    <span>© 2025 RootCore · CoreOne ERP Project</span>
	  </div>
    </section>








  </div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>사원 모달</title>

  <!-- 필요시 별도 CSS -->
<!--   <link rel="stylesheet" th:href="@{/css/modal/hrEmpModal.css}"> -->
  <!-- Toast UI Grid (팀 규칙 동일하게) -->
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.min.css">
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.min.js"></script>
</head>

<!-- ★★★ 여기! body에 th:fragment 지정 ★★★ -->
<body th:fragment="userSearchModal">
  <!-- 사원 조회 모달 -->
  <div id="hrEmpModal" class="modal-layer" hidden>
    <div class="modal-layer__backdrop"></div>

    <div class="modal-layer__dialog modal-layer__dialog--lg" style="width: 900px">

      <!-- 상단 헤더 -->
      <header class="modal-card__header">
        <h5 class="modal-card__title">사원 조회</h5>
        <button type="button" class="btn-icon modal-card__btn-close" id="btnHrEmpClose">
          <i class="bi bi-x-lg"></i>
        </button>
      </header>

      <!-- 내용 -->
      <div class="modal-card__body">
        <!-- 검색 영역 -->
        <div class="modal-history__info-row">
          <div class="modal-history__field col-auto">
            <span class="modal-history__label" style="width: 80px">사번</span>
            <span class="modal-history__value" style="width: 150px; padding: 0;">
              <input type="text" id="schEmpId" class="form-control input-base">
            </span>

            <span class="modal-history__label" style="width: 80px">이름</span>
            <span class="modal-history__value" style="width: 150px; padding: 0;">
              <input type="text" id="schEmpName" class="form-control input-base">
            </span>
          </div>

          <button type="button" id="btnHrEmpSearch"
                  class="btn btn-white btn-inner modal-history__btn-print col-md-2">
            조회
          </button>
        </div>

        <!-- 목록 (Toast UI Grid 영역) -->
        <div class="form_grid sub-grid mt-2">
          <div class="sub-grid__body">
            <div id="hrEmpModalGrid"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 이 모달 전용 JS -->
  <script th:src="@{/js/hr/userSearchModal.js}"></script>
</body>
</html>

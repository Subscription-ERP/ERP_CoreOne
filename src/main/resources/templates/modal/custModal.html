<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" th:href="@{/css/modal/custModel.css}">
</head>

<body>
  <div th:fragment="custModalFragment">
    <!-- 거래처 조회 모달 -->
    <div class="modal fade" id="custModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg"> <!-- 사진처럼 가로 넓은 모달 -->
        <div class="modal-content">
    
          <!-- 헤더 -->
          <div class="modal-header py-2">
            <h5 class="modal-title">거래처 조회</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
    
          <!-- 바디 -->
          <div class="modal-body p-3">
    
            <!-- 검색 영역 -->
            <div class="row g-2 align-items-center mb-2 small-form-bottom">
              <div class="col-md-3 d-flex align-items-center">
                <label class="form-label mb-0 me-2" for="schCustName">거래처명</label>
                <input type="text" id="schCustName" class="form-control">
              </div>
              <div class="col-md-3 d-flex align-items-center">
                <label class="form-label mb-0 me-2" for="schCeoName">대표자명</label>
                <input type="text" id="schCeoName" class="form-control">
              </div>
              <div class="col-md-3 d-flex align-items-center">
                <label class="form-label mb-0 me-2" for="schType">거래처유형</label>
                <select id="schType" class="form-select">
                  <option value="">전체</option>
                  <option value="BUY">매입업체</option>
                  <option value="SELL">매출업체</option>
                </select>
              </div>
              <div class="col-md-3 text-end">
                <button id="btnCustSearch" class="btn btn-primary btn-sm px-3">조회</button>
              </div>
            </div>
    
            <!-- Toast UI Grid 영역 -->
            <div id="custModalGrid" style="height:260px;"></div>
    
          </div>
    
          <!-- 푸터 -->
          <div class="modal-footer py-2">
            <button type="button" class="btn btn-primary btn-sm" id="btnCustSelect">확인</button>
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>
          </div>
    
        </div>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.min.css">
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/modal/custModel.js}"></script>
</body>

</html>

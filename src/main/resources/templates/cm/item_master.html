<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>품번 등록 및 조회</title>

<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

<style>

/* 품번 자동생성 버튼 - input 높이 맞춤 */
.btn-auto-sku {
	height: 36px; /* input 높이와 동일 */
	padding: 0 12px;
	font-size: 14px;
	line-height: 1;
	display: flex;
	align-items: center; /* 세로 중앙 정렬 */
	white-space: nowrap;
}

.search-card .card-ui__body {
	height: 120px;
	padding: 16px;
	display: flex;
	align-items: center;
	overflow: hidden;
}

.search-row {
	width: 100%;
	display: grid;
	grid-template-columns: 1fr 1fr 1fr auto;
	gap: 14px;
	align-items: center;
}

.search-field {
	display: flex;
	align-items: center;
	gap: 10px;
	min-width: 0;
}

.search-label {
	min-width: 46px;
	text-align: right;
	font-size: var(--fs-s);
	font-weight: 700;
	white-space: nowrap;
	line-height: 1;
}

.search-field .input-base, .search-field .form-select {
	height: 36px;
	font-size: 14px;
}

.search-actions {
	display: flex;
	align-items: center;
	gap: 8px;
	justify-content: flex-end;
	white-space: nowrap;
}

.content-grid {
	display: grid;
	grid-template-columns: 1.3fr 1fr;
	gap: 10px;
	flex: 1 1 auto;
	overflow: hidden;
}

.item-form {
	background: var(--white-color);
	color: var(--black-color);
}

.item-form .input-base, .item-form select, .item-form textarea {
	background-color: #fff !important;
	color: #000 !important;
	border: 1px solid var(--mid-light-gray-color);
	font-size: var(--fs-s);
}

.item-form textarea {
	resize: none;
	min-height: 70px;
}
</style>
</head>

<body>
	<section class="page page-fluid" layout:fragment="content">

		<!-- 검색 영역 (원복 UI) -->
		<section class="card-ui card-ui--search search-card">
			<div class="card-ui__body">
				<div class="search-row">

					<div class="search-field">
						<span class="search-label">품번</span> <input id="searchSku"
							class="form-control input-base" placeholder="품번">
					</div>

					<div class="search-field">
						<span class="search-label">품명</span> <input id="searchSkuName"
							class="form-control input-base" placeholder="품명">
					</div>

					<div class="search-field">
						<span class="search-label">분류</span> <select id="searchSkuType"
							class="form-select input-base">
							<option value="">전체</option>
							<option value="ITEM">원자재</option>
							<option value="GOODS">부자재</option>
							<option value="MODEL">제품</option>
						</select>
					</div>

					<div class="search-actions">
						<button id="btnReset" class="btn btn-inner btn-white">초기화</button>
						<button id="btnSearch" class="btn btn-outer btn-color">조회</button>
					</div>

				</div>
			</div>
		</section>

		<section class="content-grid">

			<!-- 왼쪽 GRID -->
			<div class="card-ui section-flex">
				<div class="card-ui__header">
					<h3 class="card-ui__title">품목 목록</h3>
				</div>
				<div class="card-ui__body">
					<div id="itemGrid" style="height: 620px;"></div>
				</div>
			</div>

			<!-- 오른쪽 FORM -->
			<div class="card-ui section-flex item-form">
				<div class="card-ui__header">
					<h3 class="card-ui__title">품번 등록 / 수정</h3>
					<div>
						<button id="btnNew" class="btn btn-inner btn-white">신규</button>
						<button id="btnSave" class="btn btn-inner btn-color">저장</button>
					</div>
				</div>

				<div class="card-ui__body section-scroll">

					<div class="form-grid">
						<div class="form-grid__row">
							<div class="form-grid__label">품번</div>
							<div class="form-grid__field" style="display: flex; gap: 6px;">
								<input id="itemSku" class="input-base" placeholder="자동생성"
									readonly>
								<button id="btnAutoSku"
        class="btn btn-outline-secondary btn-auto-sku">
    자동생성
</button>

							</div>

							<div class="form-grid__label">품명</div>
							<div class="form-grid__field">
								<input id="itemSkuName" class="input-base" placeholder="품명">
							</div>
						</div>

						<div class="form-grid__row">
							<div class="form-grid__label">분류</div>
							<div class="form-grid__field">
								<select id="itemSkuType" class="input-base">
									<option value="ITEM">원자재</option>
									<option value="GOODS">부자재</option>
									<option value="MODEL">제품</option>
								</select>
							</div>

							<div class="form-grid__label">단위</div>
							<div class="form-grid__field">
								<select id="itemUnit" class="input-base">
									<option value="EA">EA</option>
									<option value="KG">KG</option>
									<option value="L">L</option>
								</select>
							</div>
						</div>

						<div class="form-grid__row">
							<div class="form-grid__label">규격</div>
							<div class="form-grid__field form-grid__field--wide">
								<input id="itemSpec" class="input-base" placeholder="규격">
							</div>
						</div>

						<div class="form-grid__row">
							<div class="form-grid__label">비고</div>
							<div class="form-grid__field form-grid__field--wide">
								<textarea id="itemRemark" class="input-base" placeholder="비고"></textarea>
							</div>
						</div>

						<div class="form-grid__row">
							<div class="form-grid__label">사용여부</div>
							<div class="form-grid__field form-grid__field--checkbox">
								<label><input type="radio" name="useYn" value="Y"
									checked> 사용</label> &nbsp;&nbsp; <label><input
									type="radio" name="useYn" value="N"> 미사용</label>
							</div>

							<div class="form-grid__label">과세여부</div>
							<div class="form-grid__field form-grid__field--checkbox">
								<label><input type="radio" name="taxYn" value="Y"
									checked> 과세</label> &nbsp;&nbsp; <label><input
									type="radio" name="taxYn" value="N"> 면세</label>
							</div>
						</div>
					</div>

				</div>
			</div>

		</section>
	</section>

	<div layout:fragment="script">
		<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

		<script>
    const $ = (id) => document.getElementById(id);

    const btnSearch = $('btnSearch');
    const btnReset  = $('btnReset');
    const btnNew    = $('btnNew');
    const btnSave   = $('btnSave');
    const btnAutoSku = $('btnAutoSku');

    const searchSku     = $('searchSku');
    const searchSkuName = $('searchSkuName');
    const searchSkuType = $('searchSkuType');

    const itemSku      = $('itemSku');
    const itemSkuName  = $('itemSkuName');
    const itemSkuType  = $('itemSkuType');
    const itemUnit     = $('itemUnit');
    const itemSpec     = $('itemSpec');
    const itemRemark   = $('itemRemark');

    function resetDetailForm() {
      itemSku.value = '';
      itemSkuName.value = '';
      itemSkuType.value = 'ITEM';
      itemUnit.value = 'EA';
      itemSpec.value = '';
      itemRemark.value = '';
      document.querySelector('[name=useYn][value=Y]').checked = true;
      document.querySelector('[name=taxYn][value=Y]').checked = true;
    }

    const grid = new tui.Grid({
      el: document.getElementById('itemGrid'),
      data: [],
      rowHeaders: ['rowNum'],
      bodyHeight: 620,
      columns: [
        { header:'품번', name:'sku', width: 150, align: 'center' },
        { header:'품명', name:'skuName', minWidth: 180, align: 'center' },
        { header:'분류', name:'skuType', width: 120, align: 'center' },
        { header:'단위', name:'unit', width: 90, align: 'center' },
        { header:'사용여부', name:'useYn', width: 100, align: 'center' }
      ]
    });

    function normalizeList(resp){
      if (Array.isArray(resp)) return resp;
      if (!resp || typeof resp !== 'object') return [];
      return resp.data || resp.list || resp.result || resp.rows || resp.items || [];
    }

    // 조회
    btnSearch.onclick = async () => {
      try {
        const res = await fetch('/api/cm/item/search', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            companyCode: '0000',
            sku: searchSku.value?.trim(),
            skuName: searchSkuName.value?.trim(),
            skuType: searchSkuType.value
          })
        });

        const json = await res.json().catch(() => ({}));
        const list = normalizeList(json);

        grid.resetData(list);
        grid.refreshLayout();
      } catch (e) {
        console.error(e);
        grid.resetData([]);
        grid.refreshLayout();
      }
    };

    // 검색 초기화
    btnReset.onclick = () => {
      searchSku.value = '';
      searchSkuName.value = '';
      searchSkuType.value = '';
      grid.resetData([]);
      grid.refreshLayout();
      resetDetailForm();
    };

    // 신규
    btnNew.onclick = () => {
  isEditMode = false;          // 🔓 신규 모드
  btnAutoSku.disabled = false;
  resetDetailForm();
};


    // 자동생성 (S00061 규칙)
    btnAutoSku.onclick = async () => {
      try {
        const res = await fetch('/api/cm/item/sku?companyCode=0000');
        const json = await res.json();
        itemSku.value = json.sku;
      } catch (e) {
        console.error(e);
        alert('품번 자동생성 실패');
      }
    };

    // 저장 (신규/수정 공용)
    btnSave.onclick = async () => {
      try {
        if (!itemSku.value?.trim()) {
          alert('품번 자동생성을 먼저 해주세요.');
          return;
        }
        if (!itemSkuName.value?.trim()) {
          alert('품명을 입력해주세요.');
          return;
        }

        await fetch('/api/cm/item/save', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            companyCode:'0000',
            sku: itemSku.value.trim(),
            skuName: itemSkuName.value.trim(),
            skuType: itemSkuType.value,
            unit: itemUnit.value,
            spec: itemSpec.value?.trim(),
            remark: itemRemark.value?.trim(),
            useYn: document.querySelector('[name=useYn]:checked')?.value || 'Y',
            taxYn: document.querySelector('[name=taxYn]:checked')?.value || 'Y'
          })
        });

        alert('저장 완료');
        btnSearch.click();
        resetDetailForm();
      } catch (e) {
        console.error(e);
        alert('저장 중 오류가 발생했습니다.');
      }
    };

    // Grid 클릭 → 상세 바인딩 (수정 가능)
    grid.on('click', ev => {
      if (ev.rowKey == null) return;
      const row = grid.getRow(ev.rowKey);
      if (!row) return;
      
      isEditMode = true;           // 🔒 수정 모드
      btnAutoSku.disabled = true;  // 🔒 자동생성 잠금


      itemSku.value = row.sku ?? '';
      itemSkuName.value = row.skuName ?? '';
      itemSkuType.value = row.skuType ?? 'ITEM';
      itemUnit.value = row.unit ?? 'EA';
      itemSpec.value = row.spec ?? '';
      itemRemark.value = row.remark ?? '';

      document.querySelectorAll('[name=useYn]').forEach(r => r.checked = (r.value === (row.useYn ?? 'Y')));
      document.querySelectorAll('[name=taxYn]').forEach(r => r.checked = (r.value === (row.taxYn ?? 'Y')));
    });

    window.addEventListener('load', () => grid.refreshLayout());
  </script>
	</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>CoreOne ERP - Dashboard</title>

<!-- TOAST UI GRID -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- general.css -->
<link th:href="@{/css/general.css}" rel="stylesheet" />
<style>
body {
	background-color: #f8f9fa;
}

.card {
	border: none;
	border-radius: 10px;
	box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
	transition: transform 0.2s;
}

.card:hover {
	transform: translateY(-5px);
}

.stat-icon {
	font-size: 2.5rem;
	opacity: 0.3;
	position: absolute;
	right: 20px;
	bottom: 20px;
}
</style>
</head>

<body>
	<!-- 레이아웃의 department 영역 채우기 -->
	<div layout:fragment="content">
		<div class="container-fluid py-2">

			<div class="row g-3 mb-2">
				<div class="col-md-3">
					<div class="card bg-danger text-white p-3">
						<h5>미처리 수주 건수</h5>
						<h2>12건</h2>
						<i class="fas fa-exclamation-triangle stat-icon"></i>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card bg-primary text-white p-3">
						<h5>금일 완료 수주 건수</h5>
						<h2>5건</h2>
						<i class="fas fa-shipping-fast stat-icon"></i>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card bg-success text-white p-3">
						<h5>금일 수주액</h5>
						<h2>₩ 100,000,000</h2>
						<i class="fas fa-shopping-cart stat-icon"></i>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card bg-info text-white p-3" style="min-height: 110px;">
						<div class="d-flex justify-content-between">
							<div>
								<h5>오늘의 날씨</h5>
								<h2 class="mb-0">--°C</h2>
								<small>대구광역시</small>
							</div>
							<div class="text-center">
								<i class="fas fa-cloud-sun fa-3x opacity-75"></i>
								<div class="small">로딩 중...</div>
							</div>
						</div>
					</div>
				</div>

			</div>

			<div class="row g-4 mb-2">
				<div class="col-lg-8">
					<div class="card h-100">
						<div class="card-header bg-white fw-bold">
							<i class="fas fa-chart-line me-2"></i>월간 매출 및 수주 추이
						</div>
						<div class="card-body">
							<canvas id="salesChart" height="200"></canvas>
						</div>
					</div>
				</div>
				<div class="col-lg-4">
					<div class="card h-100">
						<div class="card-header bg-white fw-bold">
							<i class="fas fa-handshake me-2 text-primary"></i>주요 거래처별 매출 비중
						</div>
						<div
							class="card-body d-flex justify-content-center align-items-center"
							style="height: 300px;">
							<canvas id="leaveChart"></canvas>
						</div>
					</div>
				</div>
			</div>

			<div class="row g-4">
				<div class="col-md-4">
					<div class="card" style="height: 300px;">
						<div
							class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
							<span><i class="fas fa-address-book me-2 text-info"></i>임직원
								연락처</span>
							<div class="input-group input-group-sm ms-auto" style="width: 100px;">
								<input id="payrollName" type="text" class="form-control input-base" style="flex: 1; min-width: 0" placeholder="성명검색..." />
							</div>
							<div
								class="col-12 col-md-4 d-flex align-items-center justify-content-end gap-2 ms-auto">
								<button id="btnPayrollReset" type="button"
									class="btn btn-white btn-outer" style="flex-shrink: 0;">초기화</button>
								<button id="btnPayrollSearch" type="button"
									class="btn btn-color btn-outer" style="flex-shrink: 0;">조회</button>
							</div>

						</div>
						<div id="userContact" class="grid-root"></div>
					</div>
				</div>
				<div class="col-md-4">
					<div class="card h-100">
						<div
							class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
							<span><i class="fas fa-headset me-2 text-primary"></i>공지사항</span>
							<button class="btn btn-sm btn-outline-secondary">더보기</button>
						</div>
						<div class="card-body p-0">
							<ul class="list-group list-group-flush">
								<li
									class="list-group-item d-flex justify-content-between align-items-center">
									<div>
										<div class="fw-bold">연차 신청 취소 방법 문의</div>
										<small class="text-muted">작성자: 인사팀 김철수 | 10분 전</small>
									</div> <span class="badge bg-warning text-dark">진행중</span>
								</li>
								<li
									class="list-group-item d-flex justify-content-between align-items-center">
									<div>
										<div class="fw-bold">회계 전표 승인 권한 요청</div>
										<small class="text-muted">작성자: 영업팀 이영희 | 1시간 전</small>
									</div> <span class="badge bg-info">접수</span>
								</li>
							</ul>
						</div>
					</div>
				</div>

				<div class="col-md-4">
					<div class="card h-100" style="min-height: 300px;">
						<div
							class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
							<span><i class="fas fa-plane-departure me-2 text-success"></i>오늘의
								휴가자</span> <span class="badge bg-success"
								th:text="${todayLeaveList != null ? todayLeaveList.size() : 0} + '명'">0명</span>
						</div>
						<div class="card-body p-0">
							<div class="table-responsive"
								style="max-height: 245px; overflow-y: auto;">
								<table class="table table-sm table-hover align-middle mb-0">
									<tbody border="0">
										<tr th:if="${#lists.isEmpty(todayLeaveList)}">
											<td colspan="2" class="text-center py-5 text-muted"><i
												class="fas fa-user-check d-block mb-2 fa-2x"></i> 오늘은 휴가자가
												없습니다.</td>
										</tr>
										<tr th:each="leave : ${todayLeaveList}">
											<td class="ps-3 py-2">
												<div class="fw-bold" th:text="${leave.userName}">방재우</div> <small
												class="text-muted" th:text="${leave.deptName}">영업팀</small>
											</td>
											<td class="text-end pe-3"><span
												th:if="${leave.leaveType == '연차'}" class="badge bg-primary">연차</span>
												<span th:if="${leave.leaveType == '오전반차'}"
												class="badge bg-info text-dark">오전반차</span> <span
												th:if="${leave.leaveType == '오후반차'}"
												class="badge bg-warning text-dark">오후반차</span></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<script src="/js/cm/dashBoard.js"></script>
	</div>

</body>

</html>

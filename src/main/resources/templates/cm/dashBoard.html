<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>CoreOne ERP - Dashboard</title>

<!-- TOAST UI GRID -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

<!-- Bootstrap(기존 레이아웃 유지용) -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- general.css -->
<link th:href="@{/css/general.css}" rel="stylesheet" />

<style>

/**=========================
 * Dashboard only (깔끔톤)
 * ========================= */
.rc-dashboard-wrap {
	background: #f5f7fb;
	padding: 14px;
	height: 500px;
}

/* 기존 Bootstrap 카드 느낌 제거 */
.rc-dashboard-wrap .card {
	border: 1px solid #e6eaf2 !important;
	border-radius: 14px !important;
	box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
	transition: transform .12s ease, box-shadow .12s ease;
	overflow: hidden;
}

.rc-dashboard-wrap .card:hover {
	transform: translateY(-2px);
	box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
}

/* KPI 카드 공통 */
.kpi-card {
	padding: 14px 16px !important;
	min-height: 110px;
	position: relative;
}

.kpi-title {
	font-size: 12px;
	font-weight: 700;
	color: #6b7280;
	margin: 0 0 6px 0;
}

.kpi-value {
	font-size: 22px;
	font-weight: 900;
	letter-spacing: -0.3px;
	margin: 0;
	color: #1f2937;
	font-variant-numeric: tabular-nums;
}

/* KPI 아이콘(왼쪽 배지 형태) */
.kpi-badge {
	width: 44px;
	height: 44px;
	border-radius: 12px;
	display: flex;
	align-items: center;
	justify-content: center;
	background: rgba(54, 77, 153, 0.12);
	color: var(--base-color, #364d99);
	flex: 0 0 auto;
	font-size: 18px;
}

.kpi-row {
	display: flex;
	align-items: center;
	gap: 12px;
}

/* 미처리 수주: 왼쪽 빨간 라인 + 은은한 배경 */
.rc-dashboard-wrap .card.kpi-danger {
	background: rgba(220, 38, 38, 0.06) !important;
	border: 1px solid rgba(220, 38, 38, 0.5) !important;
}

.kpi-danger .kpi-badge {
	background: rgba(220, 38, 38, 0.14);
	color: #dc2626;
}

/* 날씨 카드: class는 유지(bg-info)하되, 색은 은은하게 오버라이드
       ✅ 중요: JS가 .card.bg-info 를 찾으므로 bg-info 클래스는 유지해야 함 */
.rc-dashboard-wrap .card.bg-info {
	background: #ffffff !important; /* 과한 하늘색 제거 */
	color: #1f2937 !important; /* text-white 무력화 */
	border-color: #e6eaf2 !important;
}

.rc-dashboard-wrap .card.bg-info h5 {
	font-size: 12px;
	font-weight: 800;
	color: #6b7280;
	margin: 0 0 6px 0;
}

.rc-dashboard-wrap .card.bg-info h2 {
	font-size: 22px;
	font-weight: 900;
	margin: 0;
	color: #1f2937;
}

.rc-dashboard-wrap .card.bg-info small, .rc-dashboard-wrap .card.bg-info .small
	{
	color: #6b7280 !important;
	font-weight: 600;
}
/* 날씨 아이콘 영역이 JS에서 innerHTML로 교체되므로, 이미지가 예쁘게 들어가게 */
.rc-dashboard-wrap .card.bg-info .text-center img {
	display: block;
	margin: 0 auto;
	width: 64px !important;
	height: 64px !important;
}

/* 카드 헤더(차트/공지/휴가자 등) */
.rc-card-header {
	background: transparent !important;
	border-bottom: 1px solid #e6eaf2 !important;
	font-weight: 900 !important;
	color: #1f2937 !important;
	padding: 14px 16px !important;
	font-size: 14px;
}

/* 차트 영역 높이 */
.chart-box {
	height: 260px;
}

.chart-box canvas {
	width: 100% !important;
	height: 100% !important;
}

/* Grid 영역 높이 */
#userContact {
	height: 230px;
}

/* 공지/휴가 리스트 패딩 정리 */
.list-group-item {
	border-color: #e6eaf2 !important;
	padding: 12px 14px;
}

/* KPI 카드: 세로 중앙(=justify-content) */
.rc-dashboard-wrap .card.kpi-card {
	display: flex !important;
	flex-direction: column !important; /* 부트스트랩 카드 방향 명시 */
	justify-content: center !important; /* ✅ 세로 중앙 */
}

/* KPI 내부 row: 아이콘/텍스트 정렬 */
.rc-dashboard-wrap .card.kpi-card .kpi-row {
	display: flex !important;
	align-items: center !important; /* ✅ row 내부 세로 중앙 */
	width: 100%;
}

/* 날씨 카드도 같은 방식으로 중앙 (날씨는 구조가 달라서 따로) */
.rc-dashboard-wrap .card.bg-info.kpi-card {
	display: flex !important;
	flex-direction: column !important;
	justify-content: center !important;
}

.rc-dashboard-wrap .card.bg-info.kpi-card>.d-flex {
	align-items: center !important;
	width: 100%;
}
</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="rc-dashboard-wrap">

			<div class="container-fluid py-2">

				<!-- KPI 4개 -->
				<div class="row g-3 mb-1">

					<!-- 미처리 수주 -->
					<div class="col-12 col-md-6 col-xl-3">
						<div class="card kpi-card kpi-danger">
							<div class="kpi-row">
								<div class="kpi-badge">
									<i class="fas fa-exclamation-triangle"></i>
								</div>
								<div>
									<p class="kpi-title">금일 미처리 수주 건수</p>
									<p class="kpi-value" id="nosuzu"></p>
								</div>
							</div>
						</div>
					</div>

					<!-- 금일 완료 -->
					<div class="col-12 col-md-6 col-xl-3">
						<div class="card kpi-card">
							<div class="kpi-row">
								<div class="kpi-badge">
									<i class="fas fa-shipping-fast"></i>
								</div>
								<div>
									<p class="kpi-title">금일 완료 수주 건수</p>
									<p class="kpi-value" id="todaysuzu"></p>
								</div>
							</div>
						</div>
					</div>

					<!-- 금일 수주액 -->
					<div class="col-12 col-md-6 col-xl-3">
						<div class="card kpi-card">
							<div class="kpi-row">
								<div class="kpi-badge">
									<i class="fas fa-shopping-cart"></i>
								</div>
								<div>
									<p class="kpi-title">금일 수주액</p>
									<p class="kpi-value" id="todaySuzuPrice">₩ 100,000,000</p>
								</div>
							</div>
						</div>
					</div>

					<!-- ✅ 날씨: JS 안 고칠 거면 "기존 구조 유지" 필수 -->
					<div class="col-12 col-md-6 col-xl-3">
						<div class="card bg-info text-white p-3 kpi-card"
							style="min-height: 110px;">
							<div class="d-flex justify-content-between">
								<div>
									<h5>오늘의 날씨</h5>
									<h2 class="mb-0">--°C</h2>
									<small>대구광역시</small>
								</div>
								<div class="text-center">
									<i class="fas fa-cloud-sun fa-3x opacity-75"></i>
									<div class="small">로딩 중...</div>
								</div>
							</div>
						</div>
					</div>

				</div>

				<!-- 차트 2개 -->
				<div class="row g-3 mb-1">
					<div class="col-12 col-lg-8">
						<div class="card h-100">
							<div class="rc-card-header">
								<i class="fas fa-chart-line me-2"></i>월간 매출 및 수주 추이
							</div>
							<div class="card-body">
								<div class="chart-box">
									<canvas id="salesChart"></canvas>
								</div>
							</div>
						</div>
					</div>

					<div class="col-12 col-lg-4">
						<div class="card h-100">
							<div class="rc-card-header">
								<i class="fas fa-handshake me-2"></i>주요 거래처별 수주 비중
							</div>
							<div class="card-body">
								<div class="chart-box">
									<canvas id="leaveChart"></canvas>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- 하단 3개 -->
				<div class="row g-3">
					<!-- 임직원 연락처 -->
					<div class="col-12 col-lg-6">
						<div class="card" style="height: 300px;">
							<div class="rc-card-header">
								<i class="fas fa-address-book me-2"></i>임직원 연락처
							</div>
							<div class="card-body p-2">
								<div id="userContact"></div>
							</div>
						</div>
					</div>

					<!-- 오늘의 휴가자 -->
					<div class="col-12 col-lg-6">
						<div class="card h-100" style="min-height: 300px;">
							<div
								class="rc-card-header d-flex justify-content-between align-items-center">
								<span><i class="fas fa-plane-departure me-2"></i>오늘의 휴가자</span>
							</div>
							<div class="card-body p-2"
								style="position: relative; min-height: 250px;">
								<div id="DashBoardAnnualLeaveDetail"></div>
							</div>
						</div>
					</div>

				</div>

			</div>

			<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
			<script src="/js/cm/dashBoard.js"></script>
		</div>
	</div>
</body>
</html>

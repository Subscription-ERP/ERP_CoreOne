<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>

<title>부서코드관리</title>

<!-- SheetJS CDN -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- ToastUI Grid -->
<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<!-- ToastUI Date/Time Picker CSS -->
<link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
<link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
<!-- ToastUI JS -->
<script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.js"></script>
<script src="https://uicdn.toast.com/tui.dom/latest/tui-dom.js"></script>
<script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.min.js"></script>
<script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
<!-- general.css -->
<link th:href="@{/css/general.css}" rel="stylesheet" />
<link th:href="@{/css/hr/hrUser.css}" rel="stylesheet" />

<style>
/* =========================================
 * 상단 검색바 상태값 운영, 종료 라디오 버튼 위치 조정
 * ========================================= */
#status_0, #status_1 {
	margin-left: 10px;
	margin-right: 10px;
}
</style>
</head>

<body>
	<div layout:fragment="content" class="page page-fluid">
		<div class="row">
			<!-- ==================== 조회 ================================================================== -->
			<section class="card-ui card-ui--search" style="margin-top: 10px; display: flex; margin-left: 18px; width: 98%; padding: 0;">
				<div class="card-ui__body" style="flex: 1; display: flex; align-items: center;">
					<div class="filter-bar row g-4 align-items-center col-md-12">
						<!-- 부서명 -->
						<div class="col-12 col-md-3">
							<div class="field-inline">
								<label for="deptName" class="field-inline__label me-4">부서명</label> <select id="deptName" class="form-select input-base" style="flex: 1; min-width: 0"></select>
							</div>
						</div>

						<!-- 상위 부서명 -->
						<div class="col-12 col-md-3">
							<div class="field-inline">
								<label for="upperDeptNameSearch" class="field-inline__label">상위 부서명</label> <select id="upperDeptNameSearch" class="form-select input-base" style="flex: 1; min-width: 0"></select>
							</div>
						</div>

						<!-- 상태 -->
						<div class="col-12 col-md-3">
							<div class="field-inline">
								<label for="status" class="field-inline__label">상태값</label> <select id="status" class="form-select input-base" style="flex: 1; min-width: 0"></select>
							</div>
						</div>

						<!-- 초기화 조회 버튼 -->
						<div class="col-12 col-md-3 d-flex justify-content-end gap-2">
							<button id="deptCodeManageBtnReset" type="button" class="btn btn-white btn-outer" style="flex-shrink: 0;">초기화</button>
							<button id="deptCodeManageBtnSearch" type="button" class="btn btn-color btn-outer" style="flex-shrink: 0;">조회</button>
						</div>

						<!-- 부서레벨 범위 -->
						<div class="col-12 col-md-3 mt-0">
							<div class="field-inline">
								<label for="payrollDate" class="field-inline__label" style="width: 80px">부서레벨</label>
								<!-- 범위 input -->
								<div id="deptCodeManageStartLevelWrapper">
									<input id="deptCodeManageStartLevel" type="number" class="form-control input-base" style="flex: 1; min-width: 0" />
								</div>
								~
								<div id="deptCodeManageEndLevelWrapper">
									<input id="deptCodeManageEndLevel" type="number" class="form-control input-base" style="flex: 1; min-width: 0" />
								</div>

							</div>
						</div>
					</div>
				</div>
			</section>
			<div class="col-lg-8 pe-0">

				<!-- ================= 목록(Grid) 섹션 ================= -->
				<section class="card-ui section-flex" style="margin-top: 10px; height: 650px;">
					<header class="card-ui__header">
						<h6 class="card-ui__title">부서 목록</h6>
					</header>
					<!-- 부서목록조회 -->
					<div id="deptCodeManageGrid" class="grid-root"></div>
				</section>
			</div>
			<div class="col-lg-4 ps-0">
				<section class="card-ui section-flex" style="margin-top: 10px">
					<header class="card-ui__header">
						<h6 class="card-ui__title">부서 등록</h6>
						<!-- 우측 액션 -->
						<div class="toolbar" id="chogihwa">
							<button id="DeptSelectBtn" type="button" class="btn btn-white btn-inner ms-auto" style="width: 100px">부서선택</button>
							<button id="deptCodeManageInsertBtnReset" type="button" class="btn btn-white btn-inner ms-auto">초기화</button>
							<button id="deptCodeManageBtnSave" type="button" class="btn btn-color btn-inner ms-auto">저장</button>
						</div>
					</header>

					<div class="card-ui__body section-scroll">
						<div id="tab-basic" class="tab-panel active">
							<div class="form-grid">
								<div class="form-grid__row">
									<div class="form-grid__label">부서코드</div>
									<div class="form-grid__field form-grid__field--wide" id="payrollPeriodParent">
										<input id="deptCodeManageDeptCode" name="deptCodeManageDeptCode" type="text" class="form-control form-control-sm input-base" disabled readonly />
									</div>
								</div>
								<div class="form-grid__row">
									<div class="form-grid__label" style="white-space: nowrap">부서명</div>
									<div class="form-grid__field form-grid__field--wide">
										<input id="deptCodeManageDeptName" name="deptCodeManageDeptName" type="text" class="form-control form-control-sm input-base" />
									</div>
								</div>
								<div class="form-grid__row">
									<div class="form-grid__label">상위부서코드</div>
									<div class="form-grid__field form-grid__field--wide">
										<input type="text" id="deptCodeManageUpperDeptCode" name="deptCodeManageUpperDeptCode" class="form-control form-control-sm input-base" disabled readonly placeholder="부서선택 버튼을 클릭하고 왼쪽 부서목록에서 상위부서를 지정해주세요" />
									</div>
								</div>
								<div class="form-grid__row">
									<div class="form-grid__label">상위부서명</div>
									<div class="form-grid__field form-grid__field--wide">
										<input type="text" id="deptCodeManageUpperDeptName" name="deptCodeManageUpperDeptName" class="form-control form-control-sm input-base" disabled readonly placeholder="지정안할시 최상위 부서(부서 레벨 1)로 등록됩니다." />
									</div>
								</div>
								<div class="form-grid__row">
									<div class="form-grid__label">부서 레벨/계층</div>
									<div class="form-grid__field form-grid__field--wide" id="payrollStartDateWrapper">
										<input id="deptCodeManagedeptLevel" name="deptCodeManagedeptLevel" type="text" class="form-control form-control-sm input-base" disabled readonly />
									</div>
								</div>
								<div class="form-grid__row">
									<div class="form-grid__label">적용시작일</div>
									<div class="form-grid__field form-grid__field--wide" id="payrollEndDateWrapper">
										<input id="deptCodeManageStartDate" name="deptCodeManageStartDate" type="date" class="form-control form-control-sm input-base" />
									</div>
								</div>
								<div class="form-grid__row">
									<div class="form-grid__label">적용종료일</div>
									<div class="form-grid__field form-grid__field--wide" id="payrollEndDateWrapper">
										<input id="deptCodeManageEndDate" name="deptCodeManageEndDate" type="date" class="form-control form-control-sm input-base" />
									</div>
								</div>
								<div class="form-grid__row">
									<div class="form-grid__label">상태</div>
									<div class="form-grid__field form-grid__field--wide" id="payrollBonusDateWrapper">
										<input id="deptCodeManageStatus" name="deptCodeManageStatus" type="text" class="form-control form-control-sm input-base" disabled readonly />
									</div>
								</div>
								<div class="form-grid__row">
									<div class="form-grid__label">부서 관리자</div>
									<div class="form-grid__field form-grid__field--wide">
										<input id="deptCodeManageDeptMng" name="deptCodeManageDeptMng" type="text" class="form-control form-control-sm input-base" />
									</div>
								</div>
								<div class="form-grid__row" style="height: 200px">
									<div class="form-grid__label">비고</div>
									<div class="form-grid__field form-grid__field--wide">
										<textarea id="deptCodeManageRm" name="deptCodeManageRm" style="height: 200px; box-shadow: none; resize: none; border: none;" class="form-control form-control-sm"></textarea>
										<!-- resize:none;을하면 textarea가 크기변경할수없이 고정된다. border:none하면 테두리가 사라진다 -->
									</div>
								</div>
							</div>
						</div>
					</div>
				</section>
			</div>
		</div>
		<!-- ==================== 급여관리모달창 ================================================================== -->
		<div id="payrollManageModal" class="modal-layer" hidden>
			<div class="modal-layer__backdrop"></div>

			<div class="modal-layer__dialog">
				<!-- 상단 헤더 -->
				<header class="modal-card__header">
					<h5 class="modal-card__title">급여관리</h5>
					<button type="button" class="btn-icon modal-card__btn-close" id="btnPayrollManageClose">
						<i class="bi bi-x-lg"></i>
					</button>

				</header>
				<div style="padding-right: 30px; text-align: right; padding-bottom: 10px;">
					<button id="btnPayrollSave" type="button" class="btn btn-color btn-inner ms-auto">확정</button>
				</div>

				<!-- 내용 -->
				<div class="modal-card__body">

					<!-- 급여대장 나오는 테이블 -->
					<div id="payrollDetailGrid" class="grid-root" style="height: 240px; margin-bottom: 20px;"></div>
					<!-- 상세 수당총액 -->
					<h6 class="card-ui__title mb-2">상세 수당 총액</h6>
					<table class="table table-bordered table-sm table-summary">
						<thead>
							<tr style="text-align: center;">
								<th>임금 항목</th>
								<th>연장근로수당</th>
								<th>야간근로수당</th>
								<th>휴일근로수당</th>
								<th>가족수당</th>
								<th>식대 (비과세)</th>
								<th>연차휴가수당</th>
								<th>총 수당 총액</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td style="text-align: center;">지급 금액(원)</td>
								<td class="text-end" id="overtime"></td>
								<td class="text-end" id="night"></td>
								<td class="text-end" id="holiday"></td>
								<td class="text-end" id="family"></td>
								<td class="text-end" id="meal"></td>
								<td class="text-end" id="annual_leave"></td>
								<td class="text-end" id="total_allowance"></td>
							</tr>
						</tbody>
					</table>

					<h6 class="card-ui__title mb-2 mt-4">상세 공제 총액</h6>
					<table class="table table-bordered table-sm table-summary">
						<thead>
							<tr style="text-align: center;">
								<th>임금 항목</th>
								<th>소득세</th>
								<th>국민연금</th>
								<th>고용보험</th>
								<th>건강보험</th>
								<th>장기요양보험</th>
								<th>지방소득세</th>
								<th>결근병가공제</th>
								<th>총 공제 총액</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td style="text-align: center;">지급 금액(원)</td>
								<td class="text-end" id=""></td>
								<td class="text-end" id="national_pension"></td>
								<td class="text-end" id="employment_insurance"></td>
								<td class="text-end" id="health_insurance"></td>
								<td class="text-end" id="long_time_care_insurance"></td>
								<td class="text-end" id=""></td>
								<td class="text-end" id="absence"></td>
								<td class="text-end" id="total_deduction_amount"></td>
							</tr>
						</tbody>
					</table>

				</div>
				<footer class="modal-card__footer d-flex justify-content-end"> </footer>
				<!-- // modal-card__body -->
			</div>
			<!-- // modal-layer__dialog -->
		</div>
		<!-- 전역 토스트 알림 -->
		<div id="toastContainer" class="rc-toast"></div>
		<!-- 공통코드 불러오는 스크립트 -->
		<script th:src="@{/js/common.js}"></script>
		<script th:src="@{/js/cm/deptCodeManage.js}"></script>
	</div>
</body>
</html>

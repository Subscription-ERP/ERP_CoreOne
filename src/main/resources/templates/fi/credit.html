<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8" />
<title>여신관리</title>

<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.min.css">
<script src="https://uicdn.toast.com/grid/latest/tui-grid.min.js"></script>

</head>
<body>
<div layout:fragment="content">

<!-- ==========================
     조회조건
=========================== -->
<div class="container-fluid px-2" style="height:120px;margin:5px 0;">
  <div class="card h-100">
    <div class="card-body py-2">

      <div class="d-flex justify-content-between align-items-center h-100">

        <!-- 조회조건 -->
        <div class="flex-grow-1">

          <div class="row g-2">

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">거래처코드</label>
              <input type="text" class="form-control">
            </div>

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">거래처명</label>
              <input type="text" class="form-control">
            </div>

          </div>

        </div>

        <!-- 조회 버튼 -->
        <div class="d-flex flex-column align-items-end justify-content-center" style="min-width:200px;">
          <div class="d-flex gap-2">
            <button class="btn btn-primary" style="width:110px;">조회</button>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>



<!-- ==========================
     메인영역 (GRID + 입력폼)
=========================== -->
<div class="container-fluid px-2" style="height: calc(98vh - 125px - 135px);">
  <div class="row h-100">

    <!-- GRID -->
    <div class="col-md-8 h-100">
      <div class="card h-100">
        <div class="card-body p-0">
          <div id="credit-grid" style="height:100%;"></div>
        </div>
      </div>
    </div>

    <!-- 입력폼 -->
    <div class="col-md-4 h-100" style="padding-left:0;">
      <div class="card h-100">

        <!-- 버튼 -->
        <div class="card-header d-flex justify-content-end gap-2">
          <button class="btn btn-outline-secondary">초기화</button>
          <button class="btn btn-primary">등록</button>
        </div>

        <div class="card-body">

          <!-- 입력 -->
          <div class="mb-3 d-flex align-items-center gap-2">
            <label class="fw-semibold" style="width:120px;">거래처</label>
            <div class="input-group">
              <input type="text" class="form-control">
              <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
            </div>
          </div>

          <div class="mb-3 d-flex align-items-center gap-2">
            <label class="fw-semibold" style="width:120px;">거래처명</label>
            <input type="text" class="form-control" readonly>
          </div>

          <div class="mb-3 d-flex align-items-center gap-2">
            <label class="fw-semibold" style="width:120px;">여신구분</label>
            <select class="form-select">
              <option value="">선택</option>
              <option>매출여신</option>
              <option>매입여신</option>
            </select>
          </div>

          <div class="mb-3 d-flex align-items-center gap-2">
            <label class="fw-semibold" style="width:120px;">여신한도</label>
            <input type="number" class="form-control">
          </div>

          <div class="mb-3 d-flex align-items-center gap-2">
            <label class="fw-semibold" style="width:120px;">외상한도일</label>
            <input type="number" class="form-control">
          </div>

        </div>

      </div>
    </div>

  </div>
</div>

<style>
  body, html { overflow-x: hidden !important; }

  .card-header { border-bottom: none !important; }
</style>

</div>
</body>
</html>

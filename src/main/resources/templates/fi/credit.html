<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8" />
<title>여신관리</title>

<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.min.css">
<script src="https://uicdn.toast.com/grid/latest/tui-grid.min.js"></script>
<link th:href="@{/css/general.css}" rel="stylesheet" />



</head>
<body>
<div layout:fragment="content">

<!-- ==========================
     조회조건
=========================== -->
<div class="container-fluid px-2" style="height:120px;margin:5px 0;">
  <div class="card h-100">
    <div class="card-body py-2">

      <div class="d-flex justify-content-between align-items-center h-100">

        <!-- 조회조건 -->
        <div class="flex-grow-1">

          <div class="row g-2">

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">거래처코드</label>
              <input type="text" class="form-control input-base" id="selectcustcode">
            </div>

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">거래처명</label>
              <input type="text" class="form-control input-base" id="selectcustname">
            </div>

          </div>

        </div>

        <!-- 조회 버튼 -->
        <div class="d-flex flex-column align-items-end justify-content-center" style="min-width:200px;">
          <div class="d-flex gap-2">
            <button class="btn btn-color btn-outer" id=btnSearch>조회</button>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>


<!-- ==========================
     메인영역 (GRID + 입력폼)
=========================== -->
<div class="container-fluid px-2" style="height: calc(98vh - 125px - 135px);">
  <div class="row h-100">

    <!-- GRID -->
    <div class="col-md-8 h-100">
      <div class="card h-100">
        <div class="card-body p-0">
          <div id="credit-grid" style="height:100%;"></div>
        </div>
      </div>
    </div>

    <!-- 입력폼 -->
    <div class="col-md-4 h-100" style="padding-left:0;">
      <div class="card h-100">
        
        <!-- 버튼 -->
        <div class="card-header d-flex justify-content-end gap-2">
          <button class="btn btn-white btn-inner">초기화</button>
          <button id="btnSave" class="btn btn-color btn-inner">등록</button>
        </div>

        <div class="card-body">

          <form id="creditForm">
            <table class="form-grid table-bordered align-middle" style="border:1px gray;">
				  <div th:replace="modal/custModal :: custModal"></div>

              <tbody>
                <!-- 거래처 -->
                <tr>
                  <th class="bg-light text-center" style="width:130px;">거래처</th>
                  <td style="width:75%;">
                    <div class="input-group">
                      <input type="text" name="custCode" id="custCode" class="form-control input-base-icon">
                      <button class="btn btn-icon" id="btnOpenCustModal"><i class="bi bi-search"></i></button>
                    </div>
                  </td>
                </tr>

                <!-- 거래처명 -->
                <tr>
                  <th class="bg-light text-center">거래처명</th>
                  <td class="disabled"><input type="text" name="custName" id="custName" class="form-control input-base" readonly></td>
                </tr>

                <!-- 여신구분 -->
                <tr>
                  <th class="bg-light text-center">여신구분</th>
                  <td>
                    <select name="creditType" class="form-select input-base">
                      <option value="">선택</option>
                    </select>
                  </td>
                </tr>

                <!-- 여신한도 -->
                <tr>
                  <th class="bg-light text-center">여신한도</th>
                  <td><input type="number" name="creditLimit" class="form-control input-base"></td>
                </tr>

                <!-- 외상한도일 -->
                <tr>
                  <th class="bg-light text-center">외상한도일</th>
                  <td><input type="number" name="dueDays" class="form-control input-base"></td>
                </tr>

              </tbody>
            </table>
          </form>

        </div>

      </div>
    </div>

  </div>
</div>


<script th:src="@{/js/fi/credit.js}"></script>

<style>
  body, html {
    overflow-x: hidden !important;
  }
  .app-main {
    overflow-x: hidden !important;
  }
  .card-header {
  border-bottom: none !important;
  box-shadow: none !important;
  }
  .input-base{
  width:80%;}
</style>
</div>
</body>
</html>

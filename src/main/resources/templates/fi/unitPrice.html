<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8" />
<title>세금계산서 화면 예시</title>

<!-- Toast UI Grid -->
<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.min.css">
<script src="https://uicdn.toast.com/grid/latest/tui-grid.min.js"></script>
  <link th:href="@{/css/general.css}" rel="stylesheet" />

</head>
<body>
<div layout:fragment="content">

  <!-- =======================
       조회조건 (CARD 묶음)
  ======================== -->
 <!-- =======================
     조회조건 (CARD 묶음)
======================== -->
<div class="container-fluid px-2" style="height:120px;margin-bottom:5px;margin-top:5px;">

  <div class="card h-100">
    <div class="card-body py-2">

      <!-- ✔ 세로정렬을 중앙으로 -->
      <div class="d-flex justify-content-between align-items-center h-100">

        <!-- 좌측 조건들 -->
        <div class="flex-grow-1">

          <div class="row g-2">

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">품번</label>
              <input type="text" class="form-control" id="selectsku">
            </div>

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">품명</label>
              <input type="text" class="form-control" id="selectskuname">
            </div>

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">단가유형</label>
              <select class="form-select" id="selectunitpricetype" name = "selectunitpricetype">
                <option value="">선택</option>
              </select>
            </div>

          </div>

          <div class="row g-2 mt-2">

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">거래처코드</label>
              <input type="text" class="form-control" id="selectcustcode">
            </div>

            <div class="col-md-3 d-flex align-items-center gap-2">
              <label class="fw-semibold mb-0" style="width:150px;">거래처명</label>
              <input type="text" class="form-control" id="selectcustname">
            </div>

          </div>

        </div>

        <!-- 버튼 영역 (오른쪽) -->
        <div class="d-flex flex-column align-items-end justify-content-center" style="min-width:200px;">
          <div class="d-flex gap-2">
            <button class="btn btn-secondary" style="width:110px;">EXCEL</button>
            <button class="btn btn-color btn-outer" style="width:110px;" id="btnSearch" >조회</button>
          </div>
        </div>

      </div>

    </div>
  </div>

</div>



  <!-- =======================
       메인영역 = GRID + 입력폼
  ======================== -->
  <div class="container-fluid px-2" style="height: calc(98vh - 125px - 135px);">
    <div class="row h-100">

      <!-- 좌측 GRID -->
      <div class="col-md-8 h-100">
        <div class="card h-100">
          <div class="card-body p-0">
            <div id="unitprice-grid" style="height:100%;"></div>
          </div>
        </div>
      </div>

      <!-- 우측 입력폼 -->
      <div class="col-md-4 h-100" style="padding-left:0;">
        <div class="card h-100">

			  <!-- 버튼 (카드 내부 오른쪽 상단) -->
			  <div class="card-header d-flex justify-content-end gap-2">
			    <button class="btn btn-white btn-inner">초기화</button>
			    <button class="btn btn-color btn-inner" id="btnSave">저장</button>
			  </div>
			
			  <div class="card-body" style= "width:100%">
			
			    <form id="unitPriceForm">
			
			      <table class="form-grid table-bordered align-middle" style="border:1px gray;">
			        <tbody>
			
			          <!-- 품번 -->
			          <tr>
			            <th class="bg-light text-center" style="width:130px;">품번</th>
			            <td style="width:75%;">
			              <div class="input-group">
			                <input type="text" class="form-control input-base-icon" name="insertsku">
			                <button class="btn btn-icon">
			                  <i class="bi bi-search"></i>
			                </button>
			              </div>
			            </td>
			          </tr>
			
			          <!-- 품명 -->
			          <tr>
			            <th class="bg-light text-center">품명</th>
			            <td class="disabled">
			              <input type="text" class="form-control input-base" readonly name="insertskuname">
			            </td>
			          </tr>
			
			          <!-- 단가유형 -->
			          <tr>
			            <th class="bg-light text-center">단가유형</th>
			            <td>
			              <select class="form-select input-base" name="insertunitpricetype">
			                <option value="">선택</option>
			              </select>
			            </td>
			          </tr>
			
			          <!-- 적용일자 -->
			          <tr>
			            <th class="bg-light text-center">적용일자</th>
			            <td>
			              <input type="date" class="form-control input-base" name="insertstartdate">
			            </td>
			          </tr>
			
			          <!-- 거래처 -->
			          <tr>
			            <th class="bg-light text-center">거래처</th>
			            <td>
			              <div class="input-group">
			                <input type="text" class="form-control input-base-icon" name="insertcustcode">
			                <button class="btn btn-icon">
			                  <i class="bi bi-search"></i>
			                </button>
			              </div>
			            </td>
			          </tr>
			
			          <!-- 거래처명 -->
			          <tr>
			            <th class="bg-light text-center">거래처명</th>
			            <td>
			              <input type="text" class="form-control input-base" readonly name="insertcustname">
			            </td>
			          </tr>
			
			          <!-- 기준단가 -->
			          <tr>
			            <th class="bg-light text-center">기준단가</th>
			            <td>
			              <input type="number" class="form-control input-base" name="insertunitprice">
			            </td>
			          </tr>
			
			        </tbody>
			      </table>
			
			    </form>
			
			  </div>
			
			</div>
        
      </div>

    </div>
  </div>

<script th:src="@{/js/fi/unitPrice.js}"></script>


<style>
  body, html {
    overflow-x: hidden !important;
  }
  .app-main {
    overflow-x: hidden !important;
  }
  .card-header {
  border-bottom: none !important;
  box-shadow: none !important;
  }
  .input-base{
  width:80%;}
</style>

</div>
</body>
</html>
